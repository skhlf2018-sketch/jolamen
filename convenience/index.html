<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>졸라맨 편의점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* 한 가지 분위기(새벽 편의점)로 고정한 게임 화면: 밤하늘 남색 + 형광등 흰색 + 간판 노랑 + 낙서 먹색 */
:root{
  color-scheme:dark;
  --ink:#16141d; --paper:#fbfaf4; --paper2:#efece2;
  --night:#070a1a; --night2:#111733; --glass:rgba(12,16,38,.78);
  --brand:#ffcc2e; --brand-deep:#e0a400; --red:#e8412c; --green:#2fbf71;
  --lcd:#98f7bd; --lcd-bg:#0a1a12; --muted:#aab2d6; --line:rgba(255,255,255,.18);
  --fd:"Black Han Sans","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fb:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fm:"Nanum Gothic Coding",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:#fff;font-family:var(--fb);font-size:17px;line-height:1.45;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font-family:var(--fb);cursor:pointer}
button:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.app{position:relative;height:100%;overflow:hidden;background:var(--night)}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:none}
.screen>*{pointer-events:auto}

/* ---------- 버튼: 낙서 스티커 느낌 ---------- */
.btn{border:3px solid var(--ink);border-radius:16px;background:var(--brand);color:var(--ink);font-size:20px;padding:10px 22px;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:24px;padding:13px 30px;min-width:220px}
.btn.alt{background:var(--paper)}
.btn.ghost{background:rgba(10,14,34,.72);color:#fff;border-color:#fff;box-shadow:0 4px 0 rgba(255,255,255,.35)}
.btn.sm{font-size:16px;padding:6px 14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.ghost.sm{box-shadow:0 3px 0 rgba(255,255,255,.35)}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{filter:grayscale(1);opacity:.55;cursor:default;transform:none}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* ---------- 타이틀 ---------- */
#title{display:flex;flex-direction:column;align-items:center;padding:5vh 16px 3vh;background:linear-gradient(180deg,rgba(5,7,26,.55),rgba(5,7,26,0) 45%,rgba(5,7,26,0) 60%,rgba(5,7,26,.7))}
.logo{text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.series{display:inline-block;font-size:16px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 14px;transform:rotate(-3deg)}
.logo h1{margin:0;font-family:var(--fd);font-weight:400;font-size:clamp(42px,9vw,86px);line-height:1.05;text-shadow:0 4px 0 var(--ink),0 0 30px rgba(0,0,0,.6);letter-spacing:.02em}
.logo h1 b{font-weight:400;display:inline-block;background:var(--brand);color:var(--ink);padding:0 .22em;border:4px solid var(--ink);border-radius:.18em;margin-left:.12em;
  box-shadow:0 0 34px rgba(255,204,46,.65);text-shadow:none;transform:rotate(1.5deg)}
.logo .sub{margin:0;font-size:clamp(16px,2.6vw,21px);color:#fff;text-shadow:0 2px 6px #000}
.menu{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:auto;margin-bottom:14px}
.foot{margin:0;font-size:14px;color:var(--muted);text-shadow:0 1px 4px #000;pointer-events:none}

/* ---------- 오프닝 ---------- */
.op-top{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.op-top>*{pointer-events:auto}
.op-no{font-family:var(--fm);font-size:14px;color:#fff;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:999px}
.op-sub{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);width:min(760px,calc(100% - 32px));box-sizing:border-box;text-align:center;
  font-size:clamp(18px,2.6vw,23px);line-height:1.45;padding:12px 20px;border-radius:16px;background:rgba(8,10,24,.8);color:#fff;text-wrap:balance;animation:subIn .4s ease-out}
@keyframes subIn{from{opacity:0;transform:translate(-50%,10px)}}
.op-actions{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:12px}

/* ---------- 게임 화면 ---------- */
.topbar{position:absolute;top:10px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.lcd{display:flex;align-items:baseline;gap:10px;background:var(--lcd-bg);border:3px solid #22382c;border-radius:12px;padding:4px 12px;font-family:var(--fm);color:var(--lcd);
  box-shadow:inset 0 0 12px rgba(152,247,189,.25),0 3px 0 rgba(0,0,0,.4)}
.lcd span{font-size:14px;opacity:.85}.lcd b{font-size:22px;letter-spacing:.04em;text-shadow:0 0 8px rgba(152,247,189,.7)}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-size:17px;backdrop-filter:blur(6px)}
.chip.role{background:var(--brand);color:var(--ink);border-color:var(--ink)}
.chip.money b{font-family:var(--fm);font-weight:700;font-size:18px}
.chip.stars{color:var(--brand);letter-spacing:1px}
.gap{flex:1}
.icon{border:2px solid var(--line);background:var(--glass);color:#fff;border-radius:12px;font-size:17px;padding:6px 12px}
.icon.hot{background:var(--brand);color:var(--ink);border-color:var(--ink)}
.icon.quit{border-color:rgba(255,120,110,.7)}
@media (max-width:1240px){#hQuit .lbl,#hMis .lbl,#hRep .lbl{display:none}}
@media (max-width:1000px){.icon .lbl{display:none}.icon{padding:5px 10px}#keysHelp{top:110px}}

#bubbles{position:absolute;inset:0;pointer-events:none}
.cb{position:absolute;transform:translate(-50%,-100%);max-width:min(300px,70vw);pointer-events:none}
.cb .say{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:7px 13px;font-size:18px;line-height:1.35;text-align:center;
  box-shadow:0 4px 0 rgba(0,0,0,.35);position:relative;text-wrap:balance}
.cb .say:after{content:"";position:absolute;left:50%;bottom:-12px;width:16px;height:16px;background:var(--paper);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.cb .who{font-size:13px;color:#5a5670;display:block}
.cb.side{transform:translate(-100%,-50%)}
.cb.side .say:after{left:auto;right:-11px;bottom:auto;top:50%;transform:translateY(-50%) rotate(-45deg)}
.cb .req{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:5px}
.cb .req i{font-style:normal;font-size:14px;background:#ffe9a8;border:2px solid var(--ink);border-radius:8px;padding:0 6px}
.cb .req i.done{background:#c9f2d8;text-decoration:line-through}
.pat{height:9px;margin:14px auto 0;width:120px;border-radius:9px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.7);overflow:hidden}
.pat i{display:block;height:100%;background:var(--green);transition:width .2s}
.pat i.mid{background:#ffcc2e}.pat i.low{background:var(--red)}

.bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.hint{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);background:rgba(8,10,24,.82);border:2px solid rgba(255,204,46,.55);border-radius:999px;padding:5px 16px;font-size:17px;text-align:center;max-width:calc(100% - 24px);box-sizing:border-box;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint:empty{display:none}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:auto;max-width:100%}
.abtn{border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);font-size:17px;padding:7px 14px;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;gap:6px}
.abtn small{font-size:12px;color:#6a6680}
.abtn.need{background:var(--brand);animation:pulse 1s ease-in-out infinite}
.abtn:disabled{opacity:.5;box-shadow:0 2px 0 var(--ink)}
.posbar{display:flex;align-items:baseline;gap:8px;background:var(--lcd-bg);border:3px solid #22382c;border-radius:12px;padding:4px 12px;font-family:var(--fm);color:var(--lcd)}
.posbar b{font-size:20px;text-shadow:0 0 8px rgba(152,247,189,.6)}.posbar span{font-size:13px;opacity:.85}

/* ---------- 졸라맨 속마음 (오른쪽 위) ---------- */
.talk{position:absolute;top:62px;right:12px;display:flex;align-items:flex-start;gap:0;max-width:min(470px,calc(100% - 24px));z-index:6;pointer-events:auto;animation:talkIn .3s ease-out}
@keyframes talkIn{from{opacity:0;transform:translateY(-10px)}}
.talk-box{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:9px 14px 10px;box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;min-width:0}
.talk-box .nm{font-size:14px;color:#7a5a10}
.talk-box p{margin:2px 0 0;font-size:19px;line-height:1.4;min-height:1.4em}
.talk-box .tact{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.talk canvas{width:92px;height:92px;flex:0 0 auto;margin-left:-6px;margin-top:-4px}

/* ---------- 금고 (거스름돈) ---------- */
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);box-sizing:border-box;background:#2a2d38;border:3px solid var(--ink);border-bottom:0;
  border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:7;box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:sheetIn .25s ease-out}
@keyframes sheetIn{from{transform:translate(-50%,40%)}}
.sheet h3{margin:0;font-family:var(--fd);font-weight:400;font-size:22px}
.dr-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.dr-info div{background:var(--lcd-bg);border-radius:10px;padding:6px 10px;font-family:var(--fm);color:var(--lcd)}
.dr-info small{display:block;font-size:12px;opacity:.8}.dr-info b{font-size:20px}
.tray{min-height:54px;background:#1b1d25;border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px}
.tray img{height:38px}.tray .sum{margin-left:auto;font-family:var(--fm);color:#fff;font-size:18px;padding:0 6px}
.cash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cash-grid button{border:2px solid rgba(255,255,255,.2);background:#3a3e4c;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-size:13px}
.cash-grid button img{height:46px;max-width:100%}
.cash-grid button:active{background:#50556a}
.dr-act{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}

/* ---------- 모달 (영수증) ---------- */
.modal{position:absolute;inset:0;background:rgba(3,4,12,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:8;overflow:auto}
.dialog{width:min(430px,100%);max-height:100%;overflow:auto;padding:4px 0;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.receipt{background:var(--paper);color:var(--ink);font-family:var(--fm);padding:18px 20px 20px;position:relative;margin:12px 0}
.receipt:before,.receipt:after{content:"";position:absolute;left:0;right:0;height:10px;background:linear-gradient(-45deg,transparent 7px,var(--paper) 0),linear-gradient(45deg,transparent 7px,var(--paper) 0);background-size:14px 20px;background-repeat:repeat-x}
.receipt:after{bottom:-10px;background-position:left top}
.receipt:before{top:-10px;transform:rotate(180deg);background-position:left top}
.receipt h2{font-family:var(--fd);font-weight:400;font-size:28px;text-align:center;margin:4px 0 2px}
.receipt .c{text-align:center;font-size:13px;color:#555}
.receipt hr{border:0;border-top:2px dashed #999;margin:10px 0}
.receipt .ln{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:2px 0}
.receipt .ln.t{font-weight:700;font-size:19px}
.receipt .pos{color:#1d7a45}.receipt .neg{color:#b3261e}
.receipt .note{font-family:var(--fb);font-size:16px;line-height:1.45;margin:8px 0 0;color:#333}
.receipt .grade{font-family:var(--fd);font-size:54px;text-align:center;line-height:1;margin:6px 0}
.receipt .acts{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;font-family:var(--fb)}
.panel{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.panel h2{font-family:var(--fd);font-weight:400;margin:0 0 8px;font-size:26px}
.panel p{margin:6px 0}
.ups{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.up{display:flex;align-items:center;gap:10px;border:2px solid #d8d3c4;border-radius:14px;padding:8px 10px;background:#fff}
.up div{flex:1;min-width:0}.up b{font-size:17px}.up small{display:block;color:#5d5a66;font-size:14px;line-height:1.35}
.up.own{background:#eaf7ee;border-color:#9fd9b2}
.up .btn{white-space:nowrap}
.up-h{margin:12px 0 0;font-size:16px}.up small.uplv{display:inline;color:#7a5a10;font-size:13px}.up .ph-bar{height:8px;margin:5px 0 0;border-width:1.5px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #ccc;font-size:17px}
.switch{width:54px;height:30px;border-radius:30px;border:3px solid var(--ink);background:#ccc;position:relative}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.switch[aria-checked="true"]{background:var(--green)}.switch[aria-checked="true"]:after{left:24px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.replays{display:grid;gap:12px;margin:14px 0 4px}
.replays .btn{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.replays .btn small{font-size:14px;font-weight:500;opacity:.85}
.replays .btn:disabled{opacity:.55;cursor:not-allowed}

.keys{position:absolute;left:12px;top:60px;font-size:14px;color:#fff;background:rgba(8,10,24,.75);border:2px solid rgba(255,204,46,.5);border-radius:10px;padding:4px 10px;pointer-events:none;max-width:calc(100% - 24px);transition:opacity .6s}
.keys.gone{opacity:0}
.stick{display:none;position:absolute;left:18px;bottom:18px;width:118px;height:118px;border-radius:50%;background:rgba(10,14,34,.45);border:3px solid rgba(255,255,255,.55);touch-action:none;z-index:4}
.stick .knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--brand);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);pointer-events:none}
@media (pointer:coarse){.stick{display:block}.keys{display:none}}
#gl{touch-action:none;cursor:grab}#gl:active{cursor:grabbing}
/* 게임용 손 커서 (마우스 화살표 대신 졸라맨 낙서 손) */
.app.handcur,.app.handcur *{cursor:var(--hc)!important}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:5;animation:bannerIn 2.2s ease-in-out forwards}
.banner b{display:block;font-family:var(--fd);font-weight:400;font-size:clamp(40px,8vw,72px);color:var(--brand);text-shadow:0 5px 0 var(--ink),0 0 30px rgba(0,0,0,.7)}
.banner span{font-size:20px;background:rgba(0,0,0,.6);padding:4px 14px;border-radius:999px}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-40%) scale(.9)}15%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;font-size:17px;z-index:9;animation:toast 2.2s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
/* ---------- 전화기 (리모델링 회사) ---------- */
.icon.hot{animation:pulse 1.1s ease-in-out infinite;font-weight:700}
.phone{background:#1c1e26;border:3px solid var(--ink);border-radius:30px;padding:12px 12px 14px;box-shadow:0 8px 0 rgba(0,0,0,.45);color:#fff}
.ph-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;color:#c9cfe8;padding:0 8px 8px}
.ph-scr{background:var(--paper);color:var(--ink);border-radius:18px;padding:12px 14px}
.ph-say{margin:0 0 10px;font-size:17px;line-height:1.45}
.ph-card{border:2px solid #d8d3c4;border-radius:14px;padding:10px 12px;background:#fff}
.ph-card .lv,.rm-done .lv{font-size:13px;color:#7a5a10}
.ph-card h3{margin:0 0 6px;font-family:var(--fd);font-weight:400;font-size:24px}
.ph-card p{margin:0;font-size:15px}
.ph-card ul,.rm-done ul{margin:0;padding-left:20px;font-size:15px;line-height:1.55}
.ph-card small,.rm small{font-size:13px;color:#5d5a66}
.ph-cost{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-family:var(--fm)}
.ph-cost b{font-size:20px}
.ph-bar{height:12px;border-radius:12px;background:#e6e1d4;border:2px solid var(--ink);overflow:hidden;margin:6px 0 2px}
.ph-bar i{display:block;height:100%;background:var(--green)}
.ph-list{list-style:none;margin:10px 0 0;padding:0;max-height:120px;overflow:auto;font-size:14px;border-top:2px dashed #cfc9b8;position:relative}
.ph-list li{display:flex;justify-content:space-between;gap:8px;padding:4px 4px;border-bottom:1px dashed #ddd;color:#8a8696}
.ph-list li.done{color:#1d7a45}.ph-list li.next{color:var(--ink);background:#fff3c4;font-weight:700}
.phone .acts{justify-content:space-between;margin-top:10px}
.rm{margin-top:4px}
.rm-done h2{margin:0 0 6px}
.rm-done .say{font-size:16px;line-height:1.45;background:#fff7d6;border-radius:12px;padding:8px 10px;margin:6px 0 10px}
/* ---------- 졸팡 (내 폰 쇼핑 앱) ---------- */
.icon{position:relative}
.icon .badge{position:absolute;top:-8px;right:-8px;min-width:21px;height:21px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--red);color:#fff;border:2px solid var(--ink);font-style:normal;font-size:12px;line-height:17px;text-align:center;font-family:var(--fm);font-weight:700}
#hMoney.debt{color:#ff8a7a}
.jp{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:30px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.jp-top{display:flex;justify-content:space-between;padding:7px 20px 2px;font-size:13px;font-family:var(--fm);color:#666}
.jp-head{display:flex;align-items:center;gap:10px;padding:2px 14px 8px;border-bottom:2px solid #eee;flex-wrap:wrap}
.jp-logo{font-family:var(--fd);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:.02em}.jp-logo i{font-style:normal;color:#e2483d}.jp-logo i+i{color:#1f5fd1}
.jp-rocket{font-size:13px;background:#e8f0ff;color:#1f5fd1;border-radius:999px;padding:3px 10px}
.jp-banner{margin:8px 12px 0;background:#fff4c8;border-radius:12px;padding:6px 10px;font-size:14px;line-height:1.4}
.jp-tools{display:flex;gap:8px;padding:8px 12px 4px}
.jp-list{overflow:auto;padding:2px 12px;flex:1;min-height:110px}
.jp-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #ddd}
.jp-ic{font-size:24px;width:30px;text-align:center;flex:0 0 auto}
.jp-nm{flex:1;min-width:0}.jp-nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function korNum(n,from=1e4){
  n=Math.max(0,Math.round(n));
  if(n<from||n<1e4)return n.toLocaleString("ko-KR");
  for(let i=0;i<UNITS.length;i++){
    const [u,name]=UNITS[i];if(n<u)continue;

const tierNow=()=>STORE_TIERS[state.tier||0];

const moneyScale=(t=state.tier||0)=>Math.pow(10,Math.floor(Math.log10(STORE_TIERS[t].pm)+1e-9));
function priceOf(key,t=state.tier||0){
  if(key==="bag")return 100*moneyScale(t);
  const unit=10*moneyScale(t),v=PRODUCTS[key].price*STORE_TIERS[t].pm;
  return Math.max(unit,Math.round(v/unit)*unit);
}

function pickPremium(){
  const list=PREMIUM.filter(k=>PRODUCTS[k].tier<=(state.tier||0));if(!list.length)return null;
  return Math.random()<.5?list[list.length-1]:pick(list);
}

const Snd={
  sfx:true,music:true,ctx:null,sfxGain:null,musicGain:null,noise:null,timer:null,step:0,next:0,humNode:null,
  loadPrefs(){try{const p=JSON.parse(localStorage.getItem(PREF_KEY)||"{}");if(p.sfx===false)this.sfx=false;if(p.music===false)this.music=false}catch(e){}},
  savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify({sfx:this.sfx,music:this.music}))}catch(e){}},
  wake(){
    if(!this.ctx){
      try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
      const c=this.ctx,master=c.createGain();master.gain.value=.8;master.connect(c.destination);
      this.sfxGain=c.createGain();this.sfxGain.connect(master);
      this.musicGain=c.createGain();this.musicGain.gain.value=.5;this.musicGain.connect(master);
      const buf=c.createBuffer(1,c.sampleRate*.5,c.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      this.noise=buf;
    }
    if(this.ctx.state==="suspended")this.ctx.resume().catch(()=>{});
    if(this.music)this.startMusic();
  },
  tone(f,dur,type="sine",vol=.1,delay=0,music=false){
    if(!this.ctx||(music?!this.music:!this.sfx))return;
    const c=this.ctx,t=(music?0:c.currentTime)+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(music?this.musicGain:this.sfxGain);o.start(t);o.stop(t+dur+.05);
  },
  slide(f1,f2,dur,type="sawtooth",vol=.06,delay=0){
    if(!this.ctx||!this.sfx)return;
    const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(this.sfxGain);o.start(t);o.stop(t+dur+.05);
  },
  noiseHit(freq,dur,vol,type="bandpass",delay=0){
    if(!this.ctx||!this.sfx)return;
    const c=this.ctx,t=c.currentTime+delay,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.noise;f.type=type;f.frequency.value=freq;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.sfxGain);s.start(t);s.stop(t+dur+.02);
  },
  startMusic(){
    if(!this.ctx||this.timer)return;
    this.step=0;this.next=this.ctx.currentTime+.1;
    this.timer=setInterval(()=>this.schedule(),60);
  },
  stopMusic(){clearInterval(this.timer);this.timer=null},
  // 새벽 편의점 로파이: 느린 7화음 + 가끔 멜로디
  schedule(){
    const c=this.ctx,SP=60/78/2;
    const PROG=[[50,53,57,60],[43,50,53,57],[48,52,55,59],[45,52,55,60]];
    const MEL=[74,null,72,null,69,null,null,null, 72,null,69,67,null,null,64,null, 67,null,69,72,null,74,null,null, 76,null,74,null,72,null,null,null];
    const mf=m=>440*Math.pow(2,(m-69)/12);
    while(this.next<c.currentTime+.3){
      const s=this.step,t=this.next,ch=PROG[Math.floor(s/8)];
      if(s%8===0)ch.forEach((n,i)=>this.tone(mf(n),SP*7.5,"triangle",.028,t+i*.03,true));
      if(s%4===0)this.tone(mf(ch[0]-12),SP*3.6,"sine",.12,t,true);
      if(MEL[s])this.tone(mf(MEL[s]),SP*1.8,"sine",.045,t,true);
      if(s%2===1&&this.noise){const s2=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
        s2.buffer=this.noise;f.type="highpass";f.frequency.value=8000;g.gain.setValueAtTime(.012,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);
        s2.connect(f);f.connect(g);g.connect(this.musicGain);s2.start(t);s2.stop(t+.05)}
      this.step=(s+1)%32;this.next+=SP;
    }
  },
  click(){this.tone(620,.05,"triangle",.07)},
  beep(){this.tone(2350,.07,"square",.05);this.tone(2350,.09,"square",.05,.1)},          // 삐빅
  errBeep(){this.tone(420,.18,"square",.05);this.tone(320,.25,"square",.05,.16)},
  chime(){this.tone(1319,.5,"sine",.08);this.tone(1047,.7,"sine",.07,.28)},               // 딩동~
  drawer(){this.noiseHit(1800,.12,.25);this.tone(160,.12,"square",.06,.02)},               // 철컥
  coin(){this.tone(2637,.08,"triangle",.05);this.tone(3136,.14,"sine",.04,.05)},
  card(){this.tone(1568,.1,"sine",.07);this.tone(2093,.25,"sine",.07,.1)},                  // 띠링
  ding(){this.tone(2093,.9,"sine",.08);this.tone(4186,.5,"sine",.02)},                      // 띵!
  // 전자레인지 웅~ (소리 노드는 humNode 에. 예전엔 함수 이름과 겹쳐서 두 번째 부를 때 멈췄다)
  hum(on){if(!this.ctx)return;
    if(on&&!this.humNode&&this.sfx){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type="sawtooth";o.frequency.value=110;g.gain.value=.012;o.connect(g);g.connect(this.sfxGain);o.start();this.humNode={o,g}}
    if(!on&&this.humNode){try{this.humNode.o.stop()}catch(e){}this.humNode=null}},
  pour(){this.noiseHit(900,1.4,.08,"lowpass")},
  sizzle(){this.noiseHit(5000,.8,.05,"highpass")},
  bag(){this.noiseHit(3000,.18,.12,"highpass")},
  angry(){this.slide(300,160,.4,"sawtooth",.05)},
  happy(){[784,988,1175].forEach((f,i)=>this.tone(f,.14,"triangle",.06,i*.07))},
  fanfare(){[523,523,784,659,784,1047].forEach((f,i)=>this.tone(f,.22,"square",.045,i*.11))},
  fail(){this.tone(233,.22,"sawtooth",.05);this.tone(165,.45,"sawtooth",.05,.18)},
  thud(){this.tone(110,.18,"sine",.2);this.tone(70,.25,"triangle",.12,.02)},
  boing(){this.slide(200,700,.28,"sine",.14)},
  creak(){this.slide(380,250,.32,"sawtooth",.03);this.slide(250,430,.22,"square",.012,.26)},
  scream(){this.slide(900,240,1.5,"sawtooth",.045);this.slide(680,200,1.5,"square",.025,.06)},
  whoosh(){this.noiseHit(1200,.4,.12)},
  erase(){this.noiseHit(2600,.22,.1);this.noiseHit(2200,.22,.1,"bandpass",.18)},
  honk(){this.tone(392,.35,"square",.05);this.tone(466,.35,"square",.04);this.tone(392,.5,"square",.05,.45);this.tone(466,.5,"square",.04,.45)},
  sparkle(){[1976,2349,2637,3136].forEach((f,i)=>this.tone(f,.2,"sine",.035,i*.06))},
  // 따르르릉 (옛날 전화 벨)
  ring(){for(let i=0;i<14;i++){this.tone(i%2?1320:1580,.05,"square",.028,i*.055)}for(let i=0;i<14;i++){this.tone(i%2?1320:1580,.05,"square",.028,.95+i*.055)}},
  hammer(delay=0){this.noiseHit(1400,.09,.3,"bandpass",delay);this.tone(190,.08,"square",.06,delay)}
};

const INK="#1f1d2b", PAPER="#fffdf7", MINT="#2f9d85", KETCHUP="#e2483d", MUSTARD="#f4b63f";
const FONT_D='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const FONT_M='"Nanum Gothic Coding",ui-monospace,monospace';
const TAU=Math.PI*2;
const seeded=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function makeCanvas(cv,W,H){
  const ctx=cv.getContext("2d");ctx.__W=W;
  return {ctx,W,H,fit(){
    const w0=cv.getBoundingClientRect().width||W;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const w=Math.max(1,Math.round(w0*dpr)), h=Math.max(1,Math.round(w*H/W));
    // 캔버스 속 글씨 배율: 화면에 작게 보일수록(휴대폰) 글씨를 더 키운다
    ctx.__ts=clamp(W*.8/w0,1.1,1.35);
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
    ctx.setTransform(w/W,0,0,h/H,0,0);
  }};
}
function rr(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function circle(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.stroke()}
}
function text(ctx,str,x,y,size,color,align="center",font=FONT_D){rawText(ctx,str,x,y,size*(ctx.__ts||1),color,align,font)}
function rawText(ctx,str,x,y,px,color,align="center",font=FONT_D){
  ctx.font=`${px}px ${font}`;ctx.textAlign=align;ctx.textBaseline="middle";
  ctx.fillStyle=color;ctx.fillText(str,x,y);
}
// 칸 폭(maxW)을 넘으면 글자 크기를 줄여서 쓴다
function fitText(ctx,str,x,y,maxW,size,color,align="center",min=9){
  size*=ctx.__ts||1;ctx.font=`${size}px ${FONT_D}`;const w=ctx.measureText(str).width;
  const s=w>maxW?Math.max(min,Math.floor(size*maxW/w)):size;
  rawText(ctx,str,x,y,s,color,align);return s;
}
function outlinedText(ctx,str,x,y,size,fill,stroke=INK,lw=6){
  ctx.font=`${size*(ctx.__ts||1)}px ${FONT_D}`;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.lineJoin="round";ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeText(str,x,y);
  ctx.fillStyle=fill;ctx.fillText(str,x,y);
}
function bubble(ctx,str,x,y,tx,ty,size=22){
  size*=ctx.__ts||1;
  ctx.font=`${size}px ${FONT_D}`;
  const w=ctx.measureText(str).width+28, h=size+22;
  const bx=clamp(x-w/2,6,(ctx.__W||720)-w-6), by=y-h/2;
  ctx.fillStyle=PAPER;ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.lineJoin="round";
  rr(ctx,bx,by,w,h,14);ctx.fill();ctx.stroke();
  // 말꼬리
  const mx=clamp(tx,bx+18,bx+w-18);
  ctx.beginPath();ctx.moveTo(mx-9,by+h-1.5);ctx.lineTo(tx,ty);ctx.lineTo(mx+9,by+h-1.5);
  ctx.fill();ctx.stroke();
  ctx.fillRect(mx-7.5,by+h-4,15,4);
  rawText(ctx,str,bx+w/2,by+h/2+1,size,INK);
}

function getPose(o){
  const t=o.t||0, p=o.pose||"stand";
  let lean=0, legs, arms, head=0;
  const standLegs=[[.12,.08],[-.12,-.08]];
  switch(p){
    case "walk": case "run":{
      const amp=p==="run"?.75:.5, s=Math.sin(t), c=Math.cos(t), s2=-s, c2=-c;
      legs=[[amp*s,amp*s-.55*Math.max(0,c)],[amp*s2,amp*s2-.55*Math.max(0,c2)]];
      arms=[[-amp*.9*s,-amp*.9*s+.4],[-amp*.9*s2,-amp*.9*s2+.4]];
      lean=p==="run"?.2:.05;break;}
    case "bend": lean=1.25;legs=[[.8,-.3],[.7,-.35]];arms=[[.5,.3],[.35,.2]];break;
    case "sit": legs=[[1.55,0],[1.45,.05]];arms=[[.75,1.45],[.6,1.35]];lean=-.04;break;
    case "eat": legs=[[1.55,0],[1.45,.05]];arms=[[.45,2.45+.4*Math.sin(t*7)],[.65,1.4]];lean=.08+.04*Math.sin(t*7);break;
    case "cheer":{const w=.25*Math.sin(t*9);legs=[[.2,.1],[-.2,-.1]];arms=[[2.45+w,2.85+w],[-2.45-w,-2.85-w]];break;}
    case "wave": legs=standLegs;arms=[[2.35,2.7+.45*Math.sin(t*8)],[-.25,-.15]];break;
    case "photo": legs=[[.15,.1],[-.12,-.08]];arms=[[1.25,2.3],[1.05,2.45]];lean=-.06;break;
    case "cook":{const k=Math.sin(t*6);legs=standLegs;arms=[[.95+.15*k,1.65+.3*k],[.8,1.55]];lean=.08;break;}
    case "sad": legs=[[.06,.04],[-.06,-.04]];arms=[[.06,.03],[-.06,-.03]];lean=.22;head=.35;break;
    case "look": legs=standLegs;arms=[[1.7,2.75],[-.2,-.1]];break;
    case "hold": legs=standLegs;arms=[[2.6,3.0],[-.25,-.15]];break;
    case "give": legs=standLegs;arms=[[1.35,1.55],[1.2,1.5]];lean=.12;break;
    case "carry":{const s=Math.sin(t),c=Math.cos(t);
      legs=[[.45*s,.45*s-.5*Math.max(0,c)],[-.45*s,-.45*s-.5*Math.max(0,-c)]];arms=[[1.05,2.35],[.4*s,.4*s+.3]];lean=.04;break;}
    case "mop":{const s=Math.sin(t*.6);legs=[[.18+.1*s,.1],[-.14+.1*s,-.08]];arms=[[.75+.2*s,.45+.2*s],[.55+.2*s,.35+.2*s]];lean=.25;break;}
    case "write": legs=standLegs;arms=[[1.15,2.05],[.95,1.75+.12*Math.sin(t*14)]];lean=.05;break;
    // 무릎 꿇고 두 팔 들어 절규 (팔이 부들부들)
    case "kneel":{const w=.2*Math.sin(t*16);legs=[[.25,-1.6],[.1,-1.7]];arms=[[2.45+w,3.05+w],[-2.45-w,-3.05-w]];lean=-.1;head=-.3;break;}
    // 무릎 꿇고 고개 숙여 훌쩍
    case "sob":{const w=.06*Math.sin(t*9);legs=[[.25,-1.6],[.1,-1.7]];arms=[[.9,2.6+w],[.7,2.5-w]];lean=.35;head=.45;break;}
    default:{const b=.04*Math.sin(t*2);legs=standLegs;arms=[[.22+b,.12+b],[-.22-b,-.12-b]]}
  }
  return {lean,legs,arms,head};
}
function limb(x,y,a1,L1,a2,L2,dir){
  const k=[x+dir*Math.sin(a1)*L1,y+Math.cos(a1)*L1];
  return [k,[k[0]+dir*Math.sin(a2)*L2,k[1]+Math.cos(a2)*L2]];
}
function stroke(ctx,pts,color,w){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke();
}

/* o: {x,y(발 위치),s,dir,pose,t,sitY,lift,hat,hatColor,face,look,glasses,beard,suit,bowtie,sack,item,flash,ink} */
function drawStick(ctx,o){
  const s=o.s||1, dir=o.dir||1, P=getPose(o), ink=o.ink||INK;
  const TH=24,SH=24,TORSO=40,R=13,UA=20,FA=19,LW=5;
  const legs=P.legs.map(l=>limb(0,0,l[0],TH,l[1],SH,dir));
  if(o.shadow){ctx.save();ctx.fillStyle="rgba(20,10,30,.22)";ctx.beginPath();ctx.ellipse(o.x,o.y+2,24*s,6*s,0,0,TAU);ctx.fill();ctx.restore()}
  let hipY=o.sitY!=null?(o.sitY-o.y)/s:-Math.max(legs[0][1][1],legs[1][1][1]);
  hipY-=(o.lift||0)/s;
  ctx.save();
  ctx.translate(o.x,o.y);ctx.scale(s,s);ctx.translate(0,hipY);
  ctx.lineCap="round";ctx.lineJoin="round";
  const neck=[dir*Math.sin(P.lean)*TORSO,-Math.cos(P.lean)*TORSO];
  const sh=[neck[0]*.86,neck[1]*.86];
  const ha=P.lean+P.head;
  const hc=[neck[0]+dir*Math.sin(ha)*(R+3),neck[1]-Math.cos(ha)*(R+3)];
  const arms=P.arms.map(a=>limb(sh[0],sh[1],a[0],UA,a[1],FA,dir));

  // 산타 자루 (등 뒤)
  if(o.sack){
    ctx.save();ctx.translate(sh[0]-dir*18,sh[1]+4);ctx.rotate(-dir*.25);
    ctx.fillStyle="#b07a45";ctx.strokeStyle=ink;ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(0,0,17,21,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-6,-20);ctx.lineTo(0,-27);ctx.lineTo(6,-20);ctx.stroke();
    ctx.restore();
  }
  // 책가방 (등 뒤)
  if(o.backpack){ctx.save();ctx.translate(sh[0]*.55-dir*11,sh[1]*.55);ctx.rotate(dir*P.lean);ctx.fillStyle=o.backpack;ctx.strokeStyle=ink;ctx.lineWidth=2.5;rr(ctx,-7,-13,14,26,5);ctx.fill();ctx.stroke();ctx.restore()}
  // 뒷다리, 뒷팔
  stroke(ctx,[[0,0],legs[1][0],legs[1][1]],ink,LW);
  stroke(ctx,[sh,arms[1][0],arms[1][1]],ink,LW);
  // 지팡이 (뒷손에서 땅까지)
  if(o.cane)stroke(ctx,[[arms[1][1][0],arms[1][1][1]-3],[arms[1][1][0]+dir*7,-hipY]],"#8a5a2a",3.5);
  if(o.item==="bag")drawMoneyBag(ctx,arms[1][1][0],arms[1][1][1]+8,.8);
  // 몸통
  if(o.suit){
    stroke(ctx,[[0,2],neck],o.suit,17);
    const b=[neck[0]*.3,neck[1]*.3];
    ctx.save();ctx.translate(b[0],b[1]);ctx.rotate(dir*P.lean);
    ctx.fillStyle=ink;ctx.fillRect(-9,-3,18,6);ctx.fillStyle=MUSTARD;ctx.fillRect(-3,-3,6,6);ctx.restore();
  }
  if(o.shirt)stroke(ctx,[[0,-2],[neck[0]*.9,neck[1]*.9]],o.shirt,13);
  if(o.apron)stroke(ctx,[[0,1],[neck[0]*.62,neck[1]*.62]],o.apron,15);
  stroke(ctx,[[0,0],neck],ink,LW);
  if(o.tie){ctx.save();ctx.translate(neck[0],neck[1]);ctx.rotate(dir*P.lean);ctx.fillStyle=o.tie;ctx.strokeStyle=ink;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(-3,2);ctx.lineTo(3,2);ctx.lineTo(4.5,17);ctx.lineTo(0,23);ctx.lineTo(-4.5,17);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
  if(o.badge)circle(ctx,neck[0]*.74+dir*4,neck[1]*.74,3.6,MUSTARD,ink,1.6);
  // 앞다리
  stroke(ctx,[[0,0],legs[0][0],legs[0][1]],ink,LW);
  // 머리
  circle(ctx,hc[0],hc[1],R,o.headFill||PAPER,ink,4.5);
  if(o.hair3){ctx.strokeStyle=ink;ctx.lineWidth=1.8;(o.hair3===2?[-3,3]:o.hair3===1?[0]:[-5,0,5]).forEach(dx=>{ctx.beginPath();ctx.moveTo(hc[0]+dx,hc[1]-R+1);ctx.quadraticCurveTo(hc[0]+dx+6,hc[1]-R-7,hc[0]+dx-1,hc[1]-R-12);ctx.stroke()})}
  // 얼굴
  if(o.face!=="none"){
    const ex=hc[0]+dir*4, ey=hc[1]-2;
    if(o.face==="scream"){   // 질끈 감은 눈 > <
      ctx.strokeStyle=ink;ctx.lineWidth=2;
      [[ex,1],[ex+dir*7,-1]].forEach(([x,d])=>{ctx.beginPath();ctx.moveTo(x-2.5*d,ey-2.5);ctx.lineTo(x+1.5*d,ey);ctx.lineTo(x-2.5*d,ey+2.5);ctx.stroke()});
    }else if(o.face==="cry"){ // 감은 눈 (울먹)
      ctx.strokeStyle=ink;ctx.lineWidth=2;[ex,ex+dir*7].forEach(x=>{ctx.beginPath();ctx.arc(x,ey-1,2.4,.1*Math.PI,.9*Math.PI);ctx.stroke()});
    }else if(o.face==="sleep"){ // 자는 눈 - -
      ctx.strokeStyle=ink;ctx.lineWidth=2;[ex,ex+dir*7].forEach(x=>{ctx.beginPath();ctx.moveTo(x-2.5,ey);ctx.lineTo(x+2.5,ey);ctx.stroke()});
    }else if(o.face==="dizzy"){ // 기절 X X
      ctx.strokeStyle=ink;ctx.lineWidth=2;[ex,ex+dir*7].forEach(x=>{ctx.beginPath();ctx.moveTo(x-2.5,ey-2.5);ctx.lineTo(x+2.5,ey+2.5);ctx.moveTo(x+2.5,ey-2.5);ctx.lineTo(x-2.5,ey+2.5);ctx.stroke()});
    }else if(o.face==="angry"){ // 화난 눈썹
      circle(ctx,ex,ey,1.9,ink);circle(ctx,ex+dir*7,ey,1.9,ink);
      ctx.strokeStyle=ink;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(ex-3,ey-6);ctx.lineTo(ex+2*dir,ey-3.5);ctx.moveTo(ex+dir*10,ey-6);ctx.lineTo(ex+dir*5,ey-3.5);ctx.stroke();
    }else if(o.face==="money"){ // 눈이 ₩
      [ex,ex+dir*7].forEach(x=>outlinedText(ctx,"₩",x,ey,9,MUSTARD,ink,2.5));
    }else if(o.glasses){
      ctx.fillStyle=ink;rr(ctx,ex-5,ey-4,15,7,3);ctx.fill();
      ctx.fillStyle="#fff";ctx.fillRect(ex+dir*6-1,ey-3,2,2);
    }else{
      circle(ctx,ex,ey,1.9,ink);circle(ctx,ex+dir*7,ey,1.9,ink);
      if(o.monocle){circle(ctx,ex+dir*7,ey,4.5,null,MUSTARD,2)}
      if(o.specs){circle(ctx,ex,ey,4,null,ink,1.6);circle(ctx,ex+dir*7,ey,4,null,ink,1.6)}
    }
    ctx.beginPath();ctx.strokeStyle=ink;ctx.lineWidth=2.2;
    const mx=hc[0]+dir*6, my=hc[1]+5;
    if(o.face==="sad"){ctx.arc(mx,my+4,4,1.15*Math.PI,1.85*Math.PI)}
    else if(o.face==="wow"){ctx.arc(mx,my+1,2.6,0,TAU)}
    else if(o.face==="scream"){ctx.save();ctx.fillStyle=ink;ctx.beginPath();ctx.ellipse(mx-dir,my+2,4.2,5.6+Math.sin((o.t||0)*30)*.8,0,0,TAU);ctx.fill();
      ctx.fillStyle="#e2483d";ctx.beginPath();ctx.ellipse(mx-dir,my+5,2.6,1.8,0,0,TAU);ctx.fill();ctx.restore()}
    else if(o.face==="cry"){ctx.moveTo(mx-5,my+3);ctx.quadraticCurveTo(mx-2.5,my,mx,my+3);ctx.quadraticCurveTo(mx+2.5,my+6,mx+5,my+3)}
    else if(o.face==="money"){ctx.save();ctx.fillStyle=ink;ctx.beginPath();ctx.ellipse(mx,my+2,3.4,4.4,0,0,TAU);ctx.fill();ctx.restore()}
    else if(o.face==="sleep"){ctx.arc(mx,my+2,2.2,0,TAU)}
    else if(o.face==="dizzy"){ctx.moveTo(mx-4,my+2);ctx.quadraticCurveTo(mx-2,my-1,mx,my+2);ctx.quadraticCurveTo(mx+2,my+5,mx+4,my+2)}
    else if(o.face==="angry"){ctx.arc(mx,my+6,4,1.15*Math.PI,1.85*Math.PI)}
    else{ctx.arc(mx,my-1,4,.15*Math.PI,.85*Math.PI)}
    ctx.stroke();
  }
  if(o.beard){
    ctx.fillStyle="#fff";ctx.strokeStyle=ink;ctx.lineWidth=2.5;ctx.beginPath();
    ctx.moveTo(hc[0]-R+1,hc[1]+1);
    ctx.quadraticCurveTo(hc[0]-R+2,hc[1]+R+14,hc[0]+dir*4,hc[1]+R+16);
    ctx.quadraticCurveTo(hc[0]+R+2,hc[1]+R+12,hc[0]+R-1,hc[1]+1);
    ctx.quadraticCurveTo(hc[0],hc[1]+8,hc[0]-R+1,hc[1]+1);
    ctx.fill();ctx.stroke();
  }
  // 눈물 폭포 (양쪽으로 뿜어져 나온다)
  if(o.tears){
    const ex=hc[0]+dir*4,ey=hc[1]-2,ph=(o.t||0)*40;
    ctx.save();ctx.lineCap="round";
    [[ex,-1],[ex+dir*7,1]].forEach(([x,d])=>{
      const k=o.tears, ox=x+d*dir*48*k, oy=ey+62*k;
      ctx.strokeStyle="rgba(120,200,255,.9)";ctx.lineWidth=4.5;ctx.setLineDash([7,5]);ctx.lineDashOffset=-ph;
      ctx.beginPath();ctx.moveTo(x,ey+1);ctx.quadraticCurveTo(x+d*dir*30*k,ey-22*k,ox,oy);ctx.stroke();
      ctx.setLineDash([]);ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,ey+1);ctx.quadraticCurveTo(x+d*dir*30*k,ey-22*k,ox,oy);ctx.stroke();
    });
    ctx.restore();
  }
  if(o.sweat){ctx.save();ctx.fillStyle="#9fdcff";ctx.strokeStyle=ink;ctx.lineWidth=1.5;const sx=hc[0]-dir*(R-1),sy=hc[1]-R+4+((o.t||0)*20%6);
    ctx.beginPath();ctx.moveTo(sx,sy-6);ctx.quadraticCurveTo(sx+4,sy,sx,sy+3);ctx.quadraticCurveTo(sx-4,sy,sx,sy-6);ctx.fill();ctx.stroke();ctx.restore()}
  drawHat(ctx,o,hc,R,dir,ink);
  if(o.halo){ctx.save();ctx.strokeStyle="#ffd84d";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(hc[0],hc[1]-R-9,11,3.5,0,0,TAU);ctx.stroke();ctx.restore()}
  if(o.antenna){[-1,1].forEach(d=>{stroke(ctx,[[hc[0]+d*5,hc[1]-R+2],[hc[0]+d*10,hc[1]-R-12]],ink,2);circle(ctx,hc[0]+d*10,hc[1]-R-13,3,"#43d17f",ink,1.5)})}
  if(o.helmet){ctx.save();ctx.fillStyle="rgba(170,225,255,.28)";ctx.strokeStyle=ink;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(hc[0],hc[1]-2,R+8,0,TAU);ctx.fill();ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(hc[0],hc[1]-2,R+3,-2.6,-1.9);ctx.stroke();ctx.restore()}
  if(o.bowtie){
    ctx.fillStyle=MUSTARD;ctx.strokeStyle=ink;ctx.lineWidth=2;
    const bx=neck[0],by=neck[1]+5;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-8,by-5);ctx.lineTo(bx-8,by+5);ctx.closePath();
    ctx.moveTo(bx,by);ctx.lineTo(bx+8,by-5);ctx.lineTo(bx+8,by+5);ctx.closePath();ctx.fill();ctx.stroke();
  }
  // 앞팔 + 손에 든 물건
  stroke(ctx,[sh,arms[0][0],arms[0][1]],ink,LW);
  const hx=arms[0][1][0], hy=arms[0][1][1];
  if(o.item==="togo"){
    ctx.fillStyle="#c9955a";ctx.strokeStyle=ink;ctx.lineWidth=2;rr(ctx,hx-7,hy-2,14,15,2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(hx,hy-2,4,Math.PI,TAU);ctx.stroke();
  }else if(o.item==="tray"){
    ctx.fillStyle="#d9dde3";ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(hx+dir*4,hy-3,14,3.5,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(hx+dir*4,hy-6,7,Math.PI,TAU);ctx.closePath();ctx.fill();ctx.stroke();
  }else if(o.item==="mop"){
    stroke(ctx,[[hx-dir*6,hy-8],[hx+dir*16,hy+34]],"#b07a45",3);
    ctx.fillStyle="#e8f0f5";ctx.strokeStyle=ink;ctx.lineWidth=2;rr(ctx,hx+dir*16-10,hy+32,20,7,3);ctx.fill();ctx.stroke();
  }else if(o.item==="clipboard"){
    ctx.save();ctx.translate(hx,hy-6);ctx.rotate(dir*.15);ctx.fillStyle="#9b6b43";ctx.strokeStyle=ink;ctx.lineWidth=2;rr(ctx,-8,-11,16,20,2);ctx.fill();ctx.stroke();
    ctx.fillStyle="#fff";ctx.fillRect(-6,-7,12,14);ctx.fillStyle=ink;for(let i=0;i<3;i++)ctx.fillRect(-4,-4+i*4,8,1.2);ctx.fillStyle="#b8b8b8";ctx.fillRect(-3,-13,6,3);ctx.restore();
  }else if(o.item==="dish"&&o.dish){
    drawDish(ctx,o.dish,hx+dir*6,hy-4,9);
  }else if(o.item==="phone"){
    ctx.save();ctx.translate(hx,hy);ctx.rotate(-dir*.2);
    ctx.fillStyle=ink;rr(ctx,-6,-13,12,20,3);ctx.fill();ctx.fillStyle="#8fd3ff";ctx.fillRect(-4,-10,8,13);
    ctx.restore();
    if(o.flash){
      ctx.save();ctx.globalAlpha=o.flash;ctx.fillStyle="#fff7b0";
      for(let i=0;i<8;i++){const a=i/8*TAU;ctx.beginPath();ctx.moveTo(hx,hy-6);
        ctx.lineTo(hx+Math.cos(a)*34,hy-6+Math.sin(a)*34);ctx.lineTo(hx+Math.cos(a+.2)*18,hy-6+Math.sin(a+.2)*18);ctx.fill()}
      circle(ctx,hx,hy-6,11,"#fff");ctx.restore();
    }
  }else if(o.item==="bill"){
    drawBill(ctx,hx,hy-10,o.billValue||1000,-.2*dir,.55);
  }else if(o.item==="box"){   // 택배 상자 (졸팡)
    ctx.fillStyle="#b8864f";ctx.strokeStyle=ink;ctx.lineWidth=2;rr(ctx,hx-12,hy-15,24,19,2);ctx.fill();ctx.stroke();
    ctx.fillStyle="#e8d9a8";ctx.fillRect(hx-12,hy-8,24,3);ctx.fillStyle="#1f5fd1";ctx.fillRect(hx-4,hy-13,8,4);
  }else if(o.item==="basket"){   // 장바구니 (슈퍼마켓): 손에 손잡이, 아래로 빨간 바구니
    ctx.save();ctx.translate(hx,hy);ctx.strokeStyle=ink;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-10,12);ctx.quadraticCurveTo(0,-4,10,12);ctx.stroke();
    ctx.fillStyle="#ffcc2e";ctx.fillRect(-9,4,7,9);ctx.fillStyle="#2f9d4a";ctx.fillRect(1,6,7,7);ctx.fillStyle="#fff";ctx.fillRect(-3,7,5,6);
    ctx.fillStyle="#e2483d";rr(ctx,-14,11,28,15,3);ctx.fill();ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=1.2;[-7,0,7].forEach(x=>{ctx.beginPath();ctx.moveTo(x,14);ctx.lineTo(x,23);ctx.stroke()});
    ctx.restore();
  }else if(o.item==="ladle"){
    stroke(ctx,[[hx,hy],[hx+dir*10,hy+16]],"#8a8a8a",3);
    circle(ctx,hx+dir*12,hy+19,5,"#b8b8b8",ink,2);
  }else if(o.item==="card"){
    ctx.save();ctx.translate(hx,hy-4);ctx.rotate(dir*.3);ctx.fillStyle=MUSTARD;ctx.strokeStyle=ink;ctx.lineWidth=2;
    rr(ctx,-10,-6,20,13,2);ctx.fill();ctx.stroke();ctx.fillStyle=ink;ctx.fillRect(-7,-2,6,4);ctx.restore();
  }
  ctx.restore();
}

function drawHat(ctx,o,hc,R,dir,ink){
  const [x,y]=hc, top=y-R;
  ctx.lineWidth=2.5;ctx.strokeStyle=ink;
  switch(o.hat){
    case "chef":
      ctx.fillStyle="#fff";rr(ctx,x-11,top-12,22,13,2);ctx.fill();ctx.stroke();
      [[-8,-17,8],[0,-22,9],[8,-17,8]].forEach(([dx,dy,r])=>circle(ctx,x+dx,top+dy,r,"#fff",ink,2.5));
      ctx.fillStyle="#fff";ctx.fillRect(x-9.5,top-14,19,9);break;
    case "top":
      ctx.fillStyle=ink;ctx.fillRect(x-10,top-22,20,22);ctx.fillStyle=KETCHUP;ctx.fillRect(x-10,top-7,20,5);
      ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(x-17,top+1);ctx.lineTo(x+17,top+1);ctx.stroke();break;
    case "santa":
      ctx.fillStyle=KETCHUP;ctx.beginPath();ctx.moveTo(x-14,top+4);
      ctx.quadraticCurveTo(x-2,top-26,x-dir*20,top-14);ctx.lineTo(x+14,top+4);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle="#fff";rr(ctx,x-15,top-1,30,8,4);ctx.fill();ctx.stroke();
      circle(ctx,x-dir*20,top-14,5,"#fff",ink,2);break;
    case "beret":
      ctx.fillStyle=o.hatColor||"#f07aa8";ctx.beginPath();ctx.ellipse(x-dir*2,top+2,16,7,-dir*.15,Math.PI,TAU);ctx.closePath();ctx.fill();ctx.stroke();
      circle(ctx,x-dir*2,top-6,2.5,o.hatColor||"#f07aa8",ink,2);break;
    case "cap":
      ctx.fillStyle=o.hatColor||MINT;ctx.beginPath();ctx.arc(x,top+6,R-1,Math.PI,TAU);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+dir*4,top+5);ctx.lineTo(x+dir*21,top+7);ctx.stroke();break;
    case "bow":
      ctx.fillStyle=o.hatColor||KETCHUP;const bx=x-dir*8,by=top+3;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-9,by-7);ctx.lineTo(bx-9,by+5);ctx.closePath();
      ctx.moveTo(bx,by);ctx.lineTo(bx+9,by-7);ctx.lineTo(bx+9,by+5);ctx.closePath();ctx.fill();ctx.stroke();break;
    case "witch":
      ctx.fillStyle="#4a2a80";ctx.beginPath();ctx.ellipse(x,top+3,22,5,0,0,TAU);ctx.fill();ctx.stroke();

const T=window.THREE;

const FJ='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';

let ANISO=4;
function mkCanvas(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;return c}
function toTex(c,{repeat,srgb=true,clamp:cl}={}){
  const t=new T.CanvasTexture(c);if(srgb)t.encoding=T.sRGBEncoding;t.anisotropy=ANISO;
  if(repeat){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(repeat[0],repeat[1])}
  if(cl){t.wrapS=t.wrapT=T.ClampToEdgeWrapping}
  return t;
}
function tex(key,w,h,draw,opt){if(!TEX[key]){const c=mkCanvas(w,h);draw(c.getContext("2d"),w,h);TEX[key]=toTex(c,opt);TEX[key].__c=c}return TEX[key]}
function speckle(x,w,h,n,cols,rMin=.5,rMax=1.5){for(let i=0;i<n;i++){x.fillStyle=cols[i%cols.length];x.globalAlpha=.15+Math.random()*.35;x.beginPath();x.arc(Math.random()*w,Math.random()*h,rMin+Math.random()*(rMax-rMin),0,TAU);x.fill()}x.globalAlpha=1}
function grad(x,x0,y0,x1,y1,stops){const g=x.createLinearGradient(x0,y0,x1,y1);stops.forEach(([p,c])=>g.addColorStop(p,c));return g}
function barcode(x,X,Y,W,H){x.fillStyle="#fff";x.fillRect(X-4,Y-4,W+8,H+16);x.fillStyle="#111";let px=X;let i=0;
  while(px<X+W){const bw=1+Math.floor(seeded(i*3.7+X)*3);if(i%2===0)x.fillRect(px,Y,bw,H);px+=bw;i++}
  x.font=`10px ${FM2}`;x.textAlign="center";x.textBaseline="top";x.fillText("8 801234 567890",X+W/2,Y+H+1)}
const FM2='"Nanum Gothic Coding",ui-monospace,monospace';
function tx(x,str,X,Y,px,fill,{font=FD,align="center",stroke,lw=0,base="middle",maxW}={}){
  x.font=`${px}px ${font}`;x.textAlign=align;x.textBaseline=base;
  if(maxW){const w=x.measureText(str).width;if(w>maxW){px=Math.floor(px*maxW/w);x.font=`${px}px ${font}`}}
  if(stroke){x.lineJoin="round";x.strokeStyle=stroke;x.lineWidth=lw;x.strokeText(str,X,Y)}
  x.fillStyle=fill;x.fillText(str,X,Y);
}

const BILL_TINT={1000:["#6f93cf","#2e4f8f"],5000:["#e59a72","#9a4a2a"],10000:["#86c393","#2f7a44"],50000:["#f2c35a","#a0701a"]};

function billKind(v){const e=Math.floor(Math.log10(v)+1e-9),lead=Math.round(v/Math.pow(10,e));return lead>=5?(e%2?50000:5000):(e%2?1000:10000)}

function shelfSets(){
  if(W3.shelfSets)return W3.shelfSets;
  const boxGeo=box(.1,.14,.07),canGeo=new T.CylinderGeometry(.033,.033,.12,18),cupGeo=new T.CylinderGeometry(.056,.043,.092,18);
  const bagGeo=(()=>{const w=.14,h=.2,e=box(w,h,.05,8,10,1),p=e.attributes.position;
    for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),f=Math.max(.08,(1-Math.pow(Math.abs(2*x/w),4))*(1-Math.pow(Math.abs(2*y/h),6)));p.setZ(i,p.getZ(i)*f)}e.computeVertexNormals();return e})();
  return W3.shelfSets=[
    {geo:boxGeo,h:.14,mat:new T.MeshStandardMaterial({map:snackBoxTex("쿠키","졸라쿠키","#c8321f","#ffe066"),roughness:.5})},
    {geo:canGeo,h:.12,mat:new T.MeshStandardMaterial({map:labelTex("cola"),roughness:.28,metalness:.55})},
    {geo:bagGeo,h:.2,mat:new T.MeshStandardMaterial({map:labelTex("chips"),roughness:.32,metalness:.4})},
    {geo:cupGeo,h:.092,mat:new T.MeshStandardMaterial({map:labelTex("ramen"),roughness:.45})},
    {geo:canGeo,h:.12,mat:new T.MeshStandardMaterial({map:labelTex("cider"),roughness:.28,metalness:.55})},
    {geo:boxGeo,h:.14,mat:new T.MeshStandardMaterial({map:snackBoxTex("파이","선파이","#1f5fd1","#ffffff"),roughness:.5})}
  ];
}
function shelfKit(g,cap){
  const sets=shelfSets();
  const inst=sets.map(s=>{const m=new T.InstancedMesh(s.geo,s.mat,cap);m.count=0;m.castShadow=false;g.add(m);return m});
  const M=new T.Matrix4(),q=new T.Quaternion(),S=new T.Vector3(1,1,1),P=new T.Vector3(),C=new T.Color();
  const SEC={};
  const add=(kind,x,y,z,ry,sec,nx)=>{const m=inst[kind];if(m.count>=cap)return;q.setFromEuler(new T.Euler(0,ry,0));P.set(x,y,z);M.compose(P,q,S);m.setMatrixAt(m.count,M);const v=.9+Math.random()*.1;C.setRGB(v,v,v);m.setColorAt(m.count,C);
    if(sec){const s=SEC[sec]||(SEC[sec]={id:sec,items:[],c:new T.Vector3(),n:new T.Vector3(nx,0,0)});s.items.push({m,i:m.count,mat:M.clone()});s.c.add(P)}
    m.count++};
  const done=()=>{inst.forEach(m=>{m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true});
    return Object.values(SEC).filter(s=>s.items.length>=4).map(s=>{s.c.divideScalar(s.items.length);return s})};
  return {add,done,sets};
}
// 양면 곤돌라 한 줄 (z0 에서 -z 쪽으로 길이 L). poster: 끝에 붙는 행사 포스터
function gondola(K,g,gx,z0,L,gi,tag,poster){
  const metal=W3.mat.shelf,dark=W3.mat.shelfDark,sets=K.sets,zc=z0-L/2;
  mesh(box(.12,1.45,L),dark,{x:gx,y:.725,z:zc,parent:g});
  mesh(box(.86,.1,L),dark,{x:gx,y:.05,z:zc,parent:g});
  for(let lv=0;lv<4;lv++){const y=.12+lv*.34;
    mesh(box(.84,.02,L),metal,{x:gx,y,z:zc,parent:g});
    mesh(box(.86,.035,L),mStd(0xffe066,.6),{x:gx,y:y+.005,z:zc,parent:g});
    for(let side=-1;side<=1;side+=2)for(let k=0;k<Math.floor(L/.12);k++){
      const kind=(lv*2+Math.floor(k/4)+gi*3+(side>0?1:0))%6,sh=sets[kind].h,zz=z0-.06-k*.12;if(seeded(k*7+lv*3+gi+side)>.9)continue;
      const sec=`${tag}${gi}${side}${lv}_${Math.floor(k/4)}`;
      K.add(kind,gx+side*.26,y+.012+sh/2,zz,side*Math.PI/2,sec,side);if(kind!==2)K.add(kind,gx+side*.14,y+.012+sh/2,zz,side*Math.PI/2,sec,side);
    }}
  if(poster)mesh(new T.PlaneGeometry(.5,.7),new T.MeshStandardMaterial({map:toTex(posterCanvas(poster)),roughness:.7}),{x:gx,y:1.12,z:z0+.005,parent:g});
  mesh(box(.86,.4,.3),dark,{x:gx,y:.2,z:z0+.1,parent:g});
  for(let k=0;k<5;k++)K.add(k%2?1:3,gx-.3+k*.15,.4+sets[k%2?1:3].h/2,z0+.1,Math.PI/2);
}

function stepGate(dt){
  if(!GATE.leaves.length||(GATE.group&&!GATE.group.visible))return;
  const p=PLAYER.pos,near=Math.abs(p.x-GATE.x)<.62&&Math.abs(p.z-GATE.z)<.75;
  if(near&&GATE.open<.2)GATE.dir=p.z>GATE.z?1:-1;         // 걸어가는 쪽으로 밀려 열린다
  const to=near?1:0,was=GATE.open;GATE.open+=clamp(to-GATE.open,-dt*.004,dt*.006);
  if(was<.05&&GATE.open>=.05&&performance.now()-GATE.creak>900){GATE.creak=performance.now();Snd.creak()}
  const wob=GATE.open>0&&!near?Math.sin(performance.now()*.02)*.08*GATE.open:0;   // 닫힐 때 덜렁덜렁
  GATE.leaves.forEach(h=>{h.rotation.y=h.userData.s*GATE.dir*(GATE.open*1.35+wob)});
}

// 화면 비율에 맞춰 가로 시야를 지킨다 (세로 화면이면 세로 시야가 넓어진다)
function resize3D(){
  const cv=$("gl"),w=cv.clientWidth||innerWidth,h=cv.clientHeight||innerHeight;
  const dpr=Math.min(window.__DPR||1.5,window.devicePixelRatio||1);
  renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);
  const a=w/h;camera.aspect=a;
  const hf=a<1?66:CAM.hfov;
  camera.fov=clamp(2*Math.atan(Math.tan(hf*Math.PI/360)/a)*180/Math.PI,40,88);
  camera.updateProjectionMatrix();
}
// 3D 좌표 → 화면(CSS px)
const _v=new T.Vector3();
function toScreen(p,out={}){
  _v.copy(p).project(camera);const cv=$("gl");
  out.x=(_v.x*.5+.5)*cv.clientWidth;out.y=(-_v.y*.5+.5)*cv.clientHeight;out.behind=_v.z>1;return out;
}

}

function makeBill(v){
  const g=new T.Group();g.userData.money=v;
  const ge=geo("bill",()=>{const p=new T.PlaneGeometry(.136,.068,10,1),a=p.attributes.position;for(let i=0;i<a.count;i++)a.setZ(i,Math.sin((a.getX(i)/.136+.5)*Math.PI)*.004);p.computeVertexNormals();return p});
  mesh(ge,mat("bill"+v,()=>new T.MeshStandardMaterial({map:billTex(v),roughness:.75,side:T.DoubleSide})),{y:.002,rx:-Math.PI/2,cast:true,parent:g});

}
// idx: 0=500, 1=100, 2=50, 3=10 (단위가 커져도 크기는 그대로)
function makeCoin(v,idx=1){
  const r=[.0132,.012,.0108,.009][idx],bronze=idx===3;
  const side=mat("coinSide"+(bronze?"b":"s"),()=>mStd(bronze?0xb87333:0xc9cdd3,.3,.95));
  const face=mat("coin"+v,()=>new T.MeshStandardMaterial({map:coinTex(v),roughness:.3,metalness:.9}));
  const m=new T.Mesh(new T.CylinderGeometry(r,r,.0019,28),[side,face,face]);m.position.y=.001;m.castShadow=true;
  const g=new T.Group();g.add(m);g.userData.money=v;return g;
}
function makeCard(){

  mesh(geo("card",()=>box(.0856,.0015,.054)),[edge,edge,mat("cardTop",()=>new T.MeshStandardMaterial({map:cardTex(),roughness:.25,metalness:.2})),edge,edge,edge],{y:.001,cast:true,parent:g});

// 돈 묶음을 계산대 위에 펼쳐 놓는다 (지폐 + 동전). 계산은 단위(S) 기준 정수로
function makeCashPile(amount,S=moneyScale()){
  const g=new T.Group();g.userData.tmp=true;let rest=Math.round(amount/S),i=0;
  [50000,10000,5000,1000].forEach(u=>{let n=0;while(rest>=u&&n<12){const b=makeBill(u*S);b.position.set((i%2)*.02-.01,.001+i*.0022,(i%3)*.012);b.rotation.y=(seeded(i+u)-.5)*.35;g.add(b);rest-=u;i++;n++}});
  let j=0;[500,100,50,10].forEach((u,idx)=>{let n=0;while(rest>=u&&n<9){const c=makeCoin(u*S,idx);c.position.set(.09+(j%4)*.03,.0015+Math.floor(j/8)*.002,-.02+Math.floor((j%8)/4)*.03);g.add(c);rest-=u;j++;n++}});
  const hit=new T.Mesh(box(.24,.06,.12),HIT_MAT);hit.position.set(.03,.02,0);g.add(hit);g.userData.hit=hit;hit.userData.owner=g;
  return g;
}

function skyCanvas(kind){

  const stars=(n,col="#fff")=>{for(let i=0;i<n;i++){x.globalAlpha=.3+Math.random()*.7;x.fillStyle=col;x.fillRect(Math.random()*W,Math.random()*H,1.5+Math.random()*1.5,1.5+Math.random()*1.5)}x.globalAlpha=1};
  const g=(stops)=>{x.fillStyle=grad(x,0,0,0,H,stops);x.fillRect(0,0,W,H)};
  if(kind==="high"){g([[0,"#1a2150"],[.55,"#5a4a8a"],[1,"#f0a070"]]);x.fillStyle="rgba(255,255,255,.85)";for(let i=0;i<14;i++){x.beginPath();x.ellipse(Math.random()*W,H*.72+Math.random()*H*.2,60+Math.random()*80,18+Math.random()*12,0,0,TAU);x.fill()}}
  else if(kind==="space"){g([[0,"#02030a"],[1,"#0a0f28"]]);stars(500);x.fillStyle=grad(x,0,H*.6,0,H,[[0,"#3a8fe0"],[1,"#1a4a9a"]]);x.beginPath();x.arc(W*.6,H*1.35,H*.85,0,TAU);x.fill();x.fillStyle="rgba(67,179,106,.8)";x.beginPath();x.ellipse(W*.55,H*.72,90,30,.2,0,TAU);x.fill()}
  else if(kind==="moon"){g([[0,"#000004"],[1,"#101018"]]);stars(450);x.fillStyle="#3a8fe0";x.beginPath();x.arc(W*.78,H*.28,46,0,TAU);x.fill();x.fillStyle="#8d8a86";x.fillRect(0,H*.78,W,H*.22);x.fillStyle="#6d6a66";for(let i=0;i<10;i++){x.beginPath();x.ellipse(Math.random()*W,H*.84+Math.random()*H*.12,40,8,0,0,TAU);x.fill()}}
  else if(kind==="galaxy"){g([[0,"#0a0520"],[1,"#2a1050"]]);for(let i=0;i<8;i++){const rg=x.createRadialGradient(Math.random()*W,Math.random()*H,0,Math.random()*W,Math.random()*H,260);rg.addColorStop(0,"rgba(255,126,182,.35)");rg.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=rg;x.fillRect(0,0,W,H)}stars(600,"#ffe8ff")}
  else if(kind==="world"){g([[0,"#bfe8ff"],[1,"#fff8e0"]]);x.strokeStyle="#16141d";x.lineWidth=6;x.fillStyle="#ffe066";x.beginPath();x.arc(W*.8,H*.25,50,0,TAU);x.fill();x.stroke();
    x.fillStyle="#fff";for(let i=0;i<5;i++){const cx=100+i*200,cy=90+(i%2)*60;x.beginPath();x.arc(cx,cy,30,0,TAU);x.arc(cx+34,cy-10,36,0,TAU);x.arc(cx+70,cy,28,0,TAU);x.fill();x.stroke()}}
  else if(kind==="time"){g([[0,"#3a2410"],[1,"#c8904a"]]);x.strokeStyle="rgba(255,220,150,.6)";x.lineWidth=4;for(let i=0;i<6;i++){const cx=100+i*170,cy=150+(i%2)*120;x.beginPath();x.arc(cx,cy,50,0,TAU);x.stroke();x.beginPath();x.moveTo(cx,cy);x.lineTo(cx,cy-36);x.moveTo(cx,cy);x.lineTo(cx+26,cy);x.stroke()}}
  else if(kind==="warp"){g([[0,"#02121c"],[1,"#063040"]]);x.strokeStyle="rgba(95,240,255,.6)";x.lineWidth=2;for(let i=0;i<40;i++){x.beginPath();x.moveTo(W/2,H/2);const a=i/40*TAU;x.lineTo(W/2+Math.cos(a)*900,H/2+Math.sin(a)*900);x.stroke()}}
  else if(kind==="gods"){g([[0,"#fff4c8"],[1,"#ffd27a"]]);x.fillStyle="rgba(255,255,255,.9)";for(let i=0;i<16;i++){x.beginPath();x.ellipse(Math.random()*W,H*.5+Math.random()*H*.5,90,26,0,0,TAU);x.fill()}}
  else if(kind==="void"){x.fillStyle="#000";x.fillRect(0,0,W,H);stars(60,"#888")}
  else if(kind==="verse"){const cols=["#ff5b5f","#ffcc2e","#43d17f","#56b8ff","#b28dff"];cols.forEach((c2,i)=>{x.fillStyle=c2;x.fillRect(0,i*H/5,W,H/5)});x.globalAlpha=.5;x.fillStyle="#16141d";x.fillRect(0,0,W,H);x.globalAlpha=1;stars(300,"#fff")}
  return c;
}

/* ================= 낙서 레이어: 진짜 같은 세상 위에 그려지는 졸라맨의 손 =================
   선이 살짝 떨리게(보일링) 120ms 마다 흔들림 값을 바꾼다. 좌표는 화면 CSS 픽셀 */
const OV={cv:null,ctx:null,W:1,H:1,boil:0,boilT:0};
function initOverlay(){OV.cv=$("ov");OV.ctx=OV.cv.getContext("2d");resizeOverlay()}
function resizeOverlay(){
  const r=OV.cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  OV.W=Math.max(1,r.width);OV.H=Math.max(1,r.height);
  OV.cv.width=Math.round(OV.W*dpr);OV.cv.height=Math.round(OV.H*dpr);
  OV.ctx.setTransform(dpr,0,0,dpr,0,0);OV.ctx.__W=OV.W;
  OV.ctx.__ts=clamp(OV.W/900,1,1.4);
}
// 흔들림: 같은 i 는 같은 박자 안에서 같은 값
const J=(i,a=1.3)=>(seeded(i*13.1+OV.boil*71.7)-.5)*2*a;
function wobbleLine(ctx,pts,w,color=INK,seed=0){
  ctx.beginPath();pts.forEach(([x,y],i)=>{const X=x+J(seed+i),Y=y+J(seed+i+50);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});
  ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke();
}
function wobbleCircle(ctx,x,y,r,fill,lw,seed=0){
  ctx.beginPath();for(let i=0;i<=14;i++){const a=i/14*TAU,rr=r+J(seed+i%14,.9);ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=INK;ctx.lineWidth=lw;ctx.stroke();
}

/* ---------- 손 ----------
   side: 1 오른손, -1 왼손. pose: open, grab, point, wave, thumb, give */
const HANDS={
  R:{x:0,y:0,tx:0,ty:0,pose:"open",side:1,follow:null,off:[0,0],speed:.2,t:0},
  L:{x:0,y:0,tx:0,ty:0,pose:"open",side:-1,follow:null,off:[0,0],speed:.2,t:0},
  hidden:false,
  idle(h){const y=OV.H-Math.max(OV.H*.12,118);return h.side>0?[OV.W*.76,y]:[OV.W*.22,y+10]},
  shoulder(h){return h.side>0?[OV.W*.9,OV.H+OV.H*.2]:[OV.W*.08,OV.H+OV.H*.22]},
  reset(){["R","L"].forEach(k=>{const h=this[k];const [x,y]=this.idle(h);h.x=h.tx=x;h.y=h.ty=y+OV.H*.3;h.pose="open";h.follow=null})},
  go(k,x,y,pose,speed=.22){const h=this[k];h.tx=x;h.ty=y;if(pose)h.pose=pose;h.speed=speed;h.follow=null},
  rest(k,pose="open"){if(k==="R"&&MW.carry){this.hold("R",MW.carry.obj,[10,8],"grab");return}const h=this[k];const [x,y]=this.idle(h);this.go(k,x,y,pose,.16)},
  // 3D 물건을 잡고 따라간다
  hold(k,obj,off=[0,0],pose="grab"){const h=this[k];h.follow=obj;h.off=off;h.pose=pose},
  step(dt){
    ["R","L"].forEach(k=>{const h=this[k];h.t+=dt;
      if(h.follow){const p=new T.Vector3();h.follow.getWorldPosition(p);p.y+=(h.follow.userData.h||.05)*.5;const s=toScreen(p);h.tx=s.x+h.off[0];h.ty=s.y+h.off[1]}
      const k2=1-Math.pow(1-h.speed,dt/16);h.x+=(h.tx-h.x)*k2;h.y+=(h.ty-h.y)*k2;
      if(!h.follow&&h.pose==="open"){const [ix,iy]=this.idle(h);if(Math.abs(h.tx-ix)<2&&Math.abs(h.ty-iy)<2){h.ty=iy+Math.sin(h.t*.002+h.side)*3}}
    });
  },
  draw(ctx){if(this.hidden)return;drawArmHand(ctx,this.L);drawArmHand(ctx,this.R)}
};
function handR(){return clamp(Math.min(OV.W*.6,OV.H)*.055,18,44)}
function drawArmHand(ctx,h){
  const [sx,sy]=HANDS.shoulder(h),r=handR(),x=h.x,y=h.y;
  const ang=Math.atan2(y-sy,x-sx);                      // 팔 방향
  const dist=Math.hypot(x-sx,y-sy);
  const ex=sx+(x-sx)*.5-Math.sin(ang)*h.side*dist*.08, ey=sy+(y-sy)*.5+Math.cos(ang)*h.side*dist*.08;
  const lw=clamp(r*.36,7,16);
  wobbleLine(ctx,[[sx,sy],[ex,ey],[x-Math.cos(ang)*r*.8,y-Math.sin(ang)*r*.8]],lw,INK,h.side*100);
  // 늘어난 팔 (멀리 뻗으면 고무처럼 가늘어지는 개그)
  ctx.save();ctx.translate(x,y);ctx.rotate(ang+Math.PI/2);
  let pose=h.pose,wv=0;if(pose==="wave"){wv=Math.sin(h.t*.018)*.45;ctx.rotate(wv)}
  const fl=r*.95,fw=clamp(r*.26,5,11);
  const fingers=(len,spread)=>[-1.5,-.5,.5,1.5].forEach((k,i)=>{const a=k*spread;wobbleLine(ctx,[[Math.sin(a)*r*.6,-Math.cos(a)*r*.6],[Math.sin(a)*(r*.6+len*(i===1||i===2?1:.85)),-Math.cos(a)*(r*.6+len*(i===1||i===2?1:.85))]],fw,INK,h.side*10+i)});
  const thumb=(a,len)=>wobbleLine(ctx,[[h.side*Math.cos(a)*r*.7,-Math.sin(a)*r*.7+r*.1],[h.side*Math.cos(a)*(r*.7+len),-Math.sin(a)*(r*.7+len)+r*.1]],fw,INK,h.side*20);
  if(pose==="open"||pose==="wave"||pose==="give"){fingers(fl,.26);thumb(pose==="give"?.2:.55,fl*.7)}
  else if(pose==="point"){wobbleLine(ctx,[[0,-r*.6],[0,-r*.6-fl*1.25]],fw,INK,h.side*11);thumb(.6,fl*.45)}
  else if(pose==="thumb"){wobbleLine(ctx,[[h.side*r*.2,-r*.7],[h.side*r*.3,-r*.7-fl*1.1]],fw,INK,h.side*12)}
  else{/* grab: 손가락을 오므린다 */fingers(fl*.35,.34);thumb(.9,fl*.35)}
  wobbleCircle(ctx,0,0,r*.72,PAPER,clamp(r*.2,4,9),h.side*30);
  ctx.restore();
}

  else if(mood==="shock"){circle(c,-16,eyeY,7,PAPER,INK,4);circle(c,16,eyeY,7,PAPER,INK,4);circle(c,-16,eyeY,2.5,INK);circle(c,16,eyeY,2.5,INK)}

  else if(mood==="sweat"||mood==="shock"){c.beginPath();c.moveTo(-10,20);c.lineTo(10,20);c.stroke()}

  c.beginPath();c.moveTo(18,-26);c.quadraticCurveTo(58,-26,66,-16);c.lineTo(22,-18);c.closePath();c.fill();c.stroke();

/* ================= 낙서 사람들 (손님 · 점장님 · 알바생) =================
   손님도 전부 졸라맨 스타일! 캔버스에 졸라맨을 그려 판(빌보드)에 붙인다.
   판은 늘 나를 향해 돌고, 진열대·계산대 뒤로 가면 진짜로 가려진다.
   120ms 마다 다시 그려서 1편처럼 선이 살짝 끓고, 흰 테두리로 현실 세계에 붙인 스티커처럼 보인다 */
const DP={W:256,H:400,M:1.95,FOOT:388};        // 캔버스(px), 판 높이(m), 캔버스 속 발 위치(px)
const DP_PX=DP.H/DP.M;                          // 1m = 약 205px
const DP_S=1.58*DP_PX/122;                      // 키 1.58m (drawStick 졸라맨 키는 약 122)
const DP_OFFS=[[-4,0],[4,0],[0,-4],[0,4],[-3,-3],[3,-3],[-3,3],[3,3]];
const PEOPLE=[];
let DP_TMP=null,DP_SH=null;const DP_WP=new T.Vector3();
function makeDoodlePerson(look){
  if(!DP_TMP){DP_TMP=mkCanvas(DP.W,DP.H);DP_SH={geo:new T.CircleGeometry(.24,24),mat:new T.MeshBasicMaterial({color:0x0a0812,transparent:true,opacity:.2,depthWrite:false})}}
  const g=new T.Group();
  const cv=mkCanvas(DP.W,DP.H),tex=toTex(cv);tex.generateMipmaps=false;tex.minFilter=T.LinearFilter;tex.anisotropy=1;
  const mat=new T.MeshBasicMaterial({map:tex,transparent:true,alphaTest:.06,side:T.DoubleSide,toneMapped:false});
  const geo=new T.PlaneGeometry(DP.M*DP.W/DP.H,DP.M);geo.translate(0,DP.M/2-(DP.H-DP.FOOT)/DP_PX,0);
  const bill=new T.Mesh(geo,mat);g.add(bill);
  const sh=new T.Mesh(DP_SH.geo,DP_SH.mat);sh.rotation.x=-Math.PI/2;sh.position.y=.006;g.add(sh);
  g.userData.dp={cv,ctx:cv.getContext("2d"),tex,bill,shadow:sh,look,seed:Math.random()*100,dir:1,pose:"stand",face:"happy",t:0,extra:null,extraKey:"",next:0,key:""};
  PEOPLE.push(g);
  return g;
}
// 매 프레임 (렌더 전에): 판을 카메라 쪽으로 돌리고, 필요하면 다시 그린다
function drawPeople(now){
  const cam=camera.position;
  for(let i=PEOPLE.length-1;i>=0;i--){
    const g=PEOPLE[i],d=g.userData.dp;
    // 나간 손님은 치운다 (카트에 탄 아기처럼 누구 안에 들어 있으면 맨 위가 장면인지 본다)
    let root=g;while(root.parent)root=root.parent;
    if(root!==scene){PEOPLE.splice(i,1);d.tex.dispose();d.bill.material.dispose();d.bill.geometry.dispose();continue}
    if(!g.visible)continue;
    let p=g.position,yaw=g.rotation.y;
    if(g.parent!==scene){p=g.getWorldPosition(DP_WP);for(let o=g.parent;o&&o!==scene;o=o.parent)yaw+=o.rotation.y}
    const dx=cam.x-p.x,dz=cam.z-p.z,len=Math.hypot(dx,dz)||1;
    d.bill.rotation.y=Math.atan2(dx,dz)-yaw;
    // 몸이 화면 오른쪽을 보나 왼쪽을 보나 (정면·뒤는 그대로)
    const side=(Math.sin(yaw)*dz-Math.cos(yaw)*dx)/len;
    if(side>.2)d.dir=1;else if(side<-.2)d.dir=-1;
    const key=d.pose+d.face+d.dir+d.extraKey;
    if(now<d.next&&key===d.key)continue;
    d.key=key;d.next=now+(len>13?360:115);
    try{paintPerson(d)}catch(e){if(!d.err){d.err=1;console.error(e)}}
  }
}
function paintPerson(d){
  const W=DP.W,H=DP.H,x=DP_TMP.getContext("2d"),b=OV.boil;
  x.clearRect(0,0,W,H);
  x.save();x.translate(W/2+(seeded(d.seed+b*7.3)-.5)*2.4,DP.FOOT+(seeded(d.seed+b*3.1)-.5)*1.2);x.rotate((seeded(d.seed+b*5.7)-.5)*.02);
  drawStick(x,{x:0,y:0,s:DP_S,dir:d.dir,pose:d.pose,t:d.t,face:d.face,...d.look,...(d.extra||{})});
  x.restore();
  // 흰 테두리: 8방향으로 살짝 밀어 찍고 흰색으로 칠한 뒤, 원래 그림을 위에
  const c=d.ctx;c.clearRect(0,0,W,H);
  for(const [ox,oy] of DP_OFFS)c.drawImage(DP_TMP,ox,oy);
  c.globalCompositeOperation="source-in";c.fillStyle="#ffffff";c.fillRect(0,0,W,H);
  c.globalCompositeOperation="source-over";c.drawImage(DP_TMP,0,0);
  d.tex.needsUpdate=true;
}

/* ================= 트윈 (3D 물건 움직이기) ================= */
const TWEENS=[];
// obj.position 을 to 로. lift: 가는 길에 살짝 들어 올리는 높이
function tween(obj,to,dur,{lift=0,scale,rot}={}){
  if(!obj)return Promise.resolve();   // 손님이 가 버려서 물건이 없어졌으면 그냥 넘어간다
  return new Promise(res=>{TWEENS.push({obj,from:obj.position.clone(),to:to.clone(),dur:Math.max(1,dur),t:0,lift,res,
    s0:obj.scale.x,s1:scale,r0:obj.rotation.y,r1:rot})});
}
function stepTweens(dt){
  for(let i=TWEENS.length-1;i>=0;i--){const w=TWEENS[i];w.t+=dt;const k=Math.min(1,w.t/w.dur),e=ease(k);
    w.obj.position.lerpVectors(w.from,w.to,e);w.obj.position.y+=Math.sin(k*Math.PI)*w.lift;
    if(w.s1!=null)w.obj.scale.setScalar(lerp(w.s0,w.s1,e));if(w.r1!=null)w.obj.rotation.y=lerp(w.r0,w.r1,e);
    if(k>=1){TWEENS.splice(i,1);w.res()}}
}
// 게임 시간 기준 기다리기 (창이 떠 있으면 멈춘다)
const WAITS=[];
function sleep(ms){return new Promise(res=>WAITS.push({t:ms,res}))}
function stepWaits(dt){for(let i=WAITS.length-1;i>=0;i--){WAITS[i].t-=dt;if(WAITS[i].t<=0){const r=WAITS[i].res;WAITS.splice(i,1);r()}}}

/* ================= 졸라맨 속마음 (오른쪽 위) =================
   say: 잠깐 떴다 사라지는 한마디. story: '다음'을 눌러 넘기는 여러 줄 (다 보면 done 호출) */
const TALK_OFF_KEY="jolaman2-talk-off";
const Talk={q:[],cur:null,shown:0,hideAt:0,off:false,story:null,
  init(){try{this.off=localStorage.getItem(TALK_OFF_KEY)==="1"}catch(e){}},
  setOff(v){this.off=v;try{localStorage.setItem(TALK_OFF_KEY,v?"1":"0")}catch(e){}if(v&&!this.story){this.q=[];this.close()}},
  say(text,mood="happy",key){
    if(this.off&&!this.story)return;
    if(key){state.talked=state.talked||{};if(state.talked[key])return;state.talked[key]=1}
    if(this.q.length>=3)this.q.shift();this.q.push({text,mood});
  },
  // 이야기: 끄기 설정과 상관없이 나온다
  tell(lines,done){this.q=[];this.story={lines:lines.map(l=>typeof l==="string"?{text:l,mood:"happy"}:l),i:0,done};this.show(this.story.lines[0],true)},
  show(line,story){
    this.cur={...line,story};this.shown=0;this.hideAt=0;
    const el=$("talk");el.hidden=false;el.style.animation="none";void el.offsetWidth;el.style.animation="";
    $("talkText").textContent="";$("talkAct").hidden=!story;$("talkBox").querySelector(".nm").textContent=line.name||"졸라맨 (속마음)";
    if(story){$("talkNext").textContent=this.story.i>=this.story.lines.length-1?"알겠어 ▶":"다음 ▶";$("talkSkip").hidden=this.story.lines.length<3}
    Snd.tone(880,.05,"sine",.05);Snd.tone(1320,.08,"sine",.04,.05);
  },
  frame(dt,now){
    if(!this.cur){if(!this.q.length||!$("modal").hidden||Scr.name!=="game")return;this.show(this.q.shift(),false)}
    const c=this.cur;
    if(this.shown<c.text.length){const b=Math.floor(this.shown);this.shown=Math.min(c.text.length,this.shown+dt*.036);const n=Math.floor(this.shown);
      if(n!==b){$("talkText").textContent=c.text.slice(0,n);if(n%3===0&&c.text[n-1]!==" ")Snd.tone(700+Math.random()*260,.03,"square",.01)}}
    else if(!c.story){if(!this.hideAt)this.hideAt=now+2400+c.text.length*55;else if(now>this.hideAt){this.close();return}}
    drawTalkHead($("talkHead"),now,this.shown<c.text.length,c.mood);
  },
  click(){const c=this.cur;if(!c)return;if(this.shown<c.text.length){this.shown=c.text.length;$("talkText").textContent=c.text;return}
    if(c.story)this.next();else this.close()},
  next(){const s=this.story;if(!s)return;Snd.click();s.i++;if(s.i>=s.lines.length){this.endStory();return}this.show(s.lines[s.i],true)},
  endStory(){const s=this.story;this.story=null;this.close();if(s&&s.done)s.done()},
  close(){this.cur=null;$("talk").hidden=true}
};

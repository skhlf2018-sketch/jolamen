/* ================= 커피 내리기 미니게임 =================
   커피 머신을 누르면 창이 뜬다. 왼쪽 클릭(또는 스페이스)을 꾹 누르고 있으면 커피가 나오고,
   초록 선에서 떼면 완벽한 한 잔. 덜 차면 다시 꾹. 초록 선을 넘기면 넘친다 → 오늘 매출 0.3% 감소 */
const CG={on:false};
const CG_FILL=2400;      // 빈 컵 → 가득까지 (ms)
function coffeeGame(){
  return new Promise(res=>{
    const line=.6+Math.random()*.22,tol=.05;CG.line=line;CG.tol=tol;CG.lvl=0;CG.end=null;
    // 커피 양은 누른 시간으로 계산한다 (화면이 느려도 똑같이 찬다)
    let base=0,holdT=0,hold=false,end=null,endT=0,raf=0,msg="꾹 누르면 커피가 나와요",msgC="#2a2320";
    const level=()=>Math.min(1.02,hold?base+(performance.now()-holdT)/CG_FILL:base);
    openModal(`<div class="panel coffee"><h2>☕ 커피 내리기</h2>
      <p class="cg-how">왼쪽 클릭(또는 스페이스)을 <b>꾹</b> 누르고 있다가 <b class="g">초록 선</b>에서 떼기!<br><small>넘치면 오늘 매출 -0.3%</small></p>
      <canvas id="cgCv" width="260" height="290"></canvas></div>`);
    CG.on=true;
    const cv=$("cgCv"),x=cv.getContext("2d");
    const down=()=>{if(end||hold)return;holdT=performance.now();hold=true;Snd.pour()};
    const up=()=>{if(!hold||end)return;base=level();hold=false;
      if(base>line+tol)finish("over");
      else if(base>=line-tol)finish("perfect");
      else{msg="조금 더! 다시 꾹~";msgC="#7a5a10";Snd.click()}};
    const finish=r=>{base=level();end=r;endT=performance.now();hold=false;
      if(r==="over"){msg="넘쳤다!!! 오늘 매출 -0.3%";msgC="#d8342a";if(GAME.night)GAME.night.coffeeOver=(GAME.night.coffeeOver||0)+1;Snd.fail();Snd.noiseHit(900,.4,.1)}
      else{msg="완벽! 초록 선에 딱!";msgC="#1d9a4a";MISSION.add("coffee");if(GAME.night)GAME.night.coffeeOk=(GAME.night.coffeeOk||0)+1;Snd.happy()}};
    // 입력: 마우스 왼쪽 (마우스를 가둔 상태에서도 document 로 온다), 터치, 스페이스
    const md=e=>{if(e.button===0){e.preventDefault();down()}},mu=e=>{if(e.button===0)up()};
    const td=e=>{e.preventDefault();down()},tu=e=>{e.preventDefault();up()};
    const kd=e=>{if((e.code==="Space"||e.code==="Enter")&&!e.repeat){e.preventDefault();e.stopPropagation();down()}},ku=e=>{if(e.code==="Space"||e.code==="Enter"){e.preventDefault();up()}};
    document.addEventListener("mousedown",md,true);document.addEventListener("mouseup",mu,true);
    $("modal").addEventListener("touchstart",td,{passive:false});$("modal").addEventListener("touchend",tu,{passive:false});
    addEventListener("keydown",kd,true);addEventListener("keyup",ku,true);
    const cleanup=()=>{CG.on=false;cancelAnimationFrame(raf);
      document.removeEventListener("mousedown",md,true);document.removeEventListener("mouseup",mu,true);
      $("modal").removeEventListener("touchstart",td);$("modal").removeEventListener("touchend",tu);
      removeEventListener("keydown",kd,true);removeEventListener("keyup",ku,true)};
    // 그리기: 컵 안쪽 y 120(위)~262(아래)
    const CT=120,CB=262,cupY=v=>CB-(CB-CT)*v;
    const draw=now=>{
      if(hold&&!end&&level()>=1)finish("over");
      const lvl=level();CG.lvl=lvl;CG.end=end;
      x.clearRect(0,0,260,290);x.lineCap="round";x.lineJoin="round";
      // 커피 머신 머리 + 노즐
      x.fillStyle="#1c1d21";x.fillRect(40,6,180,52);x.fillStyle="#2c6fd6";x.fillRect(52,16,90,22);
      x.fillStyle="#fff";x.font=`15px ${FONT_D}`;x.textAlign="center";x.textBaseline="middle";x.fillText("졸라커피",97,28);
      x.fillStyle="#9aa0aa";x.fillRect(118,58,24,16);
      // 쪼르르 줄기
      if(hold&&!end){x.strokeStyle="#6b3e1f";x.lineWidth=7;x.beginPath();x.moveTo(130,74);for(let yy=74;yy<cupY(lvl);yy+=10)x.lineTo(130+Math.sin(now*.03+yy*.2)*2,yy);x.lineTo(130,cupY(lvl));x.stroke()}
      // 컵 안 커피
      const top=cupY(Math.min(lvl,1));
      x.save();x.beginPath();x.moveTo(72,CT);x.lineTo(188,CT);x.lineTo(176,CB);x.lineTo(84,CB);x.closePath();x.clip();
      x.fillStyle="#6b3e1f";x.fillRect(60,top,140,CB-top+4);x.fillStyle="#c89a6a";x.fillRect(60,top-3,140,7);   // 거품
      x.restore();
      // 초록 선 (허용 범위는 연한 초록 띠)
      x.fillStyle="rgba(47,191,113,.28)";x.fillRect(58,cupY(line+tol),144,cupY(line-tol)-cupY(line+tol));
      x.strokeStyle="#1d9a4a";x.lineWidth=4;x.setLineDash([10,6]);x.beginPath();x.moveTo(52,cupY(line));x.lineTo(208,cupY(line));x.stroke();x.setLineDash([]);
      x.fillStyle="#1d9a4a";x.font=`14px ${FONT_D}`;x.textAlign="left";x.fillText("여기!",212,cupY(line));
      // 컵 테두리 + 손잡이
      x.strokeStyle=INK;x.lineWidth=4;x.beginPath();x.moveTo(72,CT-6);x.lineTo(84,CB);x.lineTo(176,CB);x.lineTo(188,CT-6);x.stroke();
      x.beginPath();x.arc(192,190,22,-1.2,1.2);x.stroke();
      // 넘침: 컵 옆으로 줄줄 + 바닥 웅덩이
      if(end==="over"){const k=clamp((now-endT)/500,0,1);x.fillStyle="#6b3e1f";
        [[70,1],[190,-1]].forEach(([sx,d])=>{x.beginPath();x.moveTo(sx,CT-4);x.quadraticCurveTo(sx-d*10,CT+60,sx-d*6,CT+(CB-CT)*k);x.lineWidth=6;x.strokeStyle="#6b3e1f";x.stroke()});
        x.beginPath();x.ellipse(130,CB+14,40+60*k,8,0,0,TAU);x.fill()}
      // 안내 글씨
      x.fillStyle=msgC;x.font=`17px ${FONT_D}`;x.textAlign="center";x.fillText(msg,130,282);
      if(end&&now-endT>1100){cleanup();closeModal();res(end);return}
      raf=requestAnimationFrame(draw);
    };
    raf=requestAnimationFrame(draw);
  });
}


/* ================= 마우스 가두기 =================
   게임 화면을 누르면 마우스가 게임 화면 밖으로 못 나간다 (브라우저 포인터 잠금, Esc 로 풀기).
   진짜 커서는 숨고, 낙서 손 커서를 직접 움직인다. 화면 끝에 닿으면 멈추고,
   버튼·금고·폰 화면·말풍선도 그대로 누를 수 있다 (손 밑에 있는 것을 대신 눌러 준다) */
const ML={on:false,x:0,y:0,want:true,fails:0,waitT:0,down:null,over:null,hl:null,told:false};
try{ML.want=localStorage.getItem("jolaman2-mlock")!=="0"}catch(e){}
function setMouseLock(v){ML.want=v;try{localStorage.setItem("jolaman2-mlock",v?"1":"0")}catch(e){}if(!v&&ML.on)document.exitPointerLock()}
// 게임 화면을 누를 때 잠근다 (사용자가 누를 때만 잠글 수 있다)
function tryLock(e){
  if(!ML.want||ML.on||ML.fails>=3||Scr.name!=="game"||e.pointerType!=="mouse"||performance.now()<ML.waitT)return;
  const app=$("app");if(!app.requestPointerLock)return;
  ML.x=e.clientX;ML.y=e.clientY;
  const fail=()=>{ML.fails++;ML.waitT=performance.now()+1500};
  try{const p=app.requestPointerLock();if(p&&p.catch)p.catch(fail)}catch(err){fail()}
}
document.addEventListener("pointerlockerror",()=>{ML.fails++;ML.waitT=performance.now()+1500});
document.addEventListener("pointerlockchange",()=>{
  const on=document.pointerLockElement===$("app");ML.on=on;$("swcur").hidden=!on;
  if(on){ML.fails=0;placeSw();syncMouse();
    if(!ML.told){ML.told=true;toast("마우스가 게임 화면 안에 갇혔어요 · Esc 누르면 풀려요")}}
  else{LOOK.on=false;LOOK.id=null;MOUSE.down=false;ML.down=null;hlBtn(null);ML.waitT=performance.now()+1200;
    // 풀리면 진짜 커서를 손 커서 자리로 (브라우저가 허락하는 만큼)
    MOUSE.x=ML.x-$("gl").getBoundingClientRect().left;MOUSE.y=ML.y-$("gl").getBoundingClientRect().top}
});
// 게임이 아닌 화면(타이틀·엔딩)으로 가면 푼다
function unlockIfNotGame(){if(ML.on&&Scr.name!=="game")document.exitPointerLock()}

const swEv=(b,id=-1)=>({button:b,pointerType:"mouse",pointerId:id,clientX:ML.x,clientY:ML.y,movementX:0,movementY:0,preventDefault(){},__sw:true});
function syncMouse(){
  const r=$("gl").getBoundingClientRect(),t=document.elementFromPoint(ML.x,ML.y);
  MOUSE.x=ML.x-r.left;MOUSE.y=ML.y-r.top;MOUSE.in=t===$("gl");MOUSE.seen=true;ML.over=t;
}
function placeSw(){
  const k=CUR.kind||"point",h=CUR_HOT[k]||[9,4];
  $("swcur").style.transform=`translate(${Math.round(ML.x-h[0])}px,${Math.round(ML.y-h[1])}px)`;
}
// 손 밑의 HTML 버튼을 살짝 밝게 (진짜 커서가 없으니 :hover 대신)
const BTN_SEL="button,[role=button],.cash-grid button,.tray i,.tray span";
function hlBtn(el){if(ML.hl===el)return;if(ML.hl)ML.hl.classList.remove("vhover");ML.hl=el;if(el)el.classList.add("vhover")}
function overBtn(){const t=ML.over;if(!t||!t.closest||t===$("gl"))return null;const b=t.closest(BTN_SEL);return b&&!b.disabled?b:null}

document.addEventListener("mousemove",e=>{
  if(!ML.on)return;
  const dx=e.movementX||0,dy=e.movementY||0;
  if(LOOK.on){if(canMove()){PLAYER.yaw-=dx*.0036;PLAYER.pitch=clamp(PLAYER.pitch-dy*.0036,-1.2,1.05)}return}   // 우클릭 둘러보기: 손은 그대로
  const r=$("app").getBoundingClientRect();
  ML.x=clamp(ML.x+dx,r.left+1,r.right-2);ML.y=clamp(ML.y+dy,r.top+1,r.bottom-2);   // 화면 끝에서 멈춘다
  syncMouse();placeSw();hlBtn(overBtn());
  if(DRAG.id===-1)onMove(swEv(0));
},true);
document.addEventListener("mousedown",e=>{
  if(!ML.on)return;
  syncMouse();const t=ML.over;
  if(e.button===2){if(t===$("gl")&&canMove()){LOOK.on=true;LOOK.id=-1}return}
  if(e.button!==0)return;
  if(t===$("gl")){ML.down="gl";onDown(swEv(0));return}
  ML.down=t;ML.dx=ML.x;ML.dy=ML.y;
},true);
document.addEventListener("mouseup",e=>{
  if(!ML.on)return;
  if(e.button===2){LOOK.on=false;LOOK.id=null;return}
  if(e.button!==0)return;
  syncMouse();const t=ML.over,d=ML.down;ML.down=null;
  if(d==="gl"||(d==null&&DRAG.id!=null)){onUp(swEv(0,DRAG.id));return}   // 3D 화면 누르기 (잠그던 순간의 클릭 포함)
  // 누른 버튼 위에서 떼거나, 누르는 동안 손이 살짝(16px 안) 흔들렸으면 그 버튼을 누른다
  const same=t&&(d===t||d.contains(t)||t.contains(d)),still=Math.hypot(ML.x-ML.dx,ML.y-ML.dy)<16;
  if(d&&d!=="gl"&&(same||still)&&typeof d.click==="function")d.click();
},true);
// 폰 목록 같은 스크롤도 손 밑에서
document.addEventListener("wheel",e=>{
  if(!ML.on)return;
  let el=document.elementFromPoint(ML.x,ML.y);
  while(el&&el!==document.body){const cs=getComputedStyle(el);
    if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight+1){el.scrollTop+=e.deltaY;e.preventDefault();return}
    el=el.parentElement}
},{capture:true,passive:false});


/* ================= 미니게임 모음 (질리지 않게 중간중간) =================
   핫바 그릴 → 핫바 굽기 (움직이는 바늘을 황금빛 칸에서 멈추기)
   아이스크림 냉동고 → 맛 찾기 (손님이 말한 맛을 5초 안에 고르기)
   한가할 때 가끔 → 파리 잡기 / 본사 이벤트 즉석 복권 긁기 */
const MG={on:false,cur:null};
// 캔버스 안 좌표 (마우스를 가뒀으면 낙서 손 위치)
function mgPtr(cv,e){
  const r=cv.getBoundingClientRect();let cx,cy;
  if(ML.on){cx=ML.x;cy=ML.y}
  else{const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0]);cx=t?t.clientX:e.clientX;cy=t?t.clientY:e.clientY}
  return {x:(cx-r.left)*cv.width/r.width,y:(cy-r.top)*cv.height/r.height};
}
// 공통 틀: 창 + 캔버스 + 입력 + 끝나면 결과 돌려주기
function mini(o){
  return new Promise(res=>{
    openModal(`<div class="panel mg"><h2>${o.title}</h2><p class="mg-how">${o.how}</p><canvas id="mgCv" width="${o.W}" height="${o.H}"></canvas></div>`);
    const cv=$("mgCv"),x=cv.getContext("2d"),S={t0:performance.now(),done:null,doneT:0,msg:"",msgC:INK,down:false};
    MG.on=true;MG.cur=S;
    S.finish=(r,msg,col)=>{if(S.done)return;S.done=r;S.doneT=performance.now();if(msg!=null){S.msg=msg;S.msgC=col||INK}};
    const P=e=>mgPtr(cv,e);
    const md=e=>{if(e.button!==0||S.done)return;e.preventDefault();S.down=true;o.down&&o.down(S,P(e))};
    const mm=e=>{if(!S.done&&o.move)o.move(S,P(e))};
    const mu=e=>{if(e.button!==0)return;S.down=false;if(!S.done&&o.up)o.up(S,P(e))};
    const td=e=>{e.preventDefault();if(S.done)return;S.down=true;o.down&&o.down(S,P(e))};
    const tm=e=>{e.preventDefault();if(!S.done&&o.move)o.move(S,P(e))};
    const tu=e=>{e.preventDefault();S.down=false;if(!S.done&&o.up)o.up(S,P(e))};
    const kd=e=>{if((e.code==="Space"||e.code==="Enter")&&!e.repeat){e.preventDefault();e.stopPropagation();if(!S.done&&o.key)o.key(S)}};
    document.addEventListener("mousedown",md,true);document.addEventListener("mousemove",mm,true);document.addEventListener("mouseup",mu,true);
    const M=$("modal");M.addEventListener("touchstart",td,{passive:false});M.addEventListener("touchmove",tm,{passive:false});M.addEventListener("touchend",tu,{passive:false});
    addEventListener("keydown",kd,true);
    let raf=0;
    const cleanup=()=>{MG.on=false;MG.cur=null;cancelAnimationFrame(raf);
      document.removeEventListener("mousedown",md,true);document.removeEventListener("mousemove",mm,true);document.removeEventListener("mouseup",mu,true);
      M.removeEventListener("touchstart",td);M.removeEventListener("touchmove",tm);M.removeEventListener("touchend",tu);removeEventListener("keydown",kd,true)};
    const loop=now=>{
      x.clearRect(0,0,o.W,o.H);x.lineCap="round";x.lineJoin="round";
      o.frame(S,x,now);
      if(S.msg){x.fillStyle=S.msgC;x.font=`18px ${FONT_D}`;x.textAlign="center";x.textBaseline="middle";x.fillText(S.msg,o.W/2,o.H-14)}
      if(S.done&&now-S.doneT>(o.hold||1100)){cleanup();closeModal();res(S.done);return}
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
  });
}
// 남은 시간 막대
function mgTimer(x,W,k){x.fillStyle="#e6e1d4";x.fillRect(20,8,W-40,10);x.fillStyle=k>.3?"#2fbf71":"#e8412c";x.fillRect(20,8,(W-40)*clamp(k,0,1),10);x.strokeStyle=INK;x.lineWidth=2;x.strokeRect(20,8,W-40,10)}
const mgText=(x,s,X,Y,px,col=INK)=>{x.fillStyle=col;x.font=`${px}px ${FONT_D}`;x.textAlign="center";x.textBaseline="middle";x.fillText(s,X,Y)};

/* ---------- 🔥 핫바 굽기 ---------- */
function grillGame(){
  const zc=.45+Math.random()*.25,zw=.2;
  return mini({title:"🔥 핫바 굽기",how:"바늘이 <b style='color:#c97a14'>황금빛 칸</b>에 왔을 때 클릭(또는 스페이스)!",W:320,H:220,
    frame(S,x,now){
      S.zc=zc;const ph=((( S.stopP!=null?S.stopT:now)-S.t0)/1000*.6)%1,p=S.stopP!=null?S.stopP:(ph<.5?ph*2:2-ph*2);S.p=p;
      // 그릴 + 핫바 (익는 정도에 따라 색이 변한다)
      x.fillStyle="#3a3d44";x.fillRect(40,40,240,70);x.strokeStyle="#8a8e96";x.lineWidth=4;for(let i=0;i<6;i++){x.beginPath();x.moveTo(50+i*44,44);x.lineTo(50+i*44,106);x.stroke()}
      const col=p<.5?mixCol("#f2a3a0","#d9892b",p*2):mixCol("#d9892b","#2a1a10",(p-.5)*2);
      x.fillStyle=col;x.strokeStyle=INK;x.lineWidth=3;rr(x,70,62,180,28,14);x.fill();x.stroke();
      x.strokeStyle="rgba(0,0,0,.35)";x.lineWidth=3;for(let i=0;i<5;i++){x.beginPath();x.moveTo(95+i*32,64);x.lineTo(85+i*32,88);x.stroke()}
      x.strokeStyle="#c9a26a";x.lineWidth=5;x.beginPath();x.moveTo(250,76);x.lineTo(290,76);x.stroke();
      if(p>.8&&!S.done){x.fillStyle="rgba(80,80,80,.5)";for(let i=0;i<3;i++){x.beginPath();x.arc(120+i*40,50-((now/8+i*20)%30),8,0,TAU);x.fill()}}
      // 익힘 막대: 날것 → 황금빛 → 탐
      const bx=30,bw=260,by=132;
      const g=x.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,"#f2a3a0");g.addColorStop(.5,"#d9892b");g.addColorStop(1,"#2a1a10");
      x.fillStyle=g;x.fillRect(bx,by,bw,20);x.strokeStyle=INK;x.lineWidth=3;x.strokeRect(bx,by,bw,20);
      x.strokeStyle="#2fbf71";x.lineWidth=4;x.strokeRect(bx+bw*(zc-zw/2),by-4,bw*zw,28);
      mgText(x,"날것",bx+22,by+36,13,"#a05050");mgText(x,"황금빛",bx+bw*zc,by+36,13,"#1d9a4a");mgText(x,"탐",bx+bw-14,by+36,13,"#3a2416");
      const nx=bx+bw*p;x.fillStyle=INK;x.beginPath();x.moveTo(nx,by-4);x.lineTo(nx-9,by-18);x.lineTo(nx+9,by-18);x.closePath();x.fill();
    },
    down(S){this.key(S)},
    key(S){const p=S.p;S.stopP=p;S.stopT=performance.now();
      if(Math.abs(p-zc)<=zw/2){S.finish("perfect","황금빛! 완벽하게 구웠다","#1d9a4a");Snd.sizzle();Snd.happy()}
      else if(p<zc){S.finish("raw","앗, 덜 익었다...","#a05050");Snd.boing()}
      else{S.finish("burnt","탔다!! 까맣다...","#3a2416");Snd.fail()}}
  });
}
function mixCol(a,b,k){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);k=clamp(k,0,1);
  const c=[16,8,0].map(s=>Math.round(((A>>s)&255)*(1-k)+((B>>s)&255)*k));return `rgb(${c[0]},${c[1]},${c[2]})`}

/* ---------- 🍦 아이스크림 맛 찾기 ---------- */
const FLAVORS=[{n:"딸기",c:"#ff8fb3"},{n:"초코",c:"#7a4a2a"},{n:"바닐라",c:"#fff3c8"},{n:"민트",c:"#8fe3c8"},{n:"메론",c:"#b5e36a"},{n:"블루베리",c:"#7d7ff0"}];
function iceGame(){
  const want=pick(FLAVORS),others=FLAVORS.filter(f=>f!==want);
  const slots=[want,...Array.from({length:5},()=>pick(others))].sort(()=>Math.random()-.5);
  const LIM=5000;
  return mini({title:"🍦 아이스크림 맛 찾기",how:`손님: "<b>${want.n}</b> 맛으로 주세요!" 냉동고에서 그 맛을 눌러요 (5초)`,W:340,H:250,
    frame(S,x,now){
      S.want=want;S.slots=slots;const k=1-(now-S.t0-(S.pen||0))/LIM;if(!S.done)mgTimer(x,340,k);
      if(k<=0&&!S.done){S.finish("late","시간 끝! 아무 맛이나 드렸다...","#a05050");Snd.boing()}
      x.fillStyle="#dfefff";x.fillRect(16,30,308,178);x.strokeStyle="#2c6fd6";x.lineWidth=4;x.strokeRect(16,30,308,178);
      slots.forEach((f,i)=>{const cx=70+(i%3)*100,cy=80+Math.floor(i/3)*82,sh=S.shake&&S.shake.i===i&&now-S.shake.t<300?Math.sin(now*.08)*4:0;
        x.fillStyle="#e3b57a";x.strokeStyle=INK;x.lineWidth=3;x.beginPath();x.moveTo(cx-16+sh,cy+6);x.lineTo(cx+16+sh,cy+6);x.lineTo(cx+sh,cy+42);x.closePath();x.fill();x.stroke();
        x.fillStyle=f.c;x.beginPath();x.arc(cx+sh,cy,20,0,TAU);x.fill();x.stroke();
        if(S.done&&f===want){x.strokeStyle="#2fbf71";x.lineWidth=4;x.beginPath();x.arc(cx,cy+12,34,0,TAU);x.stroke()}
        S.hits=S.hits||[];S.hits[i]=[cx,cy+10]});
    },
    down(S,p){
      const i=(S.hits||[]).findIndex(([cx,cy])=>Math.hypot(p.x-cx,p.y-cy)<34);if(i<0)return;
      if(slots[i]===want){S.finish("perfect",`딱 ${want.n} 맛!`,"#1d9a4a");Snd.happy()}
      else{S.pen=(S.pen||0)+900;S.shake={i,t:performance.now()};S.msg=`이건 ${slots[i].n} 맛이잖아!`;S.msgC="#a05050";Snd.errBeep()}
    }
  });
}

/* ---------- 🪰 파리 잡기 (한가할 때) ---------- */
function flyGame(){
  const LIM=9000,W=380,H=250;
  return mini({title:"🪰 파리 잡기!",how:"계산대에 파리가 앉았다! 파리를 <b>3번</b> 눌러 잡아요 (9초)",W,H,
    frame(S,x,now){
      if(!S.f)S.f={x:W/2,y:H/2,vx:120,vy:80,hits:0,last:now,flash:0};
      const f=S.f,dt=Math.min(.05,(now-f.last)/1000);f.last=now;
      const k=1-(now-S.t0)/LIM;if(!S.done)mgTimer(x,W,k);
      if(k<=0&&!S.done){S.finish("miss","파리가 창문으로 도망갔다...","#a05050");Snd.boing()}
      if(!S.done){const sp=1+f.hits*.45;
        f.vx+=(Math.random()-.5)*900*dt;f.vy+=(Math.random()-.5)*900*dt;const v=Math.hypot(f.vx,f.vy),mx=180*sp;if(v>mx){f.vx*=mx/v;f.vy*=mx/v}
        f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.x<30||f.x>W-30){f.vx*=-1;f.x=clamp(f.x,30,W-30)}if(f.y<40||f.y>H-40){f.vy*=-1;f.y=clamp(f.y,40,H-40)}}
      // 계산대 바닥
      x.fillStyle="#f4efe6";x.fillRect(10,26,W-20,H-52);x.strokeStyle="#d8cfb8";x.lineWidth=2;x.strokeRect(10,26,W-20,H-52);
      mgText(x,"편의점 24",W/2,H/2,40,"rgba(44,111,214,.12)");
      // 파리
      const wing=Math.sin(now*.09)*.5;
      x.save();x.translate(f.x,f.y);x.rotate(Math.atan2(f.vy,f.vx));
      x.fillStyle="rgba(200,230,255,.8)";x.strokeStyle=INK;x.lineWidth=1.5;
      [[-1,wing],[1,-wing]].forEach(([s,w])=>{x.save();x.rotate(s*(.9+w));x.beginPath();x.ellipse(-2,s*10,9,5,0,0,TAU);x.fill();x.stroke();x.restore()});
      x.fillStyle="#1c1d21";x.beginPath();x.ellipse(0,0,11,7,0,0,TAU);x.fill();x.fillStyle="#b3262a";x.beginPath();x.arc(9,-3,3,0,TAU);x.arc(9,3,3,0,TAU);x.fill();
      x.restore();
      if(now-f.flash<250){mgText(x,"찰싹!",f.x,f.y-26,20,"#e8412c")}
      mgText(x,"잡은 횟수 "+"●".repeat(f.hits)+"○".repeat(Math.max(0,3-f.hits)),W/2,H-40,16,INK);
    },
    down(S,p){const f=S.f;if(!f)return;
      if(Math.hypot(p.x-f.x,p.y-f.y)<30){f.hits++;f.flash=performance.now();Snd.noiseHit(1800,.12,.12);f.vx*=-1.3;f.vy*=-1.3;
        if(f.hits>=3){S.finish("win","잡았다!! 계산대가 깨끗해졌다","#1d9a4a");Snd.happy()}}
      else{S.msg="휙! 빗나갔다";S.msgC="#7a5a10"}}
  });
}

/* ---------- 🎟 본사 이벤트 즉석 복권 (한가할 때) ---------- */
const LOTTO_SYM=[{s:"₩",c:"#c9a227"},{s:"★",c:"#f0a020"},{s:"♥",c:"#e8412c"},{s:"졸",c:"#2c6fd6"}];

  else{sy=LOTTO_SYM.slice().sort(()=>Math.random()-.5).slice(0,3)}
  const PX=[45,135,225],PY=78,PS=90,N=8;

    PX.forEach((px,i)=>{for(let a=0;a<N;a++)for(let b=0;b<N;b++){const qx=px+(a+.5)*PS/N,qy=PY+(b+.5)*PS/N;if(Math.hypot(qx-p.x,qy-p.y)<19)cells[i].add(a*N+b)}

    if(open.every(Boolean)&&!S.done){
      const same=sy[0]===sy[1]&&sy[1]===sy[2],two=!same&&(sy[0]===sy[1]||sy[1]===sy[2]||sy[0]===sy[2]);
      if(same){S.prize=earnUp(20000*moneyScale());S.finish("jackpot",`${sy[0].s} ${sy[0].s} ${sy[0].s} 당첨!!! +${won(S.prize)}`,"#c97a14");Snd.fanfare()}
      else if(two){S.prize=earnUp(3000*moneyScale());S.finish("small",`두 개 같다! +${won(S.prize)}`,"#1d9a4a");Snd.happy()}
      else{S.prize=0;S.finish("lose","꽝! ...다음엔 되겠지","#7a5a10");Snd.boing()}}};
  return mini({title:"🎟 본사 이벤트 즉석 복권",how:"은색 칸을 <b>꾹 누른 채 문질러서</b> 긁어요! 세 칸이 같으면 대박",W,H,hold:1700,
    frame(S,x,now){
      x.fillStyle="#fff7d6";rr(x,20,22,W-40,H-50,16);x.fill();x.strokeStyle=INK;x.lineWidth=3;x.stroke();
      mgText(x,"졸라맨 편의점 본사 · 행운 복권",W/2,48,17,"#7a5a10");
      PX.forEach((px,i)=>{x.fillStyle="#fff";x.fillRect(px,PY,PS,PS);x.strokeStyle="#d8cfb8";x.lineWidth=2;x.strokeRect(px,PY,PS,PS);mgText(x,sy[i].s,px+PS/2,PY+PS/2+2,50,sy[i].c)});

/* ---------- 한가할 때 가끔 일어나는 일 ---------- */
const EV={t:0,n:0};
function resetMiniEvents(){EV.t=30+Math.random()*20;EV.n=0}
function stepMiniEvents(dt){
  if(!GAME.running||GAME.tut||state.role!=="owner"||EV.n>=2)return;
  EV.t-=dt/1000;if(EV.t>0)return;
  // 정말 한가할 때만: 계산 중·줄 선 손님·데워 달라는 손님·전자레인지 돌아가는 중이면 미룬다
  if(GAME.cur||GAME.busy||MW.carry||MW.state!=="idle"||CUST.some(c=>c.heatReq||c.state==="queue"||c.state==="toQueue")||!canMove()||Talk.story||actRunning||ACTQ.length){EV.t=3;return}
  EV.t=40+Math.random()*30;EV.n++;
  const fly=Math.random()<.5;
  Snd.chime();Talk.say(fly?"앗, 계산대에 파리가 앉았다! 잡자!!":"본사에서 이벤트 복권이 왔다! 긁어 보자!",fly?"shock":"wink");
  setTimeout(()=>{if(!GAME.running||!canMove()||GAME.cur)return;queueAct(fly?flyEvent:lottoEvent)},900);
}
async function flyEvent(){
  const r=await flyGame();const N=GAME.night;
  if(r==="win"){const b=earnUp(2000*moneyScale());N.mini=(N.mini||0)+b;state.rating=clamp(state.rating+.1,1,5);MISSION.add("fly");toast(`파리 퇴치! 평점 +0.1 · 보너스 +${won(b)}`)}
  else{state.rating=clamp(state.rating-.05,1,5)}
  updateHud();
}
async function lottoEvent(){
  const r=await lottoGame();const N=GAME.night;
  const prize=r==="jackpot"?earnUp(20000*moneyScale()):r==="small"?earnUp(3000*moneyScale()):0;

/* ---------- 슈퍼마켓 안 길 찾기: 세로 통로 + 가로 통로 두 줄 ---------- */
const nearCol=x=>COLS.reduce((a,c)=>Math.abs(c-x)<Math.abs(a-x)?c:a,COLS[0]);
function hallRoute(from,to){
  const back=from.z>-2.3||to.z>-2.3,row=back?ROW_B:ROW_F,a=nearCol(from.x),b=nearCol(to.x);
  const out=[];
  if(back&&from.z>-2.3)out.push(V3(from.x,0,ROW_B));
  else out.push(V3(a,0,from.z),V3(a,0,row));
  out.push(V3(b,0,row));
  if(to.z>-2.3)out.push(V3(to.x,0,ROW_B));else out.push(V3(b,0,to.z));
  out.push(to.clone());
  return out;
}
// 들어와서 둘러볼 곳 (넓은 통로 아무 데나)
function hallBrowse(){
  if(Math.random()<.25){const c=pick(BACK_COLS);return V3(c,0,-1.4+Math.random()*2.6)}
  const c=pick(COLS);return V3(c+(Math.random()-.5)*.6,0,-5.3+Math.random()*2.6);
}
function hallLeavePath(C){return hallRoute(C.obj.position,V3(0,0,ROW_F)).concat([SPOT.door.clone(),SPOT.outside.clone().setX((Math.random()-.5)*4)])}

function tweenScale(o,to,ms){const t0=performance.now(),s0=o.scale.x;const f=()=>{const k=Math.min(1,(performance.now()-t0)/ms);o.scale.setScalar(s0+(to-s0)*k);if(k<1)requestAnimationFrame(f)};f()}
function marketHits(c){MK.flyers.forEach(s=>{if(s.use&&!s.m.visible)c.push(s.hit)})}
function marketLabel(H){if(H.act!=="flyer")return false;const s=H.target.userData.flyer;H.label="전단지 붙이기";

/* ---------- 장바구니 손님 → 셀프 계산대 ---------- */
const laneSpot=L=>V3(L.x,0,-6.45);
const waitSpot=j=>V3(-.45+(j%2)*.9,0,-5.3+Math.floor(j/2)*.6);
function goSelf(C){
  C.state="toSelf";C.self=true;C.lane=null;SELFQ.push(C);C.path=[];placeSelf();
}
function placeSelf(){
  LANES.forEach(L=>{if(L.by&&(L.by.state==="gone"||L.by.state==="leave"))L.by=null});
  // 빈 계산대마다 기다리던 손님 중 가까운 사람
  LANES.forEach(L=>{if(L.by||!SELFQ.length)return;
    let bi=0,bd=1e9;SELFQ.forEach((C,i)=>{const d=Math.abs(C.obj.position.x-L.x)+i*1.5;if(d<bd){bd=d;bi=i}});
    const C=SELFQ.splice(bi,1)[0];L.by=C;C.lane=L;C.selfT=0;C.selfK=-1;
    C.path=hallRoute(C.obj.position,V3(L.x,0,ROW_F)).concat([laneSpot(L)])});
  SELFQ.forEach((C,j)=>{C.path=hallRoute(C.obj.position,waitSpot(j))});
}
function stepSelf(C,dt,now){
  const L=C.lane;C.obj.rotation.y=angLerp(C.obj.rotation.y,Math.PI,Math.min(1,dt*.008));
  if(!L)return;
  C.selfT+=dt*effMult()*(1+upEff("speed"));const k=Math.floor(C.selfT/650);   // 로봇 시대: 효율 +50% (삑삑이 1.5배 빠르다)
  if(k!==C.selfK&&k<5){C.selfK=k;Snd.tone(1800,.05,"square",.03);L.light.emissiveIntensity=1.4;setTimeout(()=>L.light.emissiveIntensity=.2,120)}
  if(C.selfT<3300)return;
  const unit=10*moneyScale(),total=Math.round(C.items.reduce((s,k)=>s+priceOf(k),0)*salesMult()/unit)*unit,N=GAME.night;   // 로봇 시대: 매출 +15%
  N.sales+=total;N.served++;N.self=(N.self||0)+1;MISSION.add("served");
  if(robotAge())state.rating=clamp(state.rating+.004*satMult(),1,5);   // 만족한 손님이 평점을 올려 준다
  if(C.type==="rich"){const tip=Math.max(0,50000*moneyScale()-total);N.tips+=tip;sayC(C,"허허, 거스름돈은 기계 속에 두고 가네!","love")}
  else sayC(C,pick(["셀프 계산 편하다~","삑삑 끝!","장바구니 여기 두고 갈게요~"]),"love");
  const s=toScreen(C.obj.position.clone().setY(1.2));if(!s.behind)floatText(`셀프 계산 +${won(total)}`,s.x,s.y,"#8ff7b5",20);Snd.coin();
  L.by=null;C.lane=null;
  // 먹고 가는 손님은 테이블로, 아니면 문으로
  C.scanned=C.items.slice();
  if(tryEat(C)){C.path=hallRoute(C.obj.position,V3(-1.3,0,ROW_B)).concat(C.path)}
  else{C.state="leave";C.path=[V3(L.x,0,ROW_F),V3(L.x>0?.4:-.4,0,ROW_F),SPOT.door.clone(),SPOT.outside.clone().setX((Math.random()-.5)*4)]}
  placeSelf();
}

/* ---------- 서비스 코너: 기계 주문 손님 (계산대 대신) ---------- */
const svcSpot=j=>j===0?V3(2.35,0,-2.15):V3(3.15,0,-2.7-(j-1)*.55);
function goSvc(C){C.state="toSvc";SVCQ.push(C);placeSvc()}
function placeSvc(){SVCQ.forEach((C,j)=>{C.path=hallRoute(C.obj.position,svcSpot(j))})}
function stepSvc(C,dt){
  C.obj.rotation.y=angLerp(C.obj.rotation.y,0,Math.min(1,dt*.008));
  if(SVCQ.indexOf(C)>1)return;   // 앞의 두 명만 부른다
  C.callT=(C.callT==null?0:C.callT)-dt;
  if(C.callT<=0){C.callT=9000;const o=C.orders.find(o=>!o.done);if(o){sayC(C,`${nameOf(o.key)} 하나 주세요~!`);Snd.chime()}}
}
// 줄 선 손님 중 이 기계 주문이 있는 사람 (앞사람부터)
const svcCustomer=m=>SVCQ.find(C=>C.state==="svc"&&C.orders.some(o=>o.machine===m&&!o.done))||null;
// 기계에서 만든 걸 손님한테 건넨다
async function handToSvc(C,it){
  await tween(it,C.obj.position.clone().setY(1.0*(C.def.scale||1)),420,{lift:.2});scene.remove(it);
  if(C.state==="svc"&&!C.orders.some(o=>!o.done)){sayC(C,"감사합니다! 계산은 셀프로 할게요~","love");const i=SVCQ.indexOf(C);if(i>=0)SVCQ.splice(i,1);placeSvc();goSelf(C)}
}

/* ---------- 자동 진열 기계 (두 번째 리모델링부터): 1초에 30개 ---------- */
const AUTO={acc:0,shown:0,moved:0};
function stepAuto(dt,now){
  if(MK.arm&&MK.auto.visible){MK.arm.rotation.y=Math.sin(now*.004)*1.2;MK.fore.rotation.x=Math.sin(now*.007)*.5}
  if(!GAME.running||!autoShelf())return;
  AUTO.acc+=dt/1000*30*effMult();let n=Math.floor(AUTO.acc);if(!n)return;AUTO.acc-=n;   // 1초에 30개 (로봇 시대 45개)
  const ap=V3(-3.4,1.2,3.0);
  // 1) 빈 진열 칸 채우기
  while(n>0&&CHORES.gaps.length){const s=CHORES.gaps[0];const k=s.items.findIndex(({m,i})=>{const e=new T.Matrix4();m.getMatrixAt(i,e);return e.elements[0]===0});
    if(k<0){fillSection(s);CHORES.gaps.shift();GAME.night.restock=(GAME.night.restock||0)+1;continue}
    const {m,i,mat}=s.items[k];m.setMatrixAt(i,mat);m.instanceMatrix.needsUpdate=true;n--;AUTO.moved++;
    if(AUTO.moved%6===0)flyItem(ap,s.c)}
  // 2) 창고에 온 졸팡 박스 풀기
  const b=openBoxes()[0];
  if(b&&n>0){const keys=Object.keys(b.items).filter(k=>b.items[k]>0);
    while(n>0&&keys.length){const k=keys[0];const take=Math.min(n,b.items[k]);addStock(k,take);b.items[k]-=take;n-=take;AUTO.moved+=take;if(!b.items[k])keys.shift()}
    if(now-AUTO.shown>900){AUTO.shown=now;const s=toScreen(ap);if(!s.behind&&PLAYER.dist(ap)<9)floatText(`자동 진열 +${30*effMult()}개/초`,s.x,s.y,"#8fd3ff",18);flyItem(ap,V3((Math.random()-.5)*8,1.1,-4+Math.random()*3))}
    if(!keys.length){state.boxes=state.boxes.filter(x=>x!==b);syncBoxes();save();updateHud();MISSION.add("boxes")}}
}
function flyItem(from,to){const it=makeProduct(pick(["kimbap","cola","chips","ramen"]));it.position.copy(from);it.scale.setScalar(.8);scene.add(it);tween(it,to.clone(),500,{lift:.6}).then(()=>scene.remove(it))}

/* ---------- 로봇 (세 번째 리모델링부터): 서비스 코너·전자레인지를 로봇이 다 해 준다 ---------- */
const ROBO={svc:null,mw:null,trash:null};
const ROBOT_MS=2100;   // 사람이 미니게임 하는 것보다 1.5배 빠르게
function stepRobots(dt,now){
  const B=MK.bots;
  if(B&&MK.g.visible){[["svc",B.svc],["mw",B.mw]].forEach(([k,b],i)=>{const busy=!!ROBO[k],t=now/1000+i;
    b.userData.head.rotation.y=busy?Math.sin(t*6)*.25:Math.sin(t*.8)*.35;b.userData.head.position.y=.92+Math.sin(t*2)*.012;
    b.userData.arms.forEach((a,j)=>{a.rotation.x=busy?-1.1+Math.sin(t*9+j*Math.PI)*.5:Math.sin(t*1.5+j)*.12})})}
  if(!GAME.running||!robotAge())return;
  // 서비스 코너: 줄 선 손님 주문을 하나씩 만들어 건넨다 (사람이 하던 중인 주문은 건드리지 않는다)
  if(ROBO.svc){const R=ROBO.svc,C=R.C;R.t+=dt;
    if(C.state!=="svc"||!CUST.includes(C))ROBO.svc=null;
    else if(R.t>=ROBOT_MS){ROBO.svc=null;const o=C.orders.find(o=>!o.done);
      if(o){o.done=true;const mp=machinePos(o.machine),it=makeProduct(o.key);it.position.copy(mp);scene.add(it);C.items.push(o.key);
        if(o.machine==="freezer")MISSION.add("icecream");Snd.tone(1320,.06,"square",.035);Snd.tone(1760,.06,"square",.035,.08);
        const s=toScreen(mp);if(!s.behind&&PLAYER.dist(mp)<11)floatText(`🤖 ${nameOf(o.key)} 완성!`,s.x,s.y-40,"#8fd3ff",20);
        handToSvc(C,it)}}}
  else{const C=SVCQ.find(c=>c.state==="svc"&&c.orders.some(o=>!o.done));if(C)ROBO.svc={C,t:0}}
  // 전자레인지: 데워 달라는 손님 음식을 가져가서 데워 갖다 준다 (쓰레기 치우는 중이 아니면)
  if(!ROBO.mw&&!ROBO.trash){const C=CUST.find(c=>c.heatReq&&!c.heatTaken&&c.food&&c.seat&&c.state==="eating");if(C)robotHeat(C)}
  stepBotTrash(dt);
}
// 전자레인지 로봇은 한가하면 테이블 쓰레기도 치운다: 테이블 끝으로 굴러가서 → 쓰레기를 쏙 → 제자리로
const MW_HOME=V3(-3.06,0,1.05),MW_WAY=V3(-2.55,0,.85),MW_TABLE=V3(-2.45,0,-.3);
function stepBotTrash(dt){
  const b=MK.bots&&MK.bots.mw;if(!b)return;
  let R=ROBO.trash;
  if(!R){if(ROBO.mw)return;
    const s=SEATS.find(s=>s.trash&&!s.trash.userData.bot&&performance.now()-(s.trash.userData.t0||0)>1500);if(!s)return;
    s.trash.userData.bot=1;R=ROBO.trash={s,path:[MW_WAY.clone(),MW_TABLE.clone()],ph:"go",t:0}}
  const p=b.position,step=1.1*effMult()*dt/1000;
  if(R.path.length){const tg=R.path[0],dx=tg.x-p.x,dz=tg.z-p.z,d=Math.hypot(dx,dz);
    if(d<.03){p.x=tg.x;p.z=tg.z;R.path.shift()}else{const k=Math.min(1,step/d);p.x+=dx*k;p.z+=dz*k;b.rotation.y=angLerp(b.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*.01))}
    return}
  if(R.ph==="go"){R.ph="clean";R.t=0}
  if(R.ph==="clean"){R.t+=dt;b.rotation.y=angLerp(b.rotation.y,Math.PI,Math.min(1,dt*.01));
    if(R.t<350||R.flying)return;R.flying=true;const s=R.s,tr=s.trash;
    const back=()=>{R.ph="back";R.path=[MW_WAY.clone(),MW_HOME.clone()]};
    if(!tr){back();return}
    tween(tr,p.clone().setY(.8),480/effMult(),{lift:.2,scale:.3}).then(()=>{
      if(s.trash===tr){removeTrash(s);state.rating=clamp(state.rating+.02*satMult(),1,5);GAME.night.trash=(GAME.night.trash||0)+1;MISSION.add("trash");
        const at=seatFood(s),q=toScreen(at);if(!q.behind&&PLAYER.dist(at)<11){floatText("🤖 깨끗!",q.x,q.y-30,"#8ff7b5",22);Snd.happy()}
        if(!state.talked.robotTrash)Talk.say("전자레인지 로봇이 테이블 쓰레기도 치워 준다! 똑똑하다","happy","robotTrash")}
      back()});
    return}
  if(R.ph==="back"){b.rotation.y=Math.PI;ROBO.trash=null}
}
async function robotHeat(C){
  ROBO.mw=C;const f=C.food,eff=effMult();C.heatTaken=true;C.food=null;
  if(C.heatHit){f.remove(C.heatHit);C.heatHit=null}
  sayC(C,"오, 로봇이 가져가네?");
  await sleep(500/eff);
  const mp=machinePos("micro");await tween(f,mp,480,{lift:.12});f.visible=false;
  const lit=MW.state==="idle";if(lit&&W3.microLight)W3.microLight.emissiveIntensity=1.3;
  await sleep(3200/eff);
  if(lit&&MW.state==="idle"&&W3.microLight)W3.microLight.emissiveIntensity=0;
  const s=toScreen(mp);if(!s.behind&&PLAYER.dist(mp)<11){Snd.ding();floatText("🤖 띵!",s.x,s.y-40,"#ffcc2e",24)}
  f.visible=true;
  if(!C.seat||C.state!=="eating"||!GAME.running){scene.remove(f);ROBO.mw=null;return}
  await tween(f,seatFood(C.seat),480,{lift:.12});f.rotation.y=C.seat.ry+Math.PI;
  ROBO.mw=null;
  if(!C.seat||C.state!=="eating"){scene.remove(f);return}
  C.food=f;C.hot=true;C.heatReq=false;C.heatTaken=false;C.heatPat=0;
  sayC(C,pick(["로봇님 감사해요! 따끈따끈~","와 로봇이 데워 줬어! 최고","역시 J-마트... 아니 여기 로봇 최고"].slice(0,isJMart()?3:2)),"love");
  let tip=earnUp(randInt(3,8)*100*moneyScale());GAME.night.tips+=tip;GAME.night.heat=(GAME.night.heat||0)+1;MISSION.add("heat");state.rating=clamp(state.rating+.05*satMult(),1,5);
  const p=toScreen(f.position);if(!p.behind&&PLAYER.dist(f.position)<11)floatText(`팁 +${won(tip)}`,p.x,p.y-50,"#ffcc2e",22);
  C.eatT=Math.max(C.eatT,9000);
}


/* ================= 노숙자 아저씨 (사장님 메뉴 0원) =================
   고용하면 가게 밖으로 나갈 수 있다. 아저씨는 가게 앞에 앉아 있고, 지나가는 사람들이 바구니에 돈을 넣는다.
   바구니에는 그날 사장님이 번 돈의 70%만큼 모인다. 밤 중간에 나가서 받을 수 있고, 남은 건 영수증에 들어온다.
   (아저씨는 월급 대신 삼각김밥 무제한) */
const HM={g:null,man:null,basket:null,coins:null,peds:[],spawnT:0,val:0,target:0,taken:0,said:0};
const HM_SPOT=()=>W3.street&&W3.street.visible?{x:-1.9,z:-8.45,bx:-1.4,bz:-8.7,out:true}:{x:1.35,z:-6.75,bx:1.35,bz:-6.35,out:false};
const pedEnd=()=>isMarket()?Math.min(19,HALL.x+2.5):13;   // 행인이 나타나고 사라지는 곳 (가게가 넓어지면 더 멀리)
function buildHomeless(){
  const g=new T.Group();scene.add(g);HM.g=g;
  HM.man=makeDoodlePerson({shirt:"#7a6a58",hat:"beret",hatColor:"#5a4a3a"});scene.add(HM.man);HM.man.visible=false;
  // 박스 깔개 + 빨간 바구니 (동전이 쌓인다)
  mesh(box(.7,.02,.5),mStd(0xb8864f,.9),{y:.01,parent:g,name:"mat"});
  const bk=new T.Group();g.add(bk);HM.basket=bk;

  mesh(new T.CircleGeometry(.12,16),mStd(0x8a2a22,.6),{y:.005,rx:-Math.PI/2,parent:bk});
  HM.coins=mesh(new T.CylinderGeometry(.13,.13,.02,16),mStd(0xd9b44a,.3,.8),{y:.02,parent:bk});
  const hit=new T.Mesh(box(.5,.5,.5),HIT_MAT);hit.position.y=.2;hit.userData.act="hmBasket";bk.add(hit);HM.hit=hit;
  const sign=tex("hmsign",256,96,(x,w,h)=>{x.fillStyle="#f6f1e6";x.fillRect(0,0,w,h);x.strokeStyle="#16141d";x.lineWidth=5;x.strokeRect(4,4,w-8,h-8);
    tx(x,"졸라 슈퍼 홍보 중",128,34,24,"#16141d",{font:FJ});tx(x,"감사합니다 ^^",128,70,22,"#e2483d",{font:FJ})});
  HM.sign=mesh(new T.PlaneGeometry(.5,.19),new T.MeshStandardMaterial({map:sign,roughness:.7,side:T.DoubleSide}),{y:.35,z:.2,rx:-.4,parent:g});

function refreshHomeless(){
  if(!HM.g)return;const on=hasUp("homeless")&&state.role==="owner",S=HM_SPOT();
  HM.g.visible=on;HM.man.visible=on;HM.g.position.set(S.x,0,S.z);HM.basket.position.set(S.bx-S.x,0,S.bz-S.z);
  HM.man.position.set(S.x,0,S.z);HM.man.rotation.y=S.out?Math.PI:Math.PI;
  HM.coins.scale.y=1;HM.coins.visible=HM.val>0;
  if(!on)HM.peds.forEach(p=>scene.remove(p.obj)),HM.peds.length=0;
}
function resetHomelessNight(){HM.val=0;HM.target=0;HM.taken=0;HM.spawnT=3000;refreshHomeless()}
// 오늘 밤 지금까지 번 돈의 70% (바구니가 여기까지 찬다)
function hmTarget(){const N=GAME.night;if(!N)return 0;return Math.max(0,.7*(N.sales*EARN*(hasUp("parttimer")?1.1:1)+(N.tips||0)+(N.mini||0)))}
function stepHomeless(dt,now){
  if(!HM.g||!HM.g.visible||!GAME.running)return;
  const S=HM_SPOT();HM.target=hmTarget();
  setPose(HM.man,"sit",now/1000,HM.val>0?"happy":"sad",{sitY:-.15*DP_PX},"hm");
  HM.coins.visible=HM.val>0;
  // 행인: 도시는 가게 앞 인도를 지나가다 들르고, 밖이 없는 단계는 들어오는 손님이 넣고 간다
  if(S.out){
    HM.spawnT-=dt;
    if(HM.spawnT<=0&&HM.peds.length<2){HM.spawnT=5000+Math.random()*5000;
      const dir=Math.random()<.5?1:-1,o=makeDoodlePerson(lookFor(pick(["normal","office","student","grandma","tourist"])));
      o.position.set(-pedEnd()*dir,0,-9.9+Math.random()*.3);scene.add(o);HM.peds.push({obj:o,dir,stop:Math.random()<.7?0:-1,t:0,ph:Math.random()*6})}
    HM.peds.slice().forEach(p=>{const o=p.obj;p.ph+=dt*.01;
      if(p.stop>0){p.stop-=dt;setPose(o,"give",p.ph,"happy");if(p.stop<=0){p.stop=-1;donate(o.position)}return}
      o.position.x+=p.dir*1.1*dt/1000;o.rotation.y=p.dir>0?Math.PI/2:-Math.PI/2;setPose(o,"walk",p.ph,"happy");
      if(p.stop===0&&Math.abs(o.position.x-S.bx)<.35){p.stop=1300;o.rotation.y=Math.PI}
      if(Math.abs(o.position.x)>pedEnd()+1){scene.remove(o);HM.peds.splice(HM.peds.indexOf(p),1)}});
  }
}
// 동전이 바구니로 쏙 (남은 몫의 절반쯤씩)
function donate(from){
  const gap=HM.target-HM.val-HM.taken;if(gap<=0)return;
  const add=Math.max(10*moneyScale(),Math.round(gap*.55/(10*moneyScale()))*10*moneyScale());HM.val+=Math.min(add,gap);
  const c=mesh(new T.CylinderGeometry(.03,.03,.008,12),mStd(0xd9b44a,.3,.8),{parent:scene});c.userData.tmp=true;c.position.set(from.x,1.0,from.z+.2);
  const bp=HM.basket.getWorldPosition(V3(0,0,0)).setY(.12);tween(c,bp,420,{lift:.25}).then(()=>scene.remove(c));
  setTimeout(()=>{Snd.coin();const s=toScreen(bp);if(!s.behind&&PLAYER.dist(bp)<9)floatText("짤랑!",s.x,s.y-30,"#ffcc2e",20)},420);
}
// 밖이 없는 단계: 손님이 문으로 들어올 때 넣고 간다
function hmCustomerDonate(C){if(HM.g&&HM.g.visible&&!HM_SPOT().out&&Math.random()<.6)donate(C.obj.position)}
async function takeBasket(){
  if(HM.val<=0){toast("아직 바구니가 비었어요. 손님이 많이 오면 금방 차요!");return}
  const v=HM.val;HM.val=0;HM.taken+=v;state.money+=v;updateHud();save();
  const s=toScreen(HM.basket.getWorldPosition(V3(0,0,0)).setY(.4));floatText(`바구니 +${won(v)}`,s.x,s.y,"#8ff7b5",26);Snd.coin();Snd.happy();
  sayHM(pick(["사장님 여기요! 오늘 장사 잘 되네요~","헤헤, 사람들이 인심이 좋아요","삼각김밥 값은 빼고 드렸어요~ 농담!"]));
  MISSION.add("hm");
}
function sayHM(t){const s=toScreen(HM.man.position.clone().setY(1.4));if(!s.behind)floatText(t,s.x,s.y,"#fff",18)}
function hmHits(c){if(HM.g&&HM.g.visible)c.push(HM.hit)}
function hmLabel(H){if(H.act!=="hmBasket")return false;H.label=`바구니 받기 (${won(HM.val)})`;
  const bp=HM.basket.getWorldPosition(V3(0,0,0));if(PLAYER.dist(bp)>1.9){H.ok=false;H.why=HM_SPOT().out?"너무 멀어요! 가게 밖으로 나가서 바구니 가까이 가요":"너무 멀어요! 입구 쪽 바구니 가까이 가요";H.short="더 가까이"}return true}
function hmAct(H){if(H.act!=="hmBasket")return false;queueAct(takeBasket);return true}
// 밤이 끝나면: 오늘 번 돈의 70% 중 아직 안 받은 몫
function hmSettle(income){
  if(!hasUp("homeless")||state.role!=="owner")return {total:0,rest:0};
  const total=Math.max(0,Math.round(.7*income/(10*moneyScale()))*10*moneyScale()),rest=Math.max(0,total-HM.taken);
  HM.val=0;return {total:Math.max(total,HM.taken),rest};
}


/* ================= 카트 손님 (슈퍼마켓부터) =================
   어른 손님 일부는 장바구니 대신 카트를 끈다. 가게가 넓을수록 카트 손님이 많아진다.
   카트 손님은 물건을 더 많이 사고, 열에 넷은 아기를 카트 앞자리에 태우고 온다 (아기는 까까를 꼭 산다) */
const cartChance=()=>isMarket()?Math.min(.6,.2+.08*hallLevel()):0;
let CART_KIT=null;
function cartKit(){
  if(CART_KIT)return CART_KIT;
  const W=.46,L=.66,H=.4;
  CART_KIT={W,L,H,y0:.42,
    wire:mStd(0xc8ccd4,.3,.85),red:mStd(0xe2483d,.5,.1),dark:mStd(0x222428,.6),
    net:new T.MeshStandardMaterial({color:0xc8ccd4,roughness:.4,metalness:.6,transparent:true,opacity:.26,depthWrite:false,side:T.DoubleSide}),
    goods:[0xffcc2e,0x2f9d4a,0x2c6fd6,0xe2483d,0xff8a3d,0xffffff].map(c=>mStd(c,.6)),
    sideW:new T.PlaneGeometry(W,H),sideL:new T.PlaneGeometry(L,H),floor:box(W,.012,L),
    rimW:box(W+.02,.02,.02),rimL:box(.02,.02,L),leg:box(.02,.4,.02),wheel:new T.CylinderGeometry(.045,.045,.03,12),
    handle:new T.CylinderGeometry(.018,.018,W+.06,10),seat:box(W-.06,.02,.16),gbox:box(.13,.12,.1),gcan:new T.CylinderGeometry(.04,.04,.13,10)};
  return CART_KIT;
}
function makeCart(){
  const K=cartKit(),g=new T.Group(),{W,L,H,y0}=K,top=y0+H;
  // 철망 바구니 (반투명) + 테두리
  mesh(K.sideW,K.net,{y:y0+H/2,z:L/2,parent:g});mesh(K.sideW,K.net,{y:y0+H/2,z:-L/2,parent:g});
  mesh(K.sideL,K.net,{x:W/2,y:y0+H/2,ry:Math.PI/2,parent:g});mesh(K.sideL,K.net,{x:-W/2,y:y0+H/2,ry:Math.PI/2,parent:g});
  mesh(K.floor,K.wire,{y:y0,parent:g});
  [top,y0].forEach(y=>{mesh(K.rimW,K.wire,{y,z:L/2,parent:g});mesh(K.rimW,K.wire,{y,z:-L/2,parent:g});mesh(K.rimL,K.wire,{x:W/2,y,parent:g});mesh(K.rimL,K.wire,{x:-W/2,y,parent:g})});
  // 다리 + 바퀴 + 아래 선반
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{mesh(K.leg,K.wire,{x:sx*(W/2-.03),y:.25,z:sz*(L/2-.05),parent:g});
    mesh(K.wheel,K.dark,{x:sx*(W/2-.03),y:.045,z:sz*(L/2-.05),rz:Math.PI/2,parent:g})});
  mesh(K.floor,K.wire,{y:.12,parent:g});
  // 빨간 손잡이 (손님 쪽)
  mesh(K.handle,K.red,{y:top+.1,z:-L/2-.07,rz:Math.PI/2,parent:g});
  [-1,1].forEach(s=>mesh(box(.02,.12,.09),K.wire,{x:s*W/2,y:top+.05,z:-L/2-.035,parent:g}));
  // 산 물건 몇 개
  for(let i=0;i<5;i++){const can=i%3===2;mesh(can?K.gcan:K.gbox,K.goods[randInt(0,K.goods.length-1)],{x:(Math.random()-.5)*(W-.16),y:y0+.07+(i>2?.1:0),z:.02+(Math.random()-.3)*(L-.24),ry:Math.random()*3,parent:g})}
  return g;
}
function addCart(C,baby){
  const c=makeCart();c.position.set(0,0,.6);C.obj.add(c);C.cart=c;
  if(baby){   // 아기는 손잡이 앞 아기 자리에 앉는다 (낙서 아기, 늘 나를 본다)
    const K=cartKit();mesh(K.seat,K.red,{y:K.y0+K.H-.06,z:-K.L/2+.1,parent:c});
    const b=makeDoodlePerson(lookFor("baby"));b.scale.setScalar(.42);b.position.set(0,K.y0+K.H-.25,-K.L/2+.12);c.add(b);C.baby=b;C.babyT=3000+Math.random()*5000;
  }
}
// 걸을 때는 카트를 앞에서 밀고, 서 있을 때는 옆에 세워 둔다
function stepCart(C,dt,now,walking){
  const c=C.cart,k=Math.min(1,dt*.005),tx=walking?0:.62,tz=walking?.6:.08;
  c.position.x+=(tx-c.position.x)*k;c.position.z+=(tz-c.position.z)*k;
  c.rotation.z=walking?Math.sin(now*.03+C.id)*.012:0;
  if(!C.baby)return;
  const t=now/1000;setPose(C.baby,Math.sin(t*1.3+C.id)>.75?"wave":"sit",t,Math.sin(t*.7+C.id)>.9?"shock":"happy",{sitY:-.46*DP_PX},"cb");
  C.babyT-=dt;
  if(C.babyT<=0){C.babyT=7000+Math.random()*7000;const p=C.baby.getWorldPosition(V3(0,0,0)).setY(1.35);
    if(PLAYER.dist(p)<7){const s=toScreen(p);if(!s.behind)floatText(pick(["까까!","빠빠~","부릉부릉!","헤헤","저거! 저거!"]),s.x,s.y,"#ffd1e3",18)}}
}

/* ================= 청소 로봇 5대 (로봇 시대부터) =================
   평소엔 통로를 돌아다니다가, 바닥에 음료가 쏟아지면 제일 가까운 로봇이 달려가서 빙글빙글 닦는다 */
const CLEAN={bots:[]};
function buildCleaners(g,t){
  CLEAN.bots=[];CHORES.spills.forEach(s=>s.bot=null);
  if(t<3)return;
  const docks=[0,BACK_COLS[0],BACK_COLS[1],BACK_COLS[2],BACK_COLS[3]];
  docks.forEach((x,i)=>{const o=makeCleaner();o.position.set(x,0,2.75);o.rotation.y=Math.PI;g.add(o);
    CLEAN.bots.push({o,home:V3(x,0,2.75),path:[],job:null,t:0,idleT:1500+i*1300})});
}
function makeCleaner(){
  const g=new T.Group();
  mesh(new T.CylinderGeometry(.19,.2,.08,24),mStd(0xf2f4f7,.35,.2),{y:.065,cast:true,parent:g});
  mesh(new T.CylinderGeometry(.205,.205,.03,24),mStd(0x2c6fd6,.4,.3),{y:.03,parent:g});
  mesh(new T.CylinderGeometry(.08,.08,.03,16),mStd(0x303238,.4,.3),{y:.115,parent:g});
  const led=new T.MeshStandardMaterial({color:0x113311,emissive:0x2fff7a,emissiveIntensity:.8});mesh(new T.SphereGeometry(.022,8,6),led,{y:.12,z:.13,parent:g});
  const br=new T.Group();br.position.set(.13,.012,.12);g.add(br);[0,1,2].forEach(k=>mesh(box(.13,.006,.016),mStd(0x303238,.6),{ry:k*Math.PI/3,parent:br}));
  const lt=tex("cleanbot",256,64,(x,w,h)=>{x.fillStyle="#2c6fd6";x.fillRect(0,0,w,h);tx(x,"🧹 청소 로봇",w/2,34,30,"#fff",{font:FJ})});
  const sp=new T.Sprite(new T.SpriteMaterial({map:lt,depthWrite:false}));sp.scale.set(.5,.125,1);sp.position.y=.42;g.add(sp);
  g.userData.led=led;g.userData.brush=br;
  return g;
}
function stepCleaners(dt,now){
  if(!CLEAN.bots.length||!MK.g||!MK.g.visible)return;
  const run=GAME.running&&robotAge(),step=1.3*effMult()*dt/1000,cleanMs=1600/effMult();
  for(const b of CLEAN.bots){
    const o=b.o;o.userData.brush.rotation.y+=dt*.025;o.userData.led.emissiveIntensity=b.job?.8+Math.sin(now*.025)*.7:.8;
    if(!run)continue;
    // 사장님이 먼저 닦았으면 그만
    if(b.job&&!CHORES.spills.includes(b.job)){b.job=null;b.path=[];b.t=0;b.idleT=600}
    if(!b.job){const s=CHORES.spills.find(s=>!CLEAN.bots.some(x=>x.job===s)&&!(CHORES.mop&&CHORES.mop.sp===s));
      if(s){const at=V3(s.x,0,s.z),free=CLEAN.bots.filter(x=>!x.job).sort((a,c)=>a.o.position.distanceTo(at)-c.o.position.distanceTo(at));
        if(free[0]===b){b.job=s;b.t=0;b.path=hallRoute(o.position,at);
          if(!state.talked.cleanbot1)Talk.say("청소 로봇이 쏟은 데로 달려간다! 바닥은 이제 로봇들이 알아서 닦아 줘","happy","cleanbot1")}}}
    if(b.path.length){const tg=b.path[0],dx=tg.x-o.position.x,dz=tg.z-o.position.z,d=Math.hypot(dx,dz);
      if(d<.04){o.position.x=tg.x;o.position.z=tg.z;b.path.shift()}
      else{const k=Math.min(1,step/d);o.position.x+=dx*k;o.position.z+=dz*k;o.rotation.y=angLerp(o.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*.012))}
      continue}
    if(b.job){   // 빙글빙글 닦기
      b.t+=dt;o.rotation.y+=dt*.008;b.job.mat.opacity=Math.max(0,.82*(1-b.t/cleanMs));
      if(b.t>=cleanMs)cleanerDone(b);
      continue}
    // 할 일이 없으면 순찰 (가끔 제자리로 돌아가 쉰다)
    b.idleT-=dt;if(b.idleT<=0){b.idleT=5000+Math.random()*7000;b.path=hallRoute(o.position,Math.random()<.3?b.home.clone():hallBrowse())}
  }
}
function cleanerDone(b){
  const s=b.job;b.job=null;b.t=0;b.idleT=900;if(!CHORES.spills.includes(s))return;
  scene.remove(s.mesh);scene.remove(s.hit);if(s.can)scene.remove(s.can);CHORES.spills.splice(CHORES.spills.indexOf(s),1);
  const at=V3(s.x,.3,s.z),p=toScreen(at);if(!p.behind&&PLAYER.dist(at)<12){floatText("🧹 반짝반짝!",p.x,p.y-30,"#8ff7b5",22);Snd.happy()}
  state.rating=clamp(state.rating+.02*satMult(),1,5);GAME.night.clean=(GAME.night.clean||0)+1;GAME.night.botClean=(GAME.night.botClean||0)+1;MISSION.add("clean");
}


/* ================= 2층 (여섯 번째 리모델링부터) =================
   오른쪽 뒤 계단, 왼쪽 뒤(창고 끝) 유리 엘리베이터로 오르내린다. 2층 매장은 리모델링마다 넓어지고,
   아직 안 연 곳은 '공사 중' 펜스. 손님도 계단·엘리베이터로 2층에 올라가 둘러보고 내려와서 계산한다 */
let OBST2=null;
// 바닥판 (구멍: 계단, 엘리베이터). 위는 2층 바닥, 아래는 1층 천장. 무늬가 이어지게 칸마다 UV 를 옮긴다
function slabCells(){
  const hx=HALL.x,S=STAIR,E=ELEV;
  const xs=[-hx,E.x0,E.x1,S.x0,S.x1,hx],zs=[...new Set([HALL.zf,S.z0,S.z1,E.z0,E.z1,HALL.zb])].sort((a,b)=>a-b),out=[];
  for(let i=0;i<xs.length-1;i++)for(let j=0;j<zs.length-1;j++){const x0=xs[i],x1=xs[i+1],z0=zs[j],z1=zs[j+1];
    if(x1-x0<.01||z1-z0<.01||inHole((x0+x1)/2,(z0+z1)/2))continue;out.push([x0,z0,x1,z1])}
  return out;
}
function slabBox(x0,z0,x1,z1,th){
  const w=x1-x0,d=z1-z0,geo=box(w,th,d),uv=geo.attributes.uv,ou=(x0+HALL.x)/6.8,ov=(z0-HALL.zf)/9.8;
  for(let v=8;v<16;v++)uv.setXY(v,ou+uv.getX(v)*w/6.8,ov+uv.getY(v)*d/9.8);   // 위(2층 바닥)·아래(1층 천장) 면
  return geo;
}
function build2F(g,t,lv2){

  MK.floor2=mStd(0xffffff,.32,0,{map:tile(floorTex())});const ceil=mStd(0xffffff,.9,0,{map:tile(ceilTex())}),edge=mStd(0xd8dce3,.6);

  const lampGeo=box(1.2,.03,.28),lx=Math.floor((hx-1.5)/2)*2;for(let z=-6.6;z<=3.6;z+=1.7)for(let x=-lx;x<=lx;x+=2)if(!inHole(x,z,.8))mesh(lampGeo,W3.mat.lamp,{x,y:2.785,z,parent:g2});
  [-1,1].forEach(s=>{const l=new T.PointLight(0xf2f6ff,.7,16+hx*.6,1.4);l.position.set(s*hx*.45,2.6,-2.2);g2.add(l)});

  ["kimbap","cola","chips","ramen","choco","cider","milk","gum"].forEach((k,i)=>{const it=makeProduct(k);const a=i/8*TAU;it.position.set(Math.cos(a)*.62,.84,Math.sin(a)*.62);it.rotation.y=-a;g2.add(it)});

  mesh(new T.PlaneGeometry(1.2,.45),new T.MeshStandardMaterial({map:isg,side:T.DoubleSide}),{y:1.55,parent:g2});

  if(LAY2.W<hx-.2)buildBarriers(g2,hx);
  // 계단 + 엘리베이터
  buildStairs(g);buildElevator(g);
  MK.obs.push([ELEV.x0,ELEV.z0-.08,ELEV.x1,ELEV.z0+.08],[ELEV.x0,ELEV.z1-.08,ELEV.x1,ELEV.z1+.08]);   // 1층 엘리베이터 벽
  OBST2=null;
}
function buildBarriers(g2,hx){

const onStair=(x,z)=>LAY2.on&&x>STAIR.x0&&x<STAIR.x1&&z>STAIR.z0&&z<STAIR.z1;
const inCab=p=>LAY2.on&&p.x>ELEV.x0&&p.x<ELEV.x1&&p.z>ELEV.z0&&p.z<ELEV.z1;
// 계단: 아래 끝(1층)이나 위 끝(2층)으로만 들어가고, 오르는 만큼 높이가 바뀐다. null = 못 간다
function stairY(p,nx,nz){
  if(!LAY2.on)return 0;
  const S=STAIR,f=z=>FLOOR_H*clamp((z-S.z0)/(S.z1-S.z0),0,1),inX=nx>S.x0&&nx<S.x1;
  if(onStair(p.x,p.z)){
    if(nz<=S.z0)return inX?0:null;
    if(nz>=S.z1)return inX?FLOOR_H:null;
    return inX?f(nz):null;   // 옆은 난간
  }
  if(onStair(nx,nz)){const up=p.y>1.5;if(!up&&p.z<=S.z0)return f(nz);if(up&&p.z>=S.z1)return f(nz);return null}
  return p.y>1.5?FLOOR_H:0;
}
function obstacles2(){
  const O=[[ELEV.x0,ELEV.z0-.08,ELEV.x1,ELEV.z0+.08],[ELEV.x0,ELEV.z1-.08,ELEV.x1,ELEV.z1+.08],[-1.2,-1.2,1.2,1.2]];
  LAY2.gond.forEach(([x,z0,L])=>O.push([x-.43,z0-L,x+.43,z0+.25]));
  return O;
}
function blocked2(x,z){
  const hx=HALL.x-.1;if(x<-hx+RADIUS||x>hx-RADIUS||z<HALL.zf+.12+RADIUS||z>HALL.zb-.1-RADIUS)return true;
  const landing=x>STAIR.x0&&x<STAIR.x1&&z>=STAIR.z1-.01;
  if(LAY2.W<HALL.x-.2&&Math.abs(x)>LAY2.W-RADIUS&&z<2.3+RADIUS&&!landing)return true;   // 공사 중 펜스
  if(x>STAIR.x0-RADIUS&&x<STAIR.x1+RADIUS&&z>STAIR.z0-RADIUS&&z<STAIR.z1)return true;    // 계단 구멍 (위에서 들어가는 건 stairY 가 먼저 받는다)
  return (OBST2||(OBST2=obstacles2())).some(([a,b,c,d])=>x>a-RADIUS&&x<c+RADIUS&&z>b-RADIUS&&z<d+RADIUS);
}
// 엘리베이터 타기 (안에서 버튼을 누르면 1.8초 동안 위아래로)

const nearCol2=(x,lim=16)=>LAY2.cols.filter(c=>Math.abs(c)<=lim).reduce((a,c)=>Math.abs(c-x)<Math.abs(a-x)?c:a,0);
function route2(from,to){
  const Y=FLOOR_H,CZ=3.1,RB=-2.1,out=[];
  // 지금 자리에서 뒤쪽 복도(창고 위)로: 앞 통로면 뒤 가로 통로를 거쳐 계단 구멍·엘리베이터를 피하는 세로 통로로
  if(from.z<-2.3){const a=nearCol2(from.x,99),t=nearCol2(from.x);out.push(V3(a,Y,from.z),V3(a,Y,RB),V3(t,Y,RB),V3(t,Y,CZ))}
  else out.push(V3(from.x,Y,CZ));
  if(to.z>-2.3){out.push(V3(to.x,Y,CZ),to.clone());return out}
  const t=nearCol2(to.x),b=nearCol2(to.x,99);out.push(V3(t,Y,CZ),V3(t,Y,RB),V3(b,Y,RB),V3(b,Y,to.z),to.clone());return out;
}

function pathUp(from,b2,lift){

function pathDown(pos,lift){
  if(!lift&&Math.random()<.55)return route2(pos,V3(STAIR.xc,FLOOR_H,3.1)).concat([V3(STAIR.xc,FLOOR_H,STAIR.z1+.05),V3(STAIR.xc,0,STAIR.z0-.05),V3(STAIR.xc,0,-2.1)]);

}

  const d=loadSave();if(!d)return newGame();
  // 리모델링 단계가 2개 늘었다: 예전 저장의 단계 번호를 새 번호로
  if(!d.state.tierV){const t=d.state.tier||0;d.state.tier=t+(t>=5?1:0)+(t>=7?1:0);d.state.tierV=2}
  if(d.state.crowdK==null)d.state.crowdK=Math.pow(1.75,d.state.tier||0);   // 리모델링마다 손님 1.5~2배 (예전 저장은 평균 1.75배로)

/* ================= 누르기 (3D 물건 고르기) ================= */
const ray=new T.Raycaster(),ndc=new T.Vector2();
function hitBox(parent,size,pos,act){const m=new T.Mesh(box(...size),HIT_MAT);m.position.set(...pos);m.userData.act=act;parent.add(m);return m}
function buildHits(){
  W3.hits={
    bag:hitBox(W3.counter,[.3,.12,.34],[-.72,COUNTER_Y+.04,-.2],"bag"),
    scanner:hitBox(W3.counter,[.26,.1,.2],[SPOT.scan.x,COUNTER_Y+.03,SPOT.scan.z],"scanner")
  };
  ["micro","coffee","steamer","grill"].forEach(k=>hitBox(W3.mk[k],[.5,.55,.55],[0,.2,0],"m:"+k));
  hitBox(W3.mk.freezer,[1.14,.92,.66],[0,.46,0],"m:freezer");
  W3.hits.phone=W3.phoneHit;
}
// 화면의 (px,py)에 있는 누를 거리. center=true 면 E 키 (가운데 점)
// 돌려주는 것: {target, act, owner, label(손 옆 안내), ok(지금 할 수 있나), why(안 될 때 알림), short(안 될 때 짧은 이유)}
const MACHINE_REACH=3.7;
function pickAt(px,py,center){
  const r=$("gl").getBoundingClientRect();
  ndc.set(px/r.width*2-1,-(py/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const C=GAME.cur,cands=[];
  if(C){C.itemObjs.forEach(o=>{if(o.userData.state==="counter")cands.push(o.userData.hit)});if(C.payObj&&C.payObj.userData.hit)cands.push(C.payObj.userData.hit)}
  if(GAME.expired)cands.push(GAME.expired.userData.hit);
  if(!isMarket())cands.push(W3.hits.bag,W3.hits.scanner);
  ["micro","coffee","steamer","grill"].forEach(k=>{if(k==="micro"||hasUp(k))W3.mk[k].children.forEach(ch=>{if(ch.userData.act)cands.push(ch)})});
  CHORES.gaps.forEach(s=>s.hit&&cands.push(s.hit));CHORES.spills.forEach(sp=>cands.push(sp.hit));
  SEATS.forEach(s=>{if(s.trash)cands.push(s.trash.userData.hit)});
  if(W3.hits.phone)cands.push(W3.hits.phone);
  extraHits(cands);
  const hit=ray.intersectObjects(cands,false)[0];
  let target=hit&&hit.object;
  // 손가락이 살짝 빗나가도 가까운 물건을 잡는다 (계산대 안에서만)
  if(!target&&C&&PLAYER.inRegister()){let best=null,bd=center?40:56;C.itemObjs.forEach(o=>{if(o.userData.state!=="counter")return;const s=toScreen(o.position);const d=Math.hypot(s.x-px,s.y-py);if(d<bd){bd=d;best=o.userData.hit}});
    if(C.payObj){const s=toScreen(C.payObj.position),d=Math.hypot(s.x-px,s.y-py);if(d<bd)best=C.payObj.userData.hit}target=best}
  if(!target)return null;
  const act=target.userData.act,owner=target.userData.owner;
  const H={target,act,owner,label:"",ok:true,why:"",short:""};
  const far=(d,max,msg)=>{if(d>max){H.ok=false;H.why=msg;H.short="더 가까이"}};
  if(extraLabel(H)){}                  // 테이블 전자레인지, 졸팡 박스
  else if(act==="restock"){H.label="진열하기";far(PLAYER.dist(target.userData.sec.c),REACH,"너무 멀어요! 진열대 가까이 가서 눌러요")}
  else if(act==="spill"){H.label="닦기";far(PLAYER.dist(target.userData.spill),REACH,"너무 멀어요! 쏟은 곳 가까이 가서 눌러요")}
  else if(act==="trash"){const s=target.userData.seat;if(!s.trash)return null;H.label="치우기";far(PLAYER.dist(s.trash.position),REACH,"너무 멀어요! 테이블 가까이 가서 눌러요")}
  else if(act==="phone"){H.label=PHONE.ringing?"전화 받기":"전화기";
    if(isMarket())far(PLAYER.dist(phonePos()),REACH+.4,"너무 멀어요! 사장님 전화 책상 가까이 가서 눌러요");
    else if(!PLAYER.inRegister()){H.ok=false;H.why="전화기는 계산대 안쪽에 있어요!";H.short="계산대 안에서"}}
  else if(act&&act.startsWith("m:")){const m=act.slice(2);H.label=H.label||MACHINES[m].name;far(PLAYER.dist(machinePos(m)),MACHINE_REACH,`너무 멀어요! ${MACHINES[m].name} 가까이 가요`)}
  else{
    if(act==="bag")H.label="봉투";
    else if(act==="scanner")H.label=C&&nextTask(C)?.k==="scan"?"":"스캐너";
    else if(owner)H.label=owner===GAME.expired?"폐기 김밥":C&&owner===C.payObj?(C.pay==="card"?"카드 받기":"돈 받기"):"스캔하기";
    if(!PLAYER.inRegister()){H.ok=false;H.why="계산은 계산대 안에서 해요!";H.short="계산대 안에서"}
  }
  return H;
}
function interactAt(px,py,center){
  if(Scr.name!=="game"||!$("modal").hidden||!$("drawer").hidden||PHONE.building)return;
  Snd.wake();PLAYER.apply();scene.updateMatrixWorld();
  const H=pickAt(px,py,center);if(!H)return;
  if(!H.ok){toast(H.why);Snd.errBeep();return}
  const {act,owner,target}=H,C=GAME.cur;
  if(act==="restock"){const s=target.userData.sec;queueAct(()=>restock(s));return}
  if(act==="spill"){const sp=target.userData.spill;queueAct(()=>mopSpill(sp));return}
  if(act==="trash"){const s=target.userData.seat;queueAct(()=>cleanTrash(s));return}
  if(act==="phone"){answerPhone();return}
  if(extraAct(H))return;
  if(act&&act.startsWith("m:")){const m=act.slice(2);queueAct(()=>useMachine(m));return}
  if(act==="bag")queueAct(giveBag);
  else if(act==="scanner"){if(!C||nextTask(C)?.k!=="scan")queueAct(scanOwnHand)}
  else if(owner){
    if(owner===GAME.expired)queueAct(()=>eatExpired(owner));
    else if(C&&owner===C.payObj)queueAct(C.pay==="card"?takeCard:takeCash);
    else tapItem(owner);
  }
}
// 뒤에 붙는 기능(테이블 전자레인지, 졸팡 박스)이 누를 거리를 더한다
function extraHits(cands){microHits(cands);boxHits(cands);marketHits(cands);hmHits(cands);liftHits(cands)}
function extraLabel(H){return microLabel(H)||boxLabel(H)||marketLabel(H)||hmLabel(H)||liftLabel(H)}
function extraAct(H){return microAct(H)||boxAct(H)||marketAct(H)||hmAct(H)||liftAct(H)}

/* ================= 자동 화질: 느린 기기면 해상도·그림자를 낮춘다 ================= */
const Q={s:[],step:0};
function adaptQuality(dt){
  if(Q.step>=2||Scr.name!=="game")return;
  Q.s.push(dt);if(Q.s.length<75)return;
  const avg=Q.s.reduce((a,b)=>a+b,0)/Q.s.length;Q.s=[];
  if(avg>30&&Q.step===0){Q.step=1;renderer.setPixelRatio(1);resize3D()}
  else if(avg>36&&Q.step===1){Q.step=2;renderer.shadowMap.enabled=false;scene.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>m.needsUpdate=true)})}
  else Q.step=2;
}
/* ================= 메인 루프 ================= */
let lastT=performance.now(),hintT=0;
function frame(now){
  try{frameBody(now)}catch(e){if(!frame.err){frame.err=1;console.error(e)}}   // 한 번 에러가 나도 다음 프레임은 계속
  requestAnimationFrame(frame);
}
function frameBody(now){
  const raw=now-lastT,dt=Math.min(window.__DTCAP||60,raw);lastT=now;adaptQuality(raw);
  OV.boilT+=dt;if(OV.boilT>120){OV.boilT=0;OV.boil=(OV.boil+1)%3}
  if(CAM.shakeT>0)CAM.shakeT-=dt;
  const ctx=OV.ctx;ctx.clearRect(0,0,OV.W,OV.H);
  const paused=!$("modal").hidden||PHONE.building;
  CAM.outdoor(Scr.name!=="game"||PLAYER.pos.z<-7.4);   // 가게 밖에 나가면 거리 불도 켠다
  if(Scr.name==="title"){
    const k=(Math.sin(now*.00012)+1)/2;CAM.lerpTo("outside","street",k*.25);
    renderer.render(scene,camera);
    const r=drawDoodleAt(ctx,V3(-1.75,0,-8.3),"plain",{pose:"wave",face:"happy",t:now/1000,dir:1});
  }else if(Scr.name==="opening"){
    const s=Op.step(dt);
    const is3D=drawOpening(ctx,dt,now);
    if(is3D){stepOpening3D(s,Op.t,dt);stepTweens(dt);HANDS.step(dt);drawPeople(now);renderer.render(scene,camera);drawOpening3DOverlay(ctx,s,Op.t);HANDS.draw(ctx)}
  }else if(Scr.name==="game"){
    if(!paused){stepTweens(dt);stepWaits(dt);stepNight(dt);stepChores();stepMiniEvents(dt);stepAuto(dt,now);stepRobots(dt,now);stepCleaners(dt,now);stepFloor2(dt);stepHomeless(dt,now);CUST.slice().forEach(c=>stepCustomer(c,dt,now));stepCouriers(dt);stepDoors(dt)}
    stepPhone(dt,now);
    if(canMove())PLAYER.step(dt);else PLAYER.apply();
    stepGate(dt);
    HANDS.step(dt);
    W3.laserMat.emissiveIntensity=Math.max(.35,W3.laserMat.emissiveIntensity-dt*.004);
    drawPeople(now);
    renderer.render(scene,camera);
    // 감정 낙서
    CUST.forEach(C=>{if(C.state!=="counter"&&C.state!=="queue")return;const hp=C.obj.position.clone();hp.y+=1.72*(C.def.scale||1);const s=toScreen(hp);
      const m=C.pat<C.patMax*.3?"angry":C.pat<C.patMax*.55?"sweat":C.def.name==="새벽 좀비 직장인"?"zzz":null;if(m)doodleMood(ctx,s.x+30,s.y-10,m,now)});
    drawSteam(ctx,now);drawChoreMarks(ctx,now);drawHeatMarks(ctx,now);drawBoxMarks(ctx,now);drawPhoneMark(ctx,now);drawMop(ctx,now);drawJolArrow(ctx,now);
    // 손님이 계산대에서 기다리는데 내가 딴 데 있으면 계산대를 가리킨다
    if(GAME.cur&&GAME.cur.state==="counter"&&!PLAYER.inRegister())edgeArrow(ctx,V3(0,1.1,.75),"계산대로!",now);
    else{const tt=tutTarget();if(tt){if(tt.p){const s=toScreen(tt.p);if(!s.behind)doodleArrow(ctx,s.x,s.y-10,now,tt.label)}else if(tt.el&&tt.el.offsetParent){const b=tt.el.getBoundingClientRect(),r=$("gl").getBoundingClientRect();doodleArrow(ctx,b.left-r.left+b.width/2,b.top-r.top-6,now,tt.label)}}}
    crosshair(ctx);
    HANDS.draw(ctx);
    stepHover(now);drawHoverLabel(ctx);
    drawFloats(ctx,dt);
    renderBubbles();
    hintT+=dt;if(hintT>150){hintT=0;updateHintUI();updateHud();const ck=GAME.clockText();if(GAME.cur||ck!==frame.ck){frame.ck=ck;drawPos()}}
    Talk.frame(dt,now);
  }
}

/* ================= 부팅 ================= */
async function boot(){
  try{
    initOverlay();
    if(document.fonts&&document.fonts.load)await Promise.race([Promise.all([document.fonts.load(`40px "Black Han Sans"`),document.fonts.load(`20px "Jua"`),document.fonts.load(`16px "Nanum Gothic Coding"`)]),new Promise(r=>setTimeout(r,1800))]).catch(()=>{});
    initThree();buildHits();buildCashGrid();resizeAll();
  }catch(e){$("loading").textContent="이 기기에서는 3D 화면을 켤 수 없어요. 다른 브라우저로 열어 주세요.";console.error(e);return}
  $("tCont").hidden=!loadSave();
  Scr.show("title");CAM.set("outside");
  $("loading").remove();
  requestAnimationFrame(frame);
  // 1편 엔딩을 깨고 넘어왔다: 저장이 없으면 바로 2편 오프닝, 있으면 타이틀에서 골라요
  if(/[?&]from=s1\b/.test(location.search)){
    if(!loadSave())newGame();
    else toast("1편 엔딩 축하해요! '새 게임'을 누르면 거지 졸라맨의 편의점 이야기가 처음부터 시작돼요");
  }
}
addEventListener("resize",resizeAll);
$("tNew").onclick=()=>{Snd.wake();Snd.click();if(Snd.music)Snd.startMusic();newGame()};
$("tCont").onclick=()=>{Snd.wake();Snd.click();if(Snd.music)Snd.startMusic();continueGame()};
$("tSet").onclick=()=>{Snd.wake();Snd.click();showSettings()};
$("hSet").onclick=()=>{Snd.click();showSettings()};
$("tRep").onclick=()=>{Snd.wake();Snd.click();showReplays()};
$("hRep").onclick=()=>{if(Scr.name!=="game"||!$("modal").hidden||PHONE.building)return;Snd.click();showReplays()};
$("hQuit").onclick=()=>{Snd.click();askQuit()};
/* ---------- 게임 끄기: 저장하고 타이틀로 ---------- */
function askQuit(){
  if(Scr.name!=="game")return;
  openModal(`<div class="panel"><h2>게임을 끌까요?</h2>
    <p>통장 돈, 가게, 리모델링, 미션은 저장돼 있어요. 타이틀에서 <b>이어하기</b>를 누르면 다시 할 수 있어요.</p>
    <p class="note" style="color:#7a5a10">${GAME.running?"지금 하던 밤은 이어하기 때 처음부터 다시 해요.":""}</p>
    <div class="acts"><button id="qNo" class="btn alt" type="button">계속할래</button><button id="qYes" class="btn red" type="button">⏻ 게임 끄기</button></div></div>`);
  $("qNo").onclick=()=>{Snd.click();closeModal()};
  $("qYes").onclick=()=>{Snd.click();quitGame()};
}
/* ---------- 애니메이션 다시 보기 (타이틀 · 게임 안) ----------
   오프닝·엔딩 애니메이션을 처음 장면부터 그대로 다시 틀어 준다. 게임 중이면 밤은 멈춰 두고, 다 보면 하던 그대로 이어서.
   오프닝 속 3D 장면은 원래 '첫날 작은 편의점'이라, 보는 동안만 첫날 가게 모습으로 바꾸고 손님·물건은 잠깐 숨긴다 */
function showReplays(){
  const inGame=Scr.name==="game";
  if(inGame&&!$("drawer").hidden){toast("거스름돈부터 건네요!");Snd.errBeep();return}
  const d=inGame?null:loadSave(),endOK=(inGame?state.rescue:d&&d.state&&d.state.rescue)===2;
  openModal(`<div class="panel"><h2>🎬 애니메이션 다시 보기</h2>
    <div class="replays">
      <button id="rpOp" class="btn" type="button">🌧 오프닝<small>거지 졸라맨, 천만 원 들고 진짜 세상으로 · 13장면</small></button>
      <button id="rpEnd" class="btn alt" type="button" ${endOK?"":"disabled"}>🏝 엔딩<small>${endOK?"₩10자 배 타고 전 점장님 구하기 · 6장면":"🔒 메인 미션 (전 점장님 구출)을 깨면 열려요"}</small></button>
    </div>
    ${inGame?`<p class="note" style="color:#555">보는 동안 게임은 멈춰 있고, 다 보면 하던 그대로 이어서 해요. (장면은 '다음 장면 ▶'이나 화면 클릭으로 넘길 수 있어요)</p>`:""}
    <div class="acts"><button id="rpClose" class="btn sm alt" type="button">닫기</button></div></div>`);
  $("rpOp").onclick=()=>{Snd.click();closeModal();startReplay("op")};
  if(endOK)$("rpEnd").onclick=()=>{Snd.click();closeModal();startReplay("end")};
  $("rpClose").onclick=()=>{Snd.click();closeModal()};
}
function startReplay(kind){
  if(Op.replay)return;
  const from=Scr.name==="game"?"game":"title";
  if(from==="game"&&(GAME.busy||GAME.ending||Talk.story||ELEV.ride)){toast("하던 일을 끝내고 다시 눌러 주세요!");Snd.errBeep();return}
  if(document.pointerLockElement)document.exitPointerLock();
  Talk.close();
  const R={from,kind,keep:state,hid:[],run:GAME.running};
  Op.replay=R;replaying=true;
  if(kind==="end"){
    // 엔딩은 공책 낙서라 가게는 그대로. 타이틀에서 보면 마지막 장면 기록(밤·손님 수)은 저장된 게임 것으로
    if(from==="title"){const d=loadSave();if(d)state=Object.assign(freshState(),d.state)}
    Scr.show("opening");Op.startList(ENDING);Snd.fanfare();return;
  }
  Scr.show("opening");
  if(from==="game"){
    const hide=o=>{if(o&&o.visible){o.visible=false;R.hid.push(o)}};
    CUST.forEach(C=>hide(C.obj));HM.peds.forEach(p=>hide(p.obj));JP.couriers.forEach(c=>hide(c.obj));
    scene.children.forEach(o=>{if(o.userData.tmp)hide(o)});camera.children.forEach(o=>{if(o.userData.tmp)hide(o)});
    CHORES.spills.forEach(sp=>hide(sp.mesh));SEATS.forEach(s=>hide(s.trash));MK.flyers.forEach(f=>hide(f.m));
    $("bubbles").hidden=true;GAME.running=false;   // 밤 멈춤 (손님·시계·타이머 모두)
    state=freshState();applyTheme();refreshUpgrades();
  }else{state=freshState();resetWorld()}
  Op.start();
}
function endReplay(){
  const R=Op.replay;if(!R)return;
  Op.replay=null;Op.leaving=true;replaying=false;
  if(Op.boss)Op.boss.visible=false;W3.car.visible=false;
  state=R.keep;
  if(R.from==="title"){if(R.kind==="op")resetWorld();Scr.show("title");CAM.set("outside");$("tCont").hidden=!loadSave();return}
  if(R.kind==="op"){applyTheme();refreshUpgrades();refreshObstacles();R.hid.forEach(o=>o.visible=true);$("bubbles").hidden=false;GAME.running=R.run}
  Scr.show("game");resizeAll();HANDS.reset();HANDS.hidden=false;PLAYER.apply();updateHud();drawPos();
  toast("애니메이션 끝! 하던 그대로 이어서 해요");
}
function quitGame(){
  if(document.pointerLockElement)document.exitPointerLock();
  closeModal();Talk.story=null;Talk.close();resetMicro();
  if(state.night)save();
  resetWorld();Snd.stopMusic();
  Scr.show("title");CAM.set("outside");$("tCont").hidden=!loadSave();
  toast("게임을 껐어요. 이제 창을 닫아도 돼요 (이어하기로 다시 할 수 있어요)");
}
$("opNext").onclick=()=>{Snd.click();Op.go(Math.min(Op.list.length,Op.i+1))};
$("opSkip").onclick=()=>{Snd.click();Op.go(Op.list.length);Op.t=1400};
$("opStart").onclick=()=>{Snd.click();leaveOpening()};
$("ov").addEventListener("click",()=>{});
document.addEventListener("pointerdown",()=>Snd.wake(),{once:true});
document.addEventListener("visibilitychange",()=>{if(!Snd.ctx)return;document.hidden?Snd.ctx.suspend().catch(()=>{}):Snd.ctx.resume().catch(()=>{})});
boot();

})();

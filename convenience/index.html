/* ================= 손님 =================
   들어옴(문) → 매장 둘러보기 → 계산대(또는 줄) → 계산 → 나감 */
const CUST=[];          // 가게 안 손님 (계산대 앞이 [0])
let custSeq=0;
function makeCustomer(type,opt={}){
  const def=CUSTOMERS[type];
  const doodle=!!def.doodle;             // 1편에서 온 VIP (부자 형님, 뚱라맨)
  const obj=makeDoodlePerson(lookFor(type));if(def.scale)obj.scale.setScalar(def.scale);   // 꼬마·아기는 작다
  obj.position.set((Math.random()-.5)*1.2,0,SPOT.outside.z-Math.random()*1.5);scene.add(obj);
  // 슈퍼마켓: 어른 손님 일부는 카트를 끈다 (물건을 더 많이 사고, 가끔 아기를 태우고 온다)
  const cart=isMarket()&&!def.vip&&!def.minor&&type!=="grandma"&&!opt.items&&Math.random()<cartChance(),baby=cart&&Math.random()<.4;
  // 살 물건 고르기
  let items=opt.items;const missed=[];
  if(!items){
    // 기본 상품 + (산 설비로 팔리는 상품). 리모델링으로 들어온 비싼 메뉴는 하나까지.
    // 재고가 없으면 못 산다 (반쯤은 다른 걸로 바꿔 산다). 1편 VIP 는 재고와 상관없이
    const base=SHELF_ITEMS.filter(k=>k!=="icecream"&&(!PRODUCTS[k].unlock||hasUp(PRODUCTS[k].unlock)));
    const pool=def.only||(def.minor?base.filter(k=>!PRODUCTS[k].adult):base);   // 술은 어른만
    const snacks=SNACKS.filter(k=>pool.includes(k));
    const pickWant=()=>def.snack&&snacks.length&&Math.random()<def.snack?pick(snacks):pick(pool);
    let n=randInt(def.n[0],def.n[1])+(cart?randInt(2,4):0);items=[];
    if(!def.only&&!def.snack&&Math.random()<(type==="tourist"?.6:.35)){const pk=pickPremium();if(pk){if(takeStock(pk)){items.push(pk);n--}else missed.push(pk)}}
    for(let i=0;i<n;i++){const want=pickWant();
      if(def.vip&&type!=="rival"){takeStock(want);items.push(want);continue}
      if(takeStock(want)){items.push(want);continue}
      missed.push(want);const alt=pool.filter(k=>stockOf(k)>0);if(alt.length&&Math.random()<.5){const a=pick(alt);takeStock(a);items.push(a)}}
    if(baby){const k=pick(SNACKS);if(takeStock(k))items.push(k)}   // 아기 까까
  }else items.forEach(k=>takeStock(k));
  // 기계 주문 (사장님이 산 기계만)
  const orders=[];
  if(!def.vip&&!opt.items)["coffee","grill","steamer"].forEach(m=>{if(hasUp(m)&&!(m==="coffee"&&def.minor)&&Math.random()<(m==="coffee"?.3:.2))orders.push({machine:m,key:MACHINES[m].item,done:false})});
  // 아이스크림: 냉동고에서 꺼내 달라고 한다 (재고가 없으면 실망)
  if(!def.vip&&!opt.items&&hasUp("freezer")&&Math.random()<.3){if(takeStock("icecream"))orders.push({machine:"freezer",key:"icecream",done:false});else missed.push("icecream")}
  const heatKey=items.find(k=>PRODUCTS[k].heat);
  const C={id:++custSeq,type,def,doodle,obj,items,orders,missed,
    wantBag:opt.bag!=null?opt.bag:(!def.vip&&(items.length+orders.length>=3?Math.random()<.75:Math.random()<.3)),
    heat:null,heated:false,   // 데우기는 이제 테이블 옆 전자레인지에서 (먹고 가는 손님이 부탁한다)
    pay:opt.pay||(def.pays?"cash":Math.random()<def.card?"card":"cash"),
    state:"enter",path:[],speed:(1.1+Math.random()*.25)*(def.slow||1),phase:Math.random()*6,
    patMax:def.pat*(hasUp("interior")?1.3:1)*(1+upEff("speed")),pat:0,line:"",lineT:0,mood:null,
    itemObjs:[],scanned:[],bagOn:false,paid:0,payObj:null,paidDone:false,reach:0,wave:0,walkK:0,
    prices:[],total(){return this.prices.reduce((s,p)=>s+p,0)}
  };
  C.pat=C.patMax;
  if(cart)addCart(C,baby);   // 카트 (아기 태우기도)
  else if(isMarket()&&!def.vip){C.basket=true;obj.userData.dp.look={...obj.userData.dp.look,item:"basket"}}   // 슈퍼마켓: 장바구니
  const browse=new T.Vector3((Math.random()-.5)*.7,0,-3-Math.random()*3);
  C.path=[SPOT.door.clone().setX((Math.random()-.5)*.4),browse];
  if(isMarket()){const b=hallBrowse();C.path=[SPOT.door.clone()].concat(hallRoute(V3(0,0,ROW_F),b))}   // 넓은 슈퍼마켓 통로로
  if(isMarket()&&LAY2.on&&!def.vip&&!def.slow&&Math.random()<.4){C.up=true;C.path=[SPOT.door.clone()].concat(pathUp(V3(0,0,ROW_F),hallBrowse2(),!!C.cart))}   // 2층 구경 (카트는 엘리베이터)
  C.browseT=(GAME.tut?500:1200+Math.random()*1800)+(C.up?2500:0);
  CUST.push(C);hmCustomerDonate(C);
  return C;
}
function sayC(C,text,mood){C.line=text;C.lineT=performance.now();if(mood!==undefined)C.mood=mood}

// 손님 한 명 움직이기 (dt: ms)
function stepCustomer(C,dt,now){
  const o=C.obj,sp=C.speed*dt/1000;
  if(C.state==="eating"){stepEating(C,dt,now);return}
  let walking=false;
  if(C.path.length){   // 계단·엘리베이터는 위아래로도 (길 점의 y)
    const tgt=C.path[0],dx=tgt.x-o.position.x,dz=tgt.z-o.position.z,dy=(tgt.y||0)-o.position.y,d=Math.hypot(dx,dz,dy);
    if(d<.03){o.position.set(tgt.x,tgt.y||0,tgt.z);C.path.shift();if(!C.path.length)arrived(C)}
    else{const k=Math.min(1,sp/d);o.position.x+=dx*k;o.position.z+=dz*k;o.position.y+=dy*k;walking=Math.hypot(dx,dz)>.02;
      if(walking){const want=Math.atan2(dx,dz);o.rotation.y=angLerp(o.rotation.y,want,Math.min(1,dt*.012))}}
  }else if(C.state==="browse"){C.browseT-=dt;o.rotation.y=angLerp(o.rotation.y,C.browseFace||0,dt*.004);if(C.browseT<=0)goCounter(C)}
  else if(C.state==="counter"||C.state==="queue"){o.rotation.y=angLerp(o.rotation.y,0,dt*.008)}
  else if(C.state==="self"){stepSelf(C,dt,now)}
  else if(C.state==="svc"){stepSvc(C,dt)}
  C.walkK=lerp(C.walkK,walking?1:0,Math.min(1,dt*.01));
  if(C.cart)stepCart(C,dt,now,walking);C.phase+=dt*.009*C.speed;
  if(walking&&CHORES.spills.length)checkSlip(C);
  // 계산대에 왔는데 내가 없으면 부르기만 한다 (막대는 안 줄어든다)
  if(C.state==="counter"&&!C.paidDone&&!PLAYER.inRegister()){C.callT=(C.callT||0)-dt;if(C.callT<=0){C.callT=7000;sayC(C,pick(["계산이요~!","저기요~ 계산해 주세요!","아무도 안 계세요?!"]));Snd.chime()}}
  // 줄 선 손님도 가끔 부르기만 한다
  if(C.state==="queue"&&!C.paidDone&&GAME.running){C.qCallT=(C.qCallT==null?9000+Math.random()*6000:C.qCallT)-dt;if(C.qCallT<=0){C.qCallT=14000+Math.random()*6000;sayC(C,pick(["저도 기다리고 있어요~","줄 서 있어요!","다음은 저예요~"]))}}
  C.reach=lerp(C.reach,C.reachT||0,Math.min(1,dt*.008));
  poseCustomer(C,now);
  // 인내심: 계산대 앞에 왔고 내가 계산대 안에 있을 때만 줄어든다 (줄 서 있거나 내가 자리를 비우면 부르기만)
  if(C.state==="counter"&&!C.paidDone&&!C.paying&&GAME.running&&PLAYER.inRegister()){
    C.pat-=dt/1000*1.5*(GAME.tut?.35:1);   // 인내심 막대: 원래의 1.5배 속도 (2배에서 0.5배 완화)
    if(C.pat<=0)angryLeave(C);
    else if(C.pat<C.patMax*.3&&!C.warned){C.warned=1;sayC(C,pick(C.def.angry),"angry");Snd.angry()}
  }
}
// 낙서 손님 자세: 걷기, 물건 내밀기, 인사, 서 있기 + 표정
function poseCustomer(C,now){
  const waiting=(C.state==="counter"||C.state==="queue")&&!C.paidDone,r=C.pat/C.patMax,t=now/1000;
  if(C.slipUntil&&now<C.slipUntil){setPose(C.obj,"kneel",t,"dizzy",null,"slip");return}
  const face=C.mood==="angry"||(waiting&&r<.3)?"angry":waiting&&r<.55?"sad":C.type==="zombie"?"sleep":"happy";
  const sweat=waiting&&r<.55;
  if(C.walkK>.35)setPose(C.obj,C.type==="office"?"run":"walk",C.phase,face,sweat?{sweat:true}:null,sweat?"sw":"");
  else if(C.reach>.5&&!C.paidDone)setPose(C.obj,"give",t,face,sweat?{sweat:true}:null,sweat?"sw":"");
  else if(C.paidDone&&now-C.lineT<1600)setPose(C.obj,"wave",t,face);
  else setPose(C.obj,C.type==="tourist"&&C.state==="browse"?"photo":"stand",t,face,sweat?{sweat:true}:null,sweat?"sw":"");
}
const angLerp=(a,b,k)=>{let d=((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return a+d*k};

function arrived(C){
  if(C.state==="enter"){C.state="browse";C.browseFace=Math.random()<.5?Math.PI/2:-Math.PI/2}
  else if(C.state==="toCounter"){atCounter(C)}
  else if(C.state==="toQueue"){C.state="queue"}
  else if(C.state==="toSeat"){sitDown(C)}
  else if(C.state==="toSelf"){C.state="self"}
  else if(C.state==="toSvc"){C.state="svc"}
  else if(C.state==="down"){goCounter(C)}   // 2층에서 내려왔다
  else if(C.state==="leave"){C.state="gone";scene.remove(C.obj);CUST.splice(CUST.indexOf(C),1);updateQueue()}
}
function goCounter(C){
  if(isMarket()&&C.obj.position.y>1.5){C.state="down";C.path=pathDown(C.obj.position,!!C.cart);return}   // 2층이면 먼저 내려온다
  // 살 게 하나도 없으면 (다 품절) 실망해서 그냥 나간다
  if(!C.items.length&&!C.orders.length){
    sayC(C,C.type==="rival"?"삼각김밥이 하나도 없잖아! 망해라~ 메롱":pick(["...먹을 게 하나도 없네? 다 품절이야","에이, 사려던 게 다 떨어졌네..."]),"angry");Snd.angry();
    state.rating=clamp(state.rating-.06,1,5);GAME.night.soldout=(GAME.night.soldout||0)+Math.max(1,C.missed.length);
    const s=toScreen(C.obj.position.clone().setY(1.9));if(!s.behind)floatText("품절...",s.x,s.y,"#ff8a7a",22);
    if(!state.talked.jp_tut)jolpangTutorial();
    leave(C);return;
  }
  if(isMarket()){if(C.orders.length)goSvc(C);else goSelf(C);return}   // 계산대가 없다: 주문은 서비스 코너, 나머지는 셀프 계산대
  const first=CUST.find(c=>c.state==="counter"||c.state==="toCounter");
  if(!first){C.state="toCounter";C.path=[new T.Vector3(0,0,-2.2),SPOT.customer.clone()]}
  else{C.state="toQueue";C.path=[SPOT.queue.clone()]}
}
// 앞 손님이 나가면 줄 선 손님이 앞으로
function updateQueue(){
  const hasFront=CUST.some(c=>c.state==="counter"||c.state==="toCounter");
  if(hasFront)return;
  const q=CUST.find(c=>c.state==="queue"||c.state==="toQueue");
  if(q){q.state="toCounter";q.path=[SPOT.customer.clone()]}
}
function atCounter(C){
  C.state="counter";GAME.cur=C;C.reachT=1;
  if(C.missed.length){sayC(C,`${nameOf(C.missed[0])} 품절이에요? 아쉽다... 이것만 주세요`,"angry");state.rating=clamp(state.rating-.02*C.missed.length,1,5);GAME.night.soldout=(GAME.night.soldout||0)+C.missed.length}
  else sayC(C,pick(C.def.hi),null);
  if(C.doodle&&!state.vipMet[C.type]){state.vipMet[C.type]=1;
    Talk.say(C.type==="rich"?"부자 형님?!?! 1편 형님한테 천만 원 준 그 전설의 부자 형님?! 형님도 현실 세계로 온 거예요?!":"뚱라맨?! 1편에서 옆집 반값 세일 하던 그 뚱라맨?! 너도 떨어졌냐!","shock")}
  placeItems(C);
  drawPos();
}
function angryLeave(C){
  if(C.state==="leave"||C.state==="gone")return;
  sayC(C,pick(C.def.angry),"angry");Snd.angry();
  GAME.night.angry++;state.rating=clamp(state.rating-.15,1,5);
  floatText("손님이 화나서 갔다...",OV.W/2,OV.H*.35,"#ff8a7a",22);
  if(GAME.cur===C){clearCounter(C,true);GAME.cur=null}
  leave(C);
  if(!state.talked.angry1)Talk.say("아... 너무 오래 기다리게 했나 봐. 머리 위 막대가 빨개지기 전에 계산하자!","sweat","angry1");
}
function leave(C){
  C.state="leave";C.reachT=0;C.warned=1;
  C.path=isMarket()?hallLeavePath(C):[new T.Vector3(C.obj.position.x<.2?-.2:.3,0,-2.4),SPOT.door.clone(),SPOT.outside.clone().setX((Math.random()-.5)*4)];
  setTimeout(()=>{if(GAME.cur===C)GAME.cur=null;updateQueue()},300);
}
// 문: 손님이 가까우면 열린다
function stepDoors(dt){
  const P=PLAYER.pos,near=CUST.concat(JP.couriers).some(c=>Math.abs(c.obj.position.z-(-7.6))<1.5&&Math.abs(c.obj.position.x)<1.2)||(Scr.name==="game"&&Math.abs(P.z+7.6)<1.4&&Math.abs(P.x)<1.2);
  W3.doors.forEach(d=>{const s=Math.sign(d.userData.base),tgt=d.userData.base+(near?s*.66:0);d.position.x+=(tgt-d.position.x)*Math.min(1,dt*.008)});
  if(near&&!stepDoors.was){Snd.chime()}stepDoors.was=near;
}

/* ---------- 말풍선 (HTML) ---------- */
const BUB={};
function renderBubbles(){
  const root=$("bubbles"),seen={};
  CUST.forEach(C=>{
    if(C.state==="gone"||C.state==="enter"||C.state==="browse")return;
    const heatWait=C.state==="eating"&&C.heatReq;
    const show=C.state==="counter"||C.state==="queue"||C.state==="toQueue"||heatWait||((C.state==="leave"||C.state==="eating")&&performance.now()-C.lineT<2400);
    if(!show)return;
    seen[C.id]=1;
    let el=BUB[C.id];if(!el){el=document.createElement("div");el.className="cb";root.appendChild(el);BUB[C.id]=el;el._h=""}
    const head=C.obj.position.clone();head.y+=(C.state==="eating"?1.35:1.8)*(C.def.scale||1);
    const s=toScreen(head),side=C.state==="counter"&&OV.W>=700;el.classList.toggle("side",side);
    el.style.display=s.behind||s.x<-200||s.x>OV.W+200?"none":"";
    if(side){el.style.left=Math.max((el.offsetWidth||200)+12,s.x-60)+"px";el.style.top=clamp(s.y+OV.H*.2,170,OV.H-190)+"px"}
    else{el.style.left=clamp(s.x,90,OV.W-90)+"px";el.style.top=Math.max((el.offsetHeight||60)+(OV.W<700?96:100),s.y)+"px"}
    const pr=clamp(heatWait?C.heatPat/C.heatPatMax:C.pat/C.patMax,0,1),cls=pr<.3?"low":pr<.6?"mid":"";
    const talkNow=C.state==="counter"||C.state==="leave"||C.state==="eating";
    const req=C.state==="counter"?reqChips(C):"";
    const html=(talkNow&&C.line?`<div class="say"><span class="who">${esc(C.def.name)}</span>${esc(C.line)}${req}</div>`:"")+
      (C.state!=="leave"&&(C.state!=="eating"||heatWait)?`<div class="pat"><i class="${cls}" style="width:${Math.round(pr*100)}%"></i></div>`:"");
    if(html!==el._h){el.innerHTML=html;el._h=html}
  });
  Object.keys(BUB).forEach(id=>{if(!seen[id]){BUB[id].remove();delete BUB[id]}});
}
function reqChips(C){
  const r=[];
  if(C.wantBag)r.push(`<i class="${C.bagOn?"done":""}">봉투 주세요</i>`);
  if(C.heat)r.push(`<i class="${C.heated?"done":""}">데워 주세요</i>`);
  C.orders.forEach(o=>r.push(`<i class="${o.done?"done":""}">${esc(nameOf(o.key))}</i>`));
  return r.length?`<span class="req">${r.join("")}</span>`:"";
}

/* ---------- 먹고 가는 손님 ----------
   계산이 끝나면 먹을 것을 산 손님 일부가 왼쪽 테이블에 앉아 먹는다. 다 먹으면 쓰레기를 두고 간다 */
const EAT_KINDS={cup:1,dosirak:1,kimbap:1,hotbar:1,hoppang:1,coffee:1,icecream:1};
const HOT_KINDS={cup:1,dosirak:1,coffee:1,hoppang:1,hotbar:1};
function tryEat(C){
  if(GAME.tut||C.doodle||C.cart||C.type==="office"||C.type==="police"||GAME.t>SHIFT_SEC*.9)return false;   // 카트 손님은 먹고 가지 않는다
  const eats=C.scanned.filter(k=>k!=="bag"&&EAT_KINDS[PRODUCTS[k].kind]),key=eats.find(HEATABLE)||eats[0];if(!key)return false;
  const seat=SEATS.find(s=>!s.by);if(!seat||Math.random()>(HEATABLE(key)?.8:.6))return false;
  seat.by=C;C.seat=seat;C.eatKey=key;C.state="toSeat";C.reachT=0;
  C.path=seat.go.map(([x,z])=>V3(x,0,z)).concat([V3(seat.x,0,seat.z)]);
  setTimeout(updateQueue,300);
  if(!state.talked.eat1)setTimeout(()=>Talk.say("오, 손님이 먹고 간대! 왼쪽 테이블에 앉았다. 다 먹으면 쓰레기 치우는 것도 내 일이야","happy","eat1"),900);
  return true;
}
function sitDown(C){
  const s=C.seat;C.state="eating";C.obj.position.set(s.x,0,s.z);C.obj.rotation.y=s.ry;
  C.eatT=11000+Math.random()*9000;C.eatPh=Math.random()*2000;
  if(s.trash){removeTrash(s);state.rating=clamp(state.rating-.05,1,5);const p=toScreen(V3(s.x,1.4,s.z));floatText("테이블이 더러워요...",p.x,p.y,"#ff8a7a",20);Snd.angry();
    GAME.night.dirty=(GAME.night.dirty||0)+1}
  const food=makeProduct(C.eatKey);food.position.copy(seatFood(s));food.rotation.y=s.ry+Math.PI;scene.add(food);C.food=food;
  maybeAskHeat(C);
}
function stepEating(C,dt,now){
  if(stepHeatWait(C,dt,now))return;
  C.eatT-=dt;C.eatPh+=dt;
  const lift=Math.max(0,Math.sin(C.eatPh*.0024));
  setPose(C.obj,lift>.3?"eat":"sit",now/1000,"happy",{sitY:-.46*DP_PX},"sit");
  if(lift>.96&&!C.bite){C.bite=1;const p=toScreen(C.obj.position.clone().setY(1.55));
    if(!p.behind&&PLAYER.dist(C.obj.position)<7)floatText(pick(HOT_KINDS[PRODUCTS[C.eatKey].kind]?["후루룩!","호로록~","아 뜨거!"]:["냠냠","쩝쩝","맛있다~"]),p.x+30,p.y,"#fff",18)}
  if(lift<.5)C.bite=0;
  if(C.eatT<=0)finishEating(C);
}
function finishEating(C){

/* ================= 계산대 일 =================
   물건 누르기 → 낙서 손이 집어 스캐너로 → 삐빅 → 봉투(또는 옆)로.
   봉투·데우기·기계 주문을 다 하면 손님이 카드나 현금을 낸다 */
const V3=(x,y,z)=>new T.Vector3(x,y,z);
// 손은 하나씩 일한다: 빨리 여러 번 눌러도 차례대로 처리
const ACTQ=[];let actRunning=false;
function queueAct(fn){if(ACTQ.length>8)return;ACTQ.push(fn);runActs()}
async function runActs(){if(actRunning)return;actRunning=true;
  while(ACTQ.length){const f=ACTQ.shift();try{await f()}catch(e){console.error(e);GAME.busy=false}}
  actRunning=false}
function tapItem(it){if(it.userData.state!=="counter")return;it.userData.state="queued";queueAct(()=>scanItem(it))}
function spotFor(i,n){const cols=Math.min(n,4),r=Math.floor(i/4),c=i%4;return V3(SPOT.drop.x-(cols-1)*.075+c*.15+(r%2)*.04,COUNTER_Y,SPOT.drop.z+r*.1)}

// 손님이 물건을 계산대에 올려놓는다
async function placeItems(C){
  const n=C.items.length;
  for(let i=0;i<n;i++){
    const it=makeProduct(C.items[i]);it.position.set(C.obj.position.x+(i%2?.12:-.12),1.08,C.obj.position.z+.3);it.rotation.y=(Math.random()-.5)*.5;scene.add(it);
    it.userData.state="moving";C.itemObjs.push(it);
    tween(it,spotFor(i,n),420+i*60,{lift:.08}).then(()=>{it.userData.state="counter"});
    await sleep(140);
  }
  if(C.heat)setTimeout(()=>sayC(C,"이 도시락 데워 주세요~"),600);
  else if(C.orders.length)setTimeout(()=>sayC(C,C.orders.map(o=>nameOf(o.key)).join(", ")+" 하나 주세요!"),600);
  else if(C.wantBag)setTimeout(()=>sayC(C,"봉투도 하나 주세요"),600);
  if(GAME.tut)tutEvent("placed");
}
// 할 일 목록 (위에서부터 먼저)
function nextTask(C){
  if(!C||C.state!=="counter")return null;
  if(C.itemObjs.some(o=>o.userData.state==="moving"))return {k:"wait"};
  const left=C.itemObjs.filter(o=>o.userData.state==="counter"||o.userData.state==="queued");
  if(C.orders.some(o=>!o.done))return {k:"machine",m:C.orders.find(o=>!o.done).machine};
  if(left.length)return {k:"scan",n:left.length,obj:left[0]};
  if(C.heat&&!C.heated)return {k:C.heating?"heating":"heat"};
  if(C.wantBag&&!C.bagOn&&!hasUp("parttimer"))return {k:"bag"};
  if(!C.paidDone)return {k:"pay"};
  return {k:"done"};
}

/* ---------- 스캔 ---------- */
async function scanItem(it){
  const C=GAME.cur;if(!C||!it.parent||(it.userData.state!=="queued"&&it.userData.state!=="counter"))return;
  GAME.busy=true;it.userData.state="scanning";
  HANDS.hold("R",it,[18,8],"grab");
  await sleep(140);
  await tween(it,V3(SPOT.scan.x,COUNTER_Y+.045,SPOT.scan.z),260,{lift:.1});
  W3.laserMat.emissiveIntensity=1.6;Snd.beep();
  C.scanned.push(it.userData.key);C.prices.push(priceOf(it.userData.key));C.posMsg=null;drawPos();
  const s=toScreen(it.position);floatText("삐빅!",s.x,s.y-30,"#ff6b5b",24);
  await sleep(120);W3.laserMat.emissiveIntensity=.35;
  // 봉투가 펼쳐져 있으면 봉투 안으로, 아니면 옆에 모아 둔다
  it.userData.state="done";
  await tween(it,doneSpot(C),260,{lift:.08});
  HANDS.R.follow=null;HANDS.rest("R");

}
function doneSpot(C){
  const i=C.itemObjs.filter(o=>o.userData.state==="done"||o.userData.state==="bagged").length-1;
  if(C.bagOn){return V3(SPOT.bag.x+((i%3)-1)*.05,COUNTER_Y+.01+Math.floor(i/3)*.03,SPOT.bag.z+((i%2)-.5)*.04)}
  return V3(SPOT.done.x+((i%3)-1)*.08,COUNTER_Y,SPOT.done.z+Math.floor(i/3)*.09)
}

/* ---------- 봉투 ---------- */

/* ---------- 전자레인지: 테이블 옆으로 옮겼다 (g9_micro.js) ---------- */

/* ---------- 결제 ---------- */
function checkReady(C){
  if(!C||C.state!=="counter"||C.payObj||C.paidDone)return;
  const t=nextTask(C);if(!t||t.k!=="pay")return;
  if(hasUp("parttimer")&&C.wantBag&&!C.bagOn){C.bagOn=true;C.scanned.push("bag");C.prices.push(priceOf("bag"));W3.bag.visible=true;W3.bag.scale.setScalar(1);drawPos();
    C.itemObjs.filter(o=>o.userData.state==="done").forEach(o=>tween(o,doneSpot(C),160));Talk.say("(알바생이 봉투를 챙겨 줬다. 든든해)","happy","pt1")}
  const total=C.total();
  setTimeout(()=>{
    if(C.state!=="counter")return;
    if(C.pay==="card"){sayC(C,"카드요~");C.payObj=makeCard();{const h=new T.Mesh(box(.16,.06,.12),HIT_MAT);h.position.y=.02;h.userData.owner=C.payObj;C.payObj.add(h);C.payObj.userData.hit=h}C.payObj.position.set(C.obj.position.x+.1,1.05,C.obj.position.z+.35);scene.add(C.payObj);
      tween(C.payObj,SPOT.cash.clone().setY(COUNTER_Y+.018),380,{lift:.05});C.payObj.rotation.set(.55,.25,0);C.payObj.scale.setScalar(1.25)}
    else{
      const paid=C.def.pays?C.def.pays*moneyScale():cashFor(C,total);C.paid=paid;
      sayC(C,paid===total?"딱 맞게 드릴게~":C.type==="rich"?"5만 원짜리밖에 없네, 허허":"현금이요");
      C.payObj=makeCashPile(paid);C.payObj.position.set(C.obj.position.x,1.05,C.obj.position.z+.35);scene.add(C.payObj);tween(C.payObj,SPOT.cash.clone(),380,{lift:.05});
    }
    C.posMsg="결제 대기";C.posMsgColor="#e0a400";drawPos();
    if(GAME.tut)tutEvent("pay");
  },350);
}
// 손님이 내는 현금 (돈 단위 S 기준으로 계산)
function cashFor(C,total){
  const S=moneyScale(),t=Math.round(total/S);
  if(C.def.exact)return total;
  let p;
  if(C.def.coins)p=Math.ceil(t/500)*500;
  else if(t<=4000&&Math.random()<.4)p=5000;
  else if(t<=9000)p=10000;
  else p=Math.random()<.5&&t<50000?50000:Math.ceil(t/10000)*10000;
  return p*S;
}
async function takeCard(){

async function takeCash(){
  const C=GAME.cur;if(!C||!C.payObj||C.pay!=="cash"||C.paying)return;C.paying=true;
  GAME.busy=true;HANDS.hold("R",C.payObj,[10,4],"grab");Snd.drawer();

/* ---------- 금고 (거스름돈) ----------
   tray 와 changeU 는 '단위(S)' 정수. 가게가 커지면 S가 10, 100, ... 배로 커진다 */
const DR={C:null,change:0,changeU:0,tray:[],S:0};
const CHANGE_UNITS=[10000,5000,1000,500,100,50,10];
function buildCashGrid(){
  const S=moneyScale();DR.S=S;
  $("cashGrid").innerHTML=CHANGE_UNITS.map(u=>`<button type="button" data-v="${u}"><img src="${moneyImg(u*S,u>=1000)}" alt=""><span>${moneyText(u*S)}원</span></button>`).join("");
  $("cashGrid").querySelectorAll("button").forEach(b=>b.onclick=()=>{const u=+b.dataset.v;DR.tray.push(u);u>=1000?Snd.bag():Snd.coin();renderTray()});
  $("drReset").onclick=()=>{DR.tray=[];Snd.click();renderTray()};
  $("drGive").onclick=giveChange;
}
function openDrawer(C,change){
  if(DR.S!==moneyScale())buildCashGrid();
  DR.C=C;DR.change=change;DR.changeU=Math.round(change/DR.S);DR.tray=[];
  $("drPaid").textContent=won(C.paid);$("drTotal").textContent=won(C.total());$("drChange").textContent=won(change);
  renderTray();$("drawer").hidden=false;HANDS.hidden=true;
  if(GAME.tut)tutEvent("drawer");
}
function renderTray(){
  const u=DR.tray.reduce((a,b)=>a+b,0);
  $("tray").innerHTML=DR.tray.map(v=>`<img src="${moneyImg(v*DR.S,v>=1000)}" alt="${moneyText(v*DR.S)}원">`).join("")+`<span class="sum" id="traySum">${won(u*DR.S)}</span>`;
  $("traySum").style.color=u===DR.changeU?"#8ff7b5":u>DR.changeU?"#ff8a7a":"#fff";
}
function giveChange(){
  const C=DR.C;if(!C)return;
  const sumU=DR.tray.reduce((a,b)=>a+b,0),sum=sumU*DR.S,diff=(sumU-DR.changeU)*DR.S;
  $("drawer").hidden=true;HANDS.hidden=false;DR.C=null;
  // 거스름돈이 손님 쪽으로 날아간다
  const pile=makeCashPile(Math.max(10*DR.S,sum),DR.S);pile.position.set(.1,COUNTER_Y,.2);scene.add(pile);
  HANDS.hold("R",pile,[10,4],"give");
  tween(pile,V3(C.obj.position.x,1.02,C.obj.position.z+.35),420,{lift:.05}).then(()=>{scene.remove(pile);HANDS.R.follow=null;HANDS.rest("R")});
  Snd.coin();
  finishSale(C,diff);
}

/* ---------- 계산 끝 ---------- */
function finishSale(C,diff,{tip=0,richTip=false}={}){
  if(C.paidDone)return;C.paidDone=true;
  const N=GAME.night,total=C.total(),ratio=clamp(C.pat/C.patMax,0,1);
  N.sales+=total;N.served++;MISSION.add("served");
  let d=ratio>.6?.05:.015;
  if(diff<0){N.short++;d=-.12;sayC(C,`어? ${won(-diff)} 덜 주셨는데요?!`,"angry");Snd.angry()}
  else if(diff>0){N.over+=diff;sayC(C,"어... 더 주셨는데? (조용히 챙긴다)",null)}
  else{sayC(C,pick(C.def.bye),ratio>.6?"love":null)}
  if(!richTip&&diff>=0&&ratio>.5&&Math.random()<.6)tip=randInt(2,8)*100*moneyScale();
  if(tip&&!richTip&&state.role==="owner")tip=earnUp(tip);   // 사장님은 1.85배
  if(tip&&hasUp("interior")&&!richTip)tip=Math.round(tip*1.5);
  if(tip){N.tips+=tip;MISSION.add("tips");const s=toScreen(V3(0,COUNTER_Y,-.2));floatText(`팁 +${won(tip)}`,s.x,s.y-60,"#ffcc2e",26);Snd.coin()}
  if(richTip)setTimeout(()=>Talk.say(`부자 형님이 ${won(tip)}을 팁으로 줬다!! 이 세계에서도 형님은 형님이다...`,"shock"),600);
  if(C.type==="grandma"){d+=.03;setTimeout(()=>{const s=toScreen(V3(0,COUNTER_Y,-.2));floatText("사탕 받았다!",s.x,s.y-90,"#fff",22)},500)}
  if(diff===0&&ratio>.6)N.perfect++;
  state.rating=clamp(state.rating+d,1,5);
  C.posMsg=diff<0?"시재 부족!":"결제 완료";C.posMsgColor=diff<0?"#e8412c":"#2fbf71";drawPos();
  Snd.happy();
  if(GAME.tut)tutEvent("paid");
  // 손님이 물건(봉투)을 들고 나간다
  setTimeout(()=>{
    const hand=V3(C.obj.position.x,1.02,C.obj.position.z+.3);

  if(n===1)return 5;
  let c=(state.tier||0)?Math.min(22,8+n):Math.min(12,8+n);   // 리모델링 전: 10~12명 (하루 평균 15만 원쯤)
  c*=(hasUp("led")?1.3:1)*(hasUp("freezer")?1.1:1)*(.8+state.rating*.06)*(1+upEff("cust"));   // 사장님 메뉴 간판·광고
  return Math.round((Math.min(28,Math.round(c)+Math.min(8,state.tier||0)))*(state.crowdK||1));   // 리모델링할 때마다 손님 1.5~2배
}
function pickType(){

  const tot=keys.reduce((s,k)=>s+CUSTOMERS[k].w,0);let r=Math.random()*tot;return keys.find(k=>(r-=CUSTOMERS[k].w)<0)||"normal";
}

function spawnPlanned(p){

function stepNight(dt){
  if(!GAME.running)return;
  const empty=!CUST.length,far=!GAME.plan.length||GAME.plan[0].t-GAME.t>5;
  const speed=empty&&far&&!GAME.tut?4:1;              // 한가하면 시간이 휙휙
  GAME.t+=dt/1000*speed;
  while(GAME.plan.length&&GAME.plan[0].t<=GAME.t){
    const p=GAME.plan[0];
    const inLine=isMarket()?CUST.filter(c=>["counter","toCounter","queue","toQueue"].includes(c.state)).length:CUST.filter(c=>c.state!=="eating"&&c.state!=="toSeat").length;
    if(inLine>=3||(isMarket()&&CUST.length>=crowdCap())||(p.waitEmpty&&CUST.length>0)){p.t=GAME.t+1.5;GAME.plan.sort((a,b)=>a.t-b.t);break}
    GAME.plan.shift();spawnPlanned(p);
  }
  // 새벽 2시 폐기
  if(!GAME.tut&&!GAME.expiredDone&&!isMarket()&&GAME.hour()>=4){GAME.expiredDone=true;const it=makeProduct("kimbap");it.position.set(-.82,COUNTER_Y,.18);it.rotation.y=.4;it.userData.state="expired";scene.add(it);GAME.expired=it;
    const s=toScreen(it.position);floatText("폐기",s.x,s.y-40,"#ff8a7a",22);Talk.say("새벽 2시 폐기 시간! 유통기한 지난 삼각김밥이 나왔다... 눌러서 먹어도 되겠지?","wink")}
  // 한가할 때 혼잣말
  if(!GAME.cur&&!GAME.busy){GAME.idleT+=dt;if(GAME.idleT>16000&&!GAME.tut){GAME.idleT=0;Talk.say(pick(IDLE_GAGS),"happy")}}else GAME.idleT=0;
  if(GAME.t>=SHIFT_SEC){GAME.t=SHIFT_SEC;
    if(!GAME.plan.length&&!CUST.length&&!GAME.ending){GAME.ending=true;Talk.say("06시! 퇴근이다아아!!","wink");setTimeout(endNight,1400)}}
  // 06시가 지나면 남은 계획은 버린다
  if(GAME.t>=SHIFT_SEC&&GAME.plan.length&&!GAME.tut)GAME.plan=[];
}

    N.crowdN=cnt;N.crowdSales=Math.round(avg*cnt/unit)*unit;N.sales+=N.crowdSales;N.served+=cnt}

    L.profit=Math.round(N.sales*(hasUp("parttimer")?1.1:1)*EARN);   // 1.85배   // 매출은 전부 내 돈 (상품값은 졸팡에서 주문할 때 이미 냈다)

    L.coffeeOver=N.coffeeOver||0;L.coffeeLoss=Math.round(N.sales*.003*L.coffeeOver);   // 커피 넘칠 때마다 오늘 매출의 0.3%
    L.cost=runCost();L.orders=N.orders||0;L.mini=N.mini||0;L.income=L.profit+L.self+L.bonus+L.mini+N.tips-N.over-L.cost-L.coffeeLoss;
    // 사장님 메뉴 설비 효과: 판매·팁·단골·미니게임 보너스
    const unit=10*moneyScale();L.upfx=Math.round((L.profit*upEff("sales")+N.tips*upEff("tips")+L.bonus*upEff("bonus")+L.mini*upEff("mini"))/unit)*unit;L.income+=L.upfx;
    if(upEff("rating"))state.rating=clamp(state.rating+upEff("rating"),1,5);
    L.robot=robotAge()?Math.round((L.profit+L.self+L.bonus+L.mini+N.tips)*BOT.profit/(10*moneyScale()))*10*moneyScale():0;L.income+=L.robot;   // 로봇: 수익 +20%
    const hm=hmSettle(L.income);L.hmTotal=hm.total;L.hmTaken=HM.taken;L.income+=hm.rest;   // 노숙자 아저씨 바구니: 번 돈의 70%
  }
  L.selfN=N.self||0;L.flyers=N.flyers||0;L.crowdN=N.crowdN||0;L.crowdSales=N.crowdSales||0;L.net=L.income-(L.orders||0)+(L.hmTaken||0);L.soldout=N.soldout||0;
  L.restock=N.restock||0;L.clean=N.clean||0;L.botClean=N.botClean||0;L.slips=N.slips||0;L.trash=N.trash||0;L.heat=N.heat||0;L.dirty=N.dirty||0;L.leftGaps=CHORES.gaps.length;L.leftSpills=CHORES.spills.length;
  L.leftTrash=SEATS.filter(s=>s.trash&&performance.now()-s.trash.userData.t0>20000).length;
  const left=L.leftGaps+L.leftSpills+L.leftTrash;if(left)state.rating=clamp(state.rating-.05*left,1,5);

  const S=state.stats;S.served+=N.served;S.angry+=N.angry;S.tips+=N.tips;S.sales+=N.sales;S.nights++;S.best=Math.max(S.best,L.net);

    UPGRADES.filter(u=>!hasUp(u.id)).sort((a,b)=>a.cost-b.cost).slice(0,state.night%2?2:1).forEach(u=>{if(u.cost<=m){ids.push(u.id);m-=u.cost}})}

/* ================= 1인칭으로 걸어 다니기 =================
   WASD(또는 방향키) 이동, 우클릭으로 끌어서 둘러보기, 왼쪽 클릭(또는 E)으로 누르기.
   휴대폰은 화면을 끌어서 둘러보고 왼쪽 아래 조이스틱으로 걷는다. 벽·계산대·진열대·손님은 지나갈 수 없다 */
const EYE=1.56, RADIUS=.26;
const PLAYER={pos:new T.Vector3(0,0,.95),yaw:0,pitch:-.3,keys:{},walkT:0,speed:0,stick:{x:0,y:0},
  reset(){this.pos.set(0,0,camera.aspect<.8?.72:.95);ELEV.ride=null;this.yaw=0;this.pitch=camera.aspect<.8?-.36:-.3;this.speed=0;this.keys={};this.apply()},
  // 계산대 안쪽 (계산할 수 있는 자리)
  inRegister(){return this.pos.z>.3&&Math.abs(this.pos.x)<1.35},
  // 다른 층에 있는 건 멀다 (2층에서 1층 물건을 못 누른다)
  dist(p){const d=Math.hypot(p.x-this.pos.x,p.z-this.pos.z);if(!LAY2.on)return d;return ((p.y||0)>=2.9?1:0)===(this.pos.y>1.5?1:0)?d:d+99},
  apply(){
    const bob=Math.sin(this.walkT*.011)*.018*Math.min(1,this.speed);
    camera.position.set(this.pos.x,EYE+bob+this.pos.y,this.pos.z);camera.rotation.set(this.pitch,this.yaw,0,"YXZ");
  },
  step(dt){
    if(ELEV.ride){stepRide(dt);this.apply();return}   // 엘리베이터 타는 중
    const k=this.keys,s=dt/1000;
    let f=(k.w||k.arrowup?1:0)-(k.s||k.arrowdown?1:0),r=(k.d?1:0)-(k.a?1:0);
    f+=-this.stick.y;r+=this.stick.x;
    const turn=(k.arrowleft?1:0)-(k.arrowright?1:0);
    this.yaw+=turn*1.9*s;
    const len=Math.hypot(f,r);
    if(len>1){f/=len;r/=len}
    const sp=(k.shift?3.4:2.2)*Math.min(1,len);
    this.speed+=((len>.05?1:0)-this.speed)*Math.min(1,dt*.012);
    if(len>.05){
      const sy=Math.sin(this.yaw),cy=Math.cos(this.yaw);
      const dx=(-sy*f+cy*r)*sp*s,dz=(-cy*f-sy*r)*sp*s;
      this.move(dx,0);this.move(0,dz);this.walkT+=dt;
    }
    this.pushFromCustomers();
    this.apply();
  },
  // 잘게 나눠 움직여서 벽 바로 앞까지 붙는다
  // 계단 위에서는 높이가 바뀐다 (계단은 위아래 끝으로만 드나든다)
  move(dx,dz){const n=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.04));for(let i=0;i<n;i++){const nx=this.pos.x+dx/n,nz=this.pos.z+dz/n,ny=stairY(this.pos,nx,nz);
    if(ny===null||(!onStair(nx,nz)&&blocked(nx,nz,ny)))break;this.pos.x=nx;this.pos.z=nz;this.pos.y=ny}},
  pushFromCustomers(){
    CUST.forEach(C=>{if(C.state==="gone"||Math.abs(C.obj.position.y-this.pos.y)>1)return;const o=C.obj.position,dx=this.pos.x-o.x,dz=this.pos.z-o.z,d=Math.hypot(dx,dz),min=RADIUS+.24;
      if(d<min&&d>.001){const k=(min-d)/d;const nx=this.pos.x+dx*k,nz=this.pos.z+dz*k;if(!blocked(nx,nz)){this.pos.x=nx;this.pos.z=nz}}});
  }
};
// 부딪히는 곳: [x1,z1,x2,z2]
function obstacles(){
  if(isMarket())return marketObstacles();
  const O=[
    [-1.21,-.42,1.21,.42],               // 계산대
    [WING_X-.31,-1.8,WING_X+.31,-.36],   // 오른쪽 기계 테이블 (계산대와 사이가 직원 통로)
    [-1.78,-6.3,-.92,-2.25],[.92,-6.3,1.78,-2.25],   // 곤돌라
    [-3.4,-7.2,-2.72,-2],                // 음료 냉장고
    [2.94,-6.95,3.4,-2.25]               // 오른쪽 벽 선반
  ];
  if(hasUp("freezer"))O.push([FREEZER.x-.31,FREEZER.z-.55,FREEZER.x+.31,FREEZER.z+.55]);   // 계산대 오른쪽 뒤 냉동고
  // 먹고 가는 곳: 테이블 + 의자 4개 + 전자레인지 장
  O.push([-2.78,-1.97,-2.12,-.53]);O.push([-3.35,-.02,-2.78,.62]);
  SEATS.forEach(s=>O.push([s.x-.22,s.z-.22,s.x+.22,s.z+.22]));
  if(hasUp("kiosk"))O.push([2.2,-6.7,2.8,-6.1]);
  if(hasUp("parttimer"))O.push([-1.55,.35,-1.15,.75]);
  return O;
}
// 슈퍼마켓: 계산대 없음, 넓은 곤돌라, 양쪽 벽 냉장고, 셀프 계산대, 창고 선반
function marketObstacles(){
  const O=[[WING_X-.31,-1.8,WING_X+.31,-.36]];
  HALL_GONDOLAS.forEach(([x,z0,L])=>O.push([x-.43,z0-L,x+.43,z0+.25]));
  O.push([-HALL.x,-7.25,-(HALL.x-.66),-2.0],[HALL.x-.66,-7.25,HALL.x,-2.0]);
  LANES.forEach(L=>O.push([L.x-.31,-7.3,L.x+.31,-6.82]));O.push([-1.15,-7.2,-.75,-6.85]);
  O.push(LAY2.on?[-MK.rackSpan,3.5,MK.rackSpan,HALL.zb]:[-(HALL.x-.1),3.5,HALL.x-.1,HALL.zb]);   // 창고 선반 (2층이면 왼쪽 끝은 엘리베이터 길)
  if(autoShelf())O.push([-5.35,2.65,-3.05,3.35]);
  O.push([PHONE_DESK.x-.23,PHONE_DESK.z-.21,PHONE_DESK.x+.23,PHONE_DESK.z+.21]);   // 사장님 전화 책상
  MK.obs.forEach(o=>O.push(o));   // 화분·로봇
  if(hasUp("freezer"))O.push([FREEZER.x-.31,FREEZER.z-.55,FREEZER.x+.31,FREEZER.z+.55]);
  O.push([-2.78,-1.97,-2.12,-.53]);O.push([-3.35,-.02,-2.78,.62]);
  SEATS.forEach(s=>O.push([s.x-.22,s.z-.22,s.x+.22,s.z+.22]));
  if(hasUp("parttimer"))O.push([-1.55,.35,-1.15,.75]);
  return O;
}
let OBST=null;
function blocked(x,z,y=PLAYER.pos.y){
  if(LAY2.on&&y>1.5)return blocked2(x,z);   // 2층
  // 가게 밖 (슈퍼마켓부터): 유리문 사이로만 드나들고, 인도 안에서만
  if(z<-7.4+RADIUS){
    if(!canGoOut())return true;
    if(Math.abs(x)>.46&&z>-7.94)return true;
    const ox=isMarket()?HALL.x-.1:4.9;if(z<-10.55+RADIUS||x<-ox+RADIUS||x>ox-RADIUS)return true;
    return [[3.72,-10.48,3.88,-10.32],[-4.1,-10.45,-3.1,-10.25]].some(([a,b,c,d])=>x>a-RADIUS&&x<c+RADIUS&&z>b-RADIUS&&z<d+RADIUS);   // 가로등, 게시판
  }
  const hx=isMarket()?HALL.x-.1:3.3,hz=isMarket()?HALL.zb-.1:2.1;
  if(x<-hx+RADIUS||x>hx-RADIUS||z>hz-RADIUS)return true;
  return (OBST||(OBST=obstacles())).some(([a,b,c,d])=>x>a-RADIUS&&x<c+RADIUS&&z>b-RADIUS&&z<d+RADIUS);
}
function refreshObstacles(){OBST=null;OBST2=null}

// 마우스: 우클릭 끌기 = 둘러보기, 왼쪽 클릭 = 누르기.  터치: 끌기 = 둘러보기, 짧게 누르기 = 누르기
const DRAG={id:null,x:0,y:0,moved:false,sx:0,sy:0,look:false};
const LOOK={on:false,id:null};
function onDown(e){
  if(ML.on&&!e.__sw)return;
  if(Scr.name==="opening"){if(e.button===2)return;if(Op.i<Op.list.length){Snd.click();Op.go(Op.i+1)}return}
  if(Scr.name!=="game")return;
  Snd.wake();if(!e.__sw)tryLock(e);
  if(e.pointerType==="mouse"&&e.button===2){LOOK.on=true;LOOK.id=e.pointerId;DRAG.x=e.clientX;DRAG.y=e.clientY;try{$("gl").setPointerCapture(e.pointerId)}catch(err){}e.preventDefault();return}
  if(e.button>0)return;
  DRAG.id=e.pointerId;DRAG.x=DRAG.sx=e.clientX;DRAG.y=DRAG.sy=e.clientY;DRAG.moved=false;DRAG.look=e.pointerType!=="mouse";
  try{$("gl").setPointerCapture(e.pointerId)}catch(err){}
}
function onMove(e){
  if(ML.on&&!e.__sw)return;
  if(LOOK.on&&e.pointerId===LOOK.id){
    if(canMove()){const mx=e.movementX!=null?e.movementX:e.clientX-DRAG.x,my=e.movementY!=null?e.movementY:e.clientY-DRAG.y;PLAYER.yaw-=mx*.0036;PLAYER.pitch=clamp(PLAYER.pitch-my*.0036,-1.2,1.05)}
    DRAG.x=e.clientX;DRAG.y=e.clientY;return}
  if(DRAG.id!==e.pointerId||!canMove())return;
  const dx=e.clientX-DRAG.x,dy=e.clientY-DRAG.y;
  if(!DRAG.moved&&Math.hypot(e.clientX-DRAG.sx,e.clientY-DRAG.sy)>7)DRAG.moved=true;
  if(DRAG.moved&&DRAG.look){const k=.006;PLAYER.yaw-=dx*k;PLAYER.pitch=clamp(PLAYER.pitch-dy*k,-1.2,1.05)}
  DRAG.x=e.clientX;DRAG.y=e.clientY;
}
function onUp(e){
  if(ML.on&&!e.__sw)return;
  if(LOOK.on&&e.pointerId===LOOK.id&&(e.button===2||e.buttons===0)){LOOK.on=false;LOOK.id=null;return}
  if(DRAG.id!==e.pointerId)return;DRAG.id=null;
  if(!DRAG.moved&&canMove()){const r=$("gl").getBoundingClientRect();interactAt(e.clientX-r.left,e.clientY-r.top,false)}
}
$("gl").addEventListener("pointerdown",onDown);
$("gl").addEventListener("pointermove",onMove);
$("gl").addEventListener("pointerup",onUp);
$("gl").addEventListener("pointercancel",()=>{DRAG.id=null;LOOK.on=false;LOOK.id=null});

const touchUI=!!(window.matchMedia&&matchMedia("(pointer:coarse)").matches);
(function joystick(){
  const el=$("stick"),knob=$("stickKnob");if(!el)return;
  let id=null,cx=0,cy=0;
  const set=(x,y)=>{const R=el.clientWidth/2-6,d=Math.hypot(x,y),k=d>R?R/d:1;knob.style.transform=`translate(${x*k}px,${y*k}px)`;PLAYER.stick.x=x*k/R;PLAYER.stick.y=y*k/R};
  el.addEventListener("pointerdown",e=>{id=e.pointerId;const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;set(e.clientX-cx,e.clientY-cy);try{el.setPointerCapture(id)}catch(err){}e.preventDefault();noteMoved()});
  el.addEventListener("pointermove",e=>{if(e.pointerId===id)set(e.clientX-cx,e.clientY-cy)});

/* ---------- 화면 가장자리 화살표 (계산대가 안 보일 때) ---------- */
function edgeArrow(ctx,worldP,label,t){

  const dx=worldP.x-PLAYER.pos.x,dz=worldP.z-PLAYER.pos.z;
  const ang=Math.atan2(dx,-dz)+PLAYER.yaw;   // 0 = 정면
  const ax=W/2+Math.sin(ang)*Math.min(W,H)*.36,ay=Math.min(H-170,H*.45-Math.cos(ang)*Math.min(W,H)*.3);
  ctx.save();ctx.translate(clamp(ax,m,W-m),clamp(ay,m+40,H-m-60));ctx.rotate(ang);

  wobbleLine(ctx,[[0,26],[0,-20]],8,"#ffcc2e",3);wobbleLine(ctx,[[-16,-4],[0,-22],[16,-4]],8,"#ffcc2e",4);
  ctx.restore();
  const lx=clamp(ax,m,W-m),ly=clamp(ay,m+40,H-m-60)+44;

  ctx.fillStyle="#ffcc2e";ctx.strokeStyle=INK;ctx.lineWidth=3;rr(ctx,lx-w/2,ly-15,w,30,10);ctx.fill();ctx.stroke();rawText(ctx,label,lx,ly,Math.round(16*ctx.__ts),INK);
}

/* ================= 편의점 잡일: 진열 채우기, 바닥 닦기 =================
   밤마다 진열대 칸이 비고, 손님이 음료를 쏟는다. 가까이 가서 누르면 낙서 손이 처리한다 */
const CHORES={gaps:[],spills:[],nextGap:40,nextSpill:70,spillSeq:0,mop:null};
const REACH=2.1;
function resetChores(){
  CHORES.gaps.slice().forEach(s=>fillSection(s,true));CHORES.gaps=[];
  CHORES.spills.slice().forEach(s=>{scene.remove(s.mesh);scene.remove(s.hit);if(s.can)scene.remove(s.can)});CHORES.spills=[];
  CHORES.nextGap=35+Math.random()*25;CHORES.nextSpill=60+Math.random()*50;CHORES.mop=null;
  SEATS.forEach(s=>{removeTrash(s);s.by=null});resetMicro();
}
function stepChores(){
  if(GAME.tut||!GAME.running||GAME.t>=SHIFT_SEC)return;
  if(GAME.t>=CHORES.nextGap){CHORES.nextGap=GAME.t+38+Math.random()*30;if(CHORES.gaps.length<3)makeGap()}
  if(GAME.t>=CHORES.nextSpill){CHORES.nextSpill=GAME.t+70+Math.random()*60;if(CHORES.spills.length<2)makeSpill()}
}

/* ---------- 빈 진열 칸 ---------- */
const ZERO=new T.Matrix4().makeScale(0,0,0);
function makeGap(){
  const pool=W3.sections.filter(s=>!s.empty);if(!pool.length)return;
  const s=pick(pool);s.empty=true;
  s.items.forEach(({m,i})=>{m.setMatrixAt(i,ZERO);m.instanceMatrix.needsUpdate=true});
  s.hit=new T.Mesh(box(.3,.36,.55),HIT_MAT);s.hit.position.copy(s.c);s.hit.userData.act="restock";s.hit.userData.sec=s;scene.add(s.hit);
  CHORES.gaps.push(s);
  Talk.say(state.talked.gap1?pick(["또 진열대가 비었다! 노란 표시 따라가자","물건이 휙휙 팔린다. 진열하러 가야지!"]):"진열대 한 칸이 텅 비었다! 걸어가서 노란 표시를 누르면 채울 수 있어","happy",state.talked.gap1?null:"gap1");
}
function fillSection(s,instant){
  s.empty=false;s.items.forEach(({m,i,mat})=>{m.setMatrixAt(i,mat);m.instanceMatrix.needsUpdate=true});
  if(s.hit){scene.remove(s.hit);s.hit=null}
  const k=CHORES.gaps.indexOf(s);if(k>=0)CHORES.gaps.splice(k,1);
}
async function restock(s){
  if(!s.empty)return;
  GAME.busy=true;
  const p=toScreen(s.c);HANDS.go("R",p.x+20,p.y+10,"grab",.25);HANDS.go("L",p.x-40,p.y+20,"grab",.25);
  await sleep(260);
  for(let n=0;n<s.items.length;n++){const {m,i,mat}=s.items[n];m.setMatrixAt(i,mat);m.instanceMatrix.needsUpdate=true;if(n%2===0)Snd.tone(900+n*60,.05,"triangle",.04);await sleep(70)}
  fillSection(s);
  floatText("진열 완료!",p.x,p.y-40,"#8ff7b5",24);Snd.happy();
  state.rating=clamp(state.rating+.03*satMult(),1,5);GAME.night.restock=(GAME.night.restock||0)+1;MISSION.add("restock");
  HANDS.rest("R");HANDS.rest("L");GAME.busy=false;
}

/* ---------- 쏟아진 음료 ---------- */
function puddleGeo(){const s=new T.Shape(),n=14;for(let i=0;i<=n;i++){const a=i/n*TAU,r=.28*(1+.28*Math.sin(i*2.3)+.12*Math.cos(i*5.1));i?s.lineTo(Math.cos(a)*r,Math.sin(a)*r*.8):s.moveTo(Math.cos(a)*r,Math.sin(a)*r*.8)}return new T.ShapeGeometry(s)}
function makeSpill(){
  const spots=isMarket()?COLS.map((c,i)=>[c+(i?0:.2),i%2?-3.6:-4.6]).concat([[0,-3.2],[3.9,.2],[-4.1,-.6]]):[[0,-3.2],[.1,-4.6],[-.2,-5.6],[2.35,-3.6],[2.35,-5.2],[-2.2,-3.4],[-2.2,-5]];
  const [x,z]=pick(spots.filter(([x,z])=>!CHORES.spills.some(s=>Math.hypot(s.x-x,s.z-z)<1)));
  const col=pick([0x230c03,0xff7a0a,0xff9fbd]);
  const mat=new T.MeshPhysicalMaterial({color:col,roughness:.02,metalness:0,clearcoat:1,clearcoatRoughness:.02,transparent:true,opacity:.86,envMapIntensity:2.2,depthWrite:false});
  const mesh=new T.Mesh(puddleGeo(),mat);mesh.rotation.x=-Math.PI/2;mesh.position.set(x,.004,z);scene.add(mesh);
  const hit=new T.Mesh(box(.8,.2,.8),HIT_MAT);hit.position.set(x,.1,z);hit.userData.act="spill";scene.add(hit);
  const sp={id:++CHORES.spillSeq,x,z,mesh,hit,mat};hit.userData.spill=sp;CHORES.spills.push(sp);
  // 쏟은 캔
  const can=makeProduct(pick(["cola","cider"]));can.rotation.z=Math.PI/2;can.position.set(x+.18,.034,z+.08);scene.add(can);sp.can=can;
  if(typeof CLEAN!=="undefined"&&CLEAN.bots.length){Talk.say(pick(["누가 또 쏟았다! 청소 로봇 출동~","쏟았다! 청소 로봇이 달려간다"]),"happy");return}   // 청소 로봇이 알아서
  Talk.say(state.talked.spill1?pick(["바닥에 또 쏟았어! 손님 미끄러지기 전에 닦자","누가 또 쏟았다... 대걸레 출동!"]):"누가 음료를 쏟았다! 바닥에 번쩍이는 거 보이지? 가까이 가서 누르면 닦아. 안 닦으면 손님이 미끄러져","sweat",state.talked.spill1?null:"spill1");
}
async function mopSpill(sp){
  if(!CHORES.spills.includes(sp))return;
  GAME.busy=true;CHORES.mop={sp,t:0};Snd.noiseHit(700,1.2,.08,"lowpass");
  for(let i=0;i<14;i++){sp.mat.opacity=.82*(1-i/14);await sleep(90)}
  if(!CHORES.spills.includes(sp)){CHORES.mop=null;HANDS.rest("R");HANDS.rest("L");GAME.busy=false;return}   // 청소 로봇이 먼저 닦았다
  scene.remove(sp.mesh);scene.remove(sp.hit);scene.remove(sp.can);CHORES.spills.splice(CHORES.spills.indexOf(sp),1);
  CHORES.mop=null;const s=toScreen(V3(sp.x,0,sp.z));floatText("반짝반짝!",s.x,s.y-30,"#8ff7b5",24);Snd.happy();
  state.rating=clamp(state.rating+.02*satMult(),1,5);GAME.night.clean=(GAME.night.clean||0)+1;MISSION.add("clean");
  HANDS.rest("R");HANDS.rest("L");GAME.busy=false;
}
// 낙서 대걸레 (닦는 동안)
function drawMop(ctx,t){
  const M=CHORES.mop;if(!M)return;
  const s=toScreen(V3(M.sp.x,0,M.sp.z));if(s.behind)return;
  const sw=Math.sin(t*.02)*50;
  HANDS.go("R",s.x+sw+30,s.y-150,"grab",.5);HANDS.go("L",s.x+sw*.6-10,s.y-230,"grab",.5);
  wobbleLine(ctx,[[s.x+sw*.6-10,s.y-240],[s.x+sw,s.y]],7,"#8a5a2a",11);
  ctx.save();ctx.translate(s.x+sw,s.y);for(let i=-4;i<=4;i++)wobbleLine(ctx,[[0,0],[i*7,22]],5,"#e8e4d6",20+i);ctx.restore();
}
// 손님이 쏟은 곳을 밟으면 미끄덩
function checkSlip(C){
  if(C.doodle&&C.type==="rich"||C.obj.position.y>.3)return;   // 2층·계단에선 1층 바닥을 안 밟는다
  for(const sp of CHORES.spills){if(C.slip&&C.slip[sp.id])continue;
    if(Math.hypot(C.obj.position.x-sp.x,C.obj.position.z-sp.z)<.35){(C.slip||(C.slip={}))[sp.id]=1;
      const s=toScreen(C.obj.position.clone().setY(1.2));floatText("미끄덩!",s.x,s.y,"#ff8a7a",28);Snd.boing();C.slipUntil=performance.now()+1100;
      sayC(C,"으악! 바닥이 미끄러워요!","angry");C.pat=Math.max(0,C.pat-C.patMax*.2);state.rating=clamp(state.rating-.06,1,5);
      GAME.night.slips=(GAME.night.slips||0)+1;
      if(!state.talked.slip1)Talk.say("앗, 손님이 미끄러졌다! 쏟은 거 빨리 닦아야 해","sweat","slip1");}}
}
// 표시: 빈 칸, 쏟은 곳, 테이블 쓰레기 위에 낙서 느낌표
function drawChoreMarks(ctx,t){

    const d=PLAYER.dist(s.trash.position);if(d<5){ctx.globalAlpha=clamp(1.4-d/4,0,1);outlinedText(ctx,d<=REACH?"눌러서 치우기":"쓰레기",p.x,p.y-34,15,"#ff9f6a",INK,4);ctx.globalAlpha=1}});

    const d=PLAYER.dist(s.c);if(d<5){ctx.globalAlpha=clamp(1.4-d/4,0,1);outlinedText(ctx,d<=REACH?"눌러서 진열":"진열 필요",p.x,p.y-34,15,"#ffcc2e",INK,4);ctx.globalAlpha=1}});

}


/* ================= 전화기 → 졸라 리모델링 (주) =================
   사장님 통장에 공사비가 모이면 계산대 위 전화가 따르릉! 받아서 공사를 부르면
   가게가 한 단계 커진다: 음식값↑, 손님↑, 새 비싼 메뉴, 창밖 풍경 */
const PHONE={rang:{},ringing:false,ringT:0,rings:0,building:false};
const SKY_NAME={city:"밤거리",high:"100층 구름 위",space:"우주와 지구",moon:"달 표면",galaxy:"은하수",world:"졸라맨 월드",
  time:"시계 소용돌이",warp:"차원 터널",gods:"구름 궁전",void:"우주 끝 (아무것도 없음)",verse:"무지개 졸라버스"};
const nextTier=()=>(state.tier||0)<MAX_TIER?STORE_TIERS[(state.tier||0)+1]:null;
const canRemodel=()=>state.role==="owner"&&!!nextTier()&&state.money>=nextTier().cost;
const shortWon=n=>"₩"+korNum(n,1e4);            // 25만, 1,000만, 19억 ...
const phonePos=()=>W3.phone.getWorldPosition(V3(0,0,0));
function resetPhone(){PHONE.rang={};PHONE.ringing=false;PHONE.building=false;$("build").hidden=true}

function stepPhone(dt,now){
  const owner=state.role==="owner",can=canRemodel(),btn=$("hPhone");
  if(btn.hidden===owner)btn.hidden=!owner;
  btn.classList.toggle("hot",can);
  const t=state.tier||0;
  // 한 단계에 한 번: 밤 근무 중, 공사비가 모이면 울린다
  if(can&&!PHONE.rang[t]&&GAME.running&&!GAME.tut&&!GAME.cur&&$("modal").hidden&&!Talk.story){PHONE.rang[t]=1;PHONE.ringing=true;PHONE.ringT=600;PHONE.rings=0}
  if(PHONE.ringing&&(!can||!GAME.running))PHONE.ringing=false;
  const hs=W3.handset;
  if(PHONE.ringing&&$("modal").hidden){
    PHONE.ringT-=dt;
    if(PHONE.ringT<=0){PHONE.ringT=2600;PHONE.rings++;Snd.ring();
      const p=toScreen(phonePos().setY(COUNTER_Y+.3));if(!p.behind&&PLAYER.pos.y<1.5)floatText("따르릉!",p.x,p.y,"#ffcc2e",26);
      if(PHONE.rings===1)Talk.say(state.talked.phone1?pick([isMarket()?"또 전화 왔다! 리모델링 회사다. 사장님 전화 책상으로 가자":"또 전화 왔다! 리모델링 회사다. 계산대 전화기를 받자","따르릉! 돈 냄새 맡고 리모델링 회사가 또 전화했어"]):"따르릉! 계산대 위 전화기가 울린다. 리모델링 회사래! 전화기를 눌러서 받아 보자","shock",state.talked.phone1?null:"phone1");
      if(PHONE.rings>=6)PHONE.ringing=false;
    }
    // 수화기가 들썩들썩
    const k=PHONE.ringT>900?Math.sin(now*.08):0;hs.rotation.z=k*.14;hs.position.y=.075+Math.abs(k)*.014;
  }else if(hs.rotation.z){hs.rotation.z=0;hs.position.y=.075}
}
function drawPhoneMark(ctx,now){
  if(!PHONE.ringing||PLAYER.pos.y>1.5)return;   // 2층에서는 1층 전화기 표시가 바닥을 뚫고 보이지 않게
  const p=toScreen(phonePos().setY(COUNTER_Y+.16));if(p.behind)return;
  doodleMood(ctx,p.x,p.y-10,"!",now);
}

// 3D 전화기를 눌렀을 때
function answerPhone(){
  if(state.role!=="owner"){Snd.click();
    Talk.say(pick(["(수화기를 들었다) 여보세요? ...리모델링 회사래. 공사는 사장님만 부를 수 있대. 난 알바지...","전화기다. 옆에 점장님 번호만 잔뜩 적혀 있네. 알바는 참자"]),"sweat");return}
  openPhone();
}

// 리모델링 회사와 통화 (다음 단계 소개 + 전체 단계표)
function openPhone(back){
  if(!$("drawer").hidden){toast("거스름돈부터 건네요!");Snd.errBeep();return}
  if(PHONE.building)return;
  PHONE.ringing=false;Snd.click();
  const t=state.tier||0,nx=nextTier(),th=tierNow();
  const list=STORE_TIERS.slice(1).map((s,i)=>{const lv=i+1;
    return `<li class="${lv<=t?"done":lv===t+1?"next":""}"><span>${lv<=t?"✓ ":""}Lv.${lv} ${esc(s.name)}</span><span>${shortWon(s.cost)}</span></li>`}).join("");
  let body,btn="";
  if(!nx){
    body=`<p class="ph-say">"사장님... 더 키울 데가 없어요. 여기가 모든 우주에서 제일 큰 편의점이에요! 저희 회사도 이제 은퇴합니다 ㅠㅠ"</p>
      <div class="ph-card"><div class="lv">지금 가게 · Lv.${t}</div><h3>${esc(th.name)}</h3><p>리모델링을 끝까지 다 했어요. 최고 단계!</p></div>`;
  }else{
    const can=state.money>=nx.cost,pct=clamp(Math.floor(state.money/nx.cost*100),0,100),busy=GAME.running&&!!GAME.cur;
    const menu=PREMIUM.filter(k=>PRODUCTS[k].tier===t+1);
    const perks=[`음식값: 삼각김밥 ${won(priceOf("kimbap",t))} → <b>${won(priceOf("kimbap",t+1))}</b>`];
    if(t===0)perks.push("<b>슈퍼마켓 변신!</b> 장바구니 손님은 셀프 계산대로, 밖에서 전단지 붙이면 손님 5배");
    if(t+1<=8)perks.push("밤마다 손님 +1명");
    perks.push(...tierPerks(t+1));
    if(menu.length)perks.push(`새 메뉴: <b>${menu.map(k=>esc(PRODUCTS[k].name)).join(", ")}</b> (${won(priceOf(menu[0],t+1))})`);
    if(nx.sky!==th.sky)perks.push(`창밖 풍경: ${SKY_NAME[nx.sky]}`);
    if(nx.pre&&nx.pre!==th.pre)perks.push(`상품 이름 앞에 '${esc(nx.pre.trim())}'`);
    const say=!can?`"졸라 리모델링입니다~ 아직 공사비가 조금 모자라시네요. 돈 모이면 저희가 먼저 전화 드릴게요!"`
      :busy?`"공사비는 충분하신데... 지금 손님 계산 중이시죠? 계산 끝나고 다시 전화 주세요~"`
      :`"네~ 졸라 리모델링입니다! 사장님 통장에 돈 모인 거 저희가 다 알고 전화드렸어요 ^^ 바로 공사 들어갈까요?"`;
    body=`<p class="ph-say">${say}</p>
      <div class="ph-card"><div class="lv">다음 단계 · Lv.${t+1}</div><h3>${esc(nx.name)}</h3><ul>${perks.map(x=>`<li>${x}</li>`).join("")}</ul>
      <div class="ph-cost"><span>공사비</span><b>${won(nx.cost)}</b></div><div class="ph-bar"><i style="width:${pct}%"></i></div><small>통장 ${won(state.money)} · ${pct}%</small></div>`;
    btn=`<button id="phGo" class="btn ${can&&!busy?"pulse":""}" type="button" ${can&&!busy?"":"disabled"}>공사해 주세요!</button>`;
  }
  // 버튼은 카드 바로 아래 (작은 화면에서도 스크롤 없이), 전체 단계표는 그 밑
  openModal(`<div class="phone"><div class="ph-top"><span>☎ 졸라 리모델링 (주)</span><span>지금 Lv.${t}</span></div>
    <div class="ph-scr">${body}<div class="acts"><button id="phClose" class="btn alt" type="button">끊기</button>${btn}</div>
    <ol class="ph-list" id="phList">${list}</ol></div></div>`);
  const L=$("phList"),nxt=L.querySelector(".next");if(nxt)L.scrollTop=Math.max(0,nxt.offsetTop-L.offsetTop-60);
  $("phClose").onclick=()=>{Snd.click();closeModal();if(back)back()};

// 공사: 노랑·검정 가림막이 내려왔다가 올라가면 새 가게
function doRemodel(back){
  const nx=nextTier();if(!nx||state.money<nx.cost||PHONE.building)return;
  PHONE.building=true;PHONE.ringing=false;
  const el=$("build");el.hidden=false;el.style.animation="none";void el.offsetWidth;el.style.animation="";
  $("buildTxt").textContent="뚝딱뚝딱!";Snd.whoosh();

    state.money-=nx.cost;state.tier=(state.tier||0)+1;MISSION.add("remodel");
    PHONE.crowdF=1.5+Math.random()*.5;state.crowdK=(state.crowdK||1)*PHONE.crowdF;   // 손님 1.5~2배

    PREMIUM.filter(k=>PRODUCTS[k].tier===state.tier).forEach(k=>addStock(k,8));stockKeys().filter(k=>!PRODUCTS[k].tier).forEach(k=>addStock(k,6));

// 영수증·사장님 메뉴에서 공사했을 때: 끝나고 한 장 보여 주고 돌아간다

/* ================= 게임용 손 커서 =================
   마우스 화살표 대신 졸라맨 낙서 손이 커서가 된다 (하드웨어 커서라 느린 기기에서도 부드럽다).
   point: 검지 쭉, hover: 누를 수 있는 물건 위 (노란 손), press: 누르는 중, grab: 우클릭으로 둘러보는 중.
   120ms 마다 조금씩 다른 그림으로 바꿔서 1편처럼 선이 끓는다 */
const MOUSE={x:0,y:0,in:false,seen:false,down:false};
const HOVER={h:null,t:0};
const CUR={urls:null,kind:"",boil:-1,on:false};
const CUR_HOT={point:[9,4],hover:[9,4],press:[10,6],grab:[24,24]};
function cursorImg(kind,seed,sc){
  const c=mkCanvas(48*sc,48*sc),x=c.getContext("2d");x.scale(sc,sc);x.lineCap="round";x.lineJoin="round";
  const j=(i,a=.7)=>(seeded(i*5.3+seed*17.9+kind.length*3.1)-.5)*2*a;
  const line=(pts,w,col,s0)=>{x.beginPath();pts.forEach(([px,py],i)=>{const X=px+j(s0+i),Y=py+j(s0+i+20);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle=col;x.lineWidth=w;x.stroke()};
  const circ=(cx,cy,r,fill,s0,lw=3,col=INK)=>{x.beginPath();for(let i=0;i<=12;i++){const a=i/12*TAU,rr=r+j(s0+i%12,.6);x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();if(fill){x.fillStyle=fill;x.fill()}x.strokeStyle=col;x.lineWidth=lw;x.stroke()};
  const palm=kind==="hover"?"#ffcc2e":PAPER;
  if(kind==="grab"){   // 주먹 (오므린 손가락 넷)
    const F=[[-9,-12],[-3,-14],[3,-14],[9,-12]];
    F.forEach(([dx,dy],i)=>line([[24+dx*.6,26+dy*.5],[24+dx,26+dy]],8,"#fff",40+i));
    circ(24,27,12.4,"#fff",61,0,"#fff");
    F.forEach(([dx,dy],i)=>line([[24+dx*.6,26+dy*.5],[24+dx,26+dy]],4.4,INK,40+i));
    circ(24,27,10,palm,60);
    return c.toDataURL("image/png");
  }
  if(kind==="press"){x.translate(9,4);x.scale(.86,.86);x.translate(-9,-4)}   // 손끝을 기준으로 살짝 작아진다
  // 오므린 손가락 셋 (검지 옆으로 짧게) — 손바닥 동그라미 밖으로 살짝
  const stubs=[-1.45,-1.0,-.55].map((a,i)=>[[28+Math.cos(a)*8,30+Math.sin(a)*8],[28+Math.cos(a)*(15-i),30+Math.sin(a)*(15-i)]]);
  // 흰 테두리 (어두운 곳에서도 보이게) → 먹선
  line([[9,4],[22,21]],9,"#fff",1);line([[21,34],[12,39]],9,"#fff",5);stubs.forEach((st,i)=>line(st,8.5,"#fff",70+i));circ(28,30,12.6,"#fff",9,0,"#fff");
  line([[9,4],[22,21]],4.6,INK,1);line([[21,34],[12,39]],4.6,INK,5);stubs.forEach((st,i)=>line(st,4.2,INK,70+i));
  circ(28,30,10.4,palm,9);
  return c.toDataURL("image/png");
}
// 브라우저가 받아 주는 커서 문법을 고른다 (image-set → -webkit-image-set → 그냥 url)
function validCursor(list){const el=document.createElement("div");for(const v of list){el.style.cursor="";el.style.cursor=v;if(el.style.cursor)return v}return ""}
function buildCursors(){
  const out={};CUR.raw={};
  ["point","hover","press","grab"].forEach(k=>{const [hx,hy]=CUR_HOT[k];CUR.raw[k]=[];
    out[k]=[0,1,2].map(seed=>{const u1=cursorImg(k,seed,1),u2=cursorImg(k,seed,2);CUR.raw[k][seed]=u2;
      return validCursor([`image-set(url("${u1}") 1x, url("${u2}") 2x) ${hx} ${hy}, pointer`,`-webkit-image-set(url("${u1}") 1x, url("${u2}") 2x) ${hx} ${hy}, pointer`,`url("${u1}") ${hx} ${hy}, pointer`])})});
  return out;
}
function setCursor(kind){
  if(!CUR.on)return;
  const b=OV.boil%3;if(kind===CUR.kind&&b===CUR.boil)return;CUR.kind=kind;CUR.boil=b;
  const v=CUR.urls[kind]&&CUR.urls[kind][b];if(v)$("app").style.setProperty("--hc",v);
  const raw=CUR.raw&&CUR.raw[kind]&&CUR.raw[kind][b];if(raw)$("swcur").style.backgroundImage=`url("${raw}")`;   // 마우스를 가뒀을 때 그리는 손
  if(ML.on)placeSw();
}
// 처음 마우스가 움직이면 손 커서를 켠다 (터치만 되는 기기는 그대로)
function useHandCursor(){
  if(CUR.on)return;
  try{CUR.urls=buildCursors()}catch(e){return}
  if(!CUR.urls.point[0])return;
  CUR.on=true;$("app").classList.add("handcur");setCursor("point");
}
addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse"||ML.on)return;
  useHandCursor();
  const r=$("gl").getBoundingClientRect();MOUSE.x=e.clientX-r.left;MOUSE.y=e.clientY-r.top;
  MOUSE.in=e.target===$("gl");if(MOUSE.in)MOUSE.seen=true;
},{passive:true});
document.addEventListener("pointerleave",()=>{MOUSE.in=false});
addEventListener("blur",()=>{MOUSE.in=false;MOUSE.down=false});
addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button===0)MOUSE.down=true},true);
addEventListener("pointerup",e=>{if(e.pointerType==="mouse"&&e.button===0)MOUSE.down=false},true);
// 게임 화면에서는 우클릭 메뉴 대신 둘러보기
$("app").addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- 손 옆 안내: 지금 누르면 뭘 하는지 ---------- */
function stepHover(now){
  if(!CUR.on)return;
  if(Scr.name!=="game"||!MOUSE.in||!canMove()||LOOK.on){HOVER.h=null;setCursor(LOOK.on?"grab":MOUSE.down?"press":ML.on&&overBtn()?"hover":"point");return}
  if(now-HOVER.t>90){HOVER.t=now;scene.updateMatrixWorld();HOVER.h=pickAt(MOUSE.x,MOUSE.y,false)}
  const h=HOVER.h;setCursor(MOUSE.down?"press":h&&h.ok&&h.label?"hover":"point");
}
function drawHoverLabel(ctx){
  const h=HOVER.h;if(!CUR.on||!h||!h.label||!MOUSE.in||LOOK.on)return;
  const txt=h.ok?h.label:`${h.label} · ${h.short}`,px=15;
  ctx.font=`${px}px ${FONT_D}`;const w=ctx.measureText(txt).width+18,x=clamp(MOUSE.x+30,8,OV.W-w-8),y=clamp(MOUSE.y+40,20,OV.H-20);
  ctx.save();ctx.fillStyle=h.ok?"#ffcc2e":"rgba(28,30,42,.88)";ctx.strokeStyle=h.ok?INK:"rgba(255,255,255,.5)";ctx.lineWidth=2.5;
  rr(ctx,x,y-14,w,28,10);ctx.fill();ctx.stroke();rawText(ctx,txt,x+w/2,y,px,h.ok?INK:"#fff");ctx.restore();
}


/* ================= 테이블 옆 전자레인지 =================
   먹고 가는 손님이 가끔 "전자레인지 좀 돌려 주세요~" 한다.
   테이블의 음식 누르기(집기) → 전자레인지 누르기(넣고 돌리기) → 띵! → 다시 눌러 꺼내기 → 손님 자리 누르기(갖다 주기) */
const MW={carry:null,inside:null,state:"idle",serveHit:null};   // carry/inside: {obj, C, hot}
const CARRY_POS=V3(.19,-.26,-.5);
const HEATABLE=k=>{const P=PRODUCTS[k];return !!(P&&(P.heat||P.kind==="kimbap"||P.kind==="dosirak"))};
function resetMicro(){
  if(MW.carry&&MW.carry.obj.parent)MW.carry.obj.parent.remove(MW.carry.obj);
  if(MW.inside&&MW.inside.obj.parent)MW.inside.obj.parent.remove(MW.inside.obj);
  MW.carry=null;MW.inside=null;MW.state="idle";Snd.hum(false);if(W3.microLight)W3.microLight.emissiveIntensity=0;
}
// 앉은 손님이 가끔 데워 달라고 한다 (sitDown 에서)
function maybeAskHeat(C){
  if(GAME.tut||!C.food||!HEATABLE(C.eatKey))return;
  const first=GAME.night&&!GAME.night.heatAsked;if(!first&&Math.random()>.75)return;
  if(GAME.night)GAME.night.heatAsked=true;
  C.heatReq=true;C.heatTaken=false;C.heatPatMax=C.heatPat=70;
  sayC(C,pick(["저기요~ 이거 전자레인지 좀 돌려 주세요!","전자레인지 좀 부탁해요~ 차가워요 ㅠㅠ","이거 데워 주실 수 있어요?"]));
  C.heatHit=hitBoxAt(C.food,[.34,.26,.34],[0,.08,0],"heatTake");C.heatHit.userData.cust=C;
  Snd.chime();
  if(robotAge()){Talk.say("전자레인지 로봇이 알아서 데워 준다! 나는 다른 일 하자","happy","robot1");return}
  Talk.say(state.talked.micro1?pick(["또 데워 달래! 테이블로 출동","전자레인지 손님이다. 음식 집어서 전자레인지로!"]):
    "손님이 전자레인지 돌려 달래! 테이블 음식을 누르면 집고, 테이블 옆 전자레인지를 누르면 데워져. 띵! 하면 꺼내서 손님 자리를 눌러 갖다 주기","wink",state.talked.micro1?null:"micro1");
}
// 데워 달라는 손님: 기다리는 동안은 안 먹는다. 너무 오래 걸리면 포기하거나 화낸다
function stepHeatWait(C,dt,now){
  if(!C.heatReq)return false;
  C.heatPat-=dt/1000*(C.heatTaken?.6:1);
  const r=C.heatPat/C.heatPatMax;
  setPose(C.obj,"sit",now/1000,r<.3?"angry":r<.6?"sad":"happy",{sitY:-.46*DP_PX,sweat:r<.6},"sitw"+(r<.6?1:0));
  if(C.heatPat>0)return true;
  C.heatReq=false;
  if(C.heatTaken){   // 음식을 가져가 놓고 안 돌려줬다
    sayC(C,"제 음식 어디 갔어요?!","angry");Snd.angry();GAME.night.angry++;state.rating=clamp(state.rating-.15,1,5);
    if(MW.carry&&MW.carry.C===C){MW.carry.obj.parent&&MW.carry.obj.parent.remove(MW.carry.obj);MW.carry=null;HANDS.R.follow=null;HANDS.rest("R")}
    if(MW.inside&&MW.inside.C===C){MW.inside.obj.parent&&MW.inside.obj.parent.remove(MW.inside.obj);MW.inside=null;if(MW.state==="done")MW.state="idle";else MW.orphan=true}
    leaveSeat(C);
  }else{
    sayC(C,"에이... 그냥 차갑게 먹을게요","angry");state.rating=clamp(state.rating-.05,1,5);
    if(C.heatHit){C.heatHit.parent&&C.heatHit.parent.remove(C.heatHit);C.heatHit=null}
  }
  return true;
}
function leaveSeat(C){
  const s=C.seat;if(s){s.by=null;C.path=s.out.map(([x,z])=>V3(x,0,z))}else C.path=[];
  C.path.push(SPOT.door.clone(),SPOT.outside.clone().setX((Math.random()-.5)*4));
  C.seat=null;C.food=null;C.state="leave";C.obj.position.y=0;setPose(C.obj,"stand",0,"angry");
}
// 들고 다니기: 카메라 앞(화면 오른쪽 아래)에 붙인다
function carryObj(f){if(f.parent)f.parent.remove(f);camera.add(f);f.visible=true;f.position.copy(CARRY_POS);f.rotation.set(.35,.5,0);f.scale.setScalar(.8)}
function uncarry(f){const wp=V3(0,0,0);f.getWorldPosition(wp);camera.remove(f);scene.add(f);f.position.copy(wp);f.rotation.set(0,0,0);f.scale.setScalar(1)}
async function takeFood(C){
  if(!C.heatReq||C.heatTaken||!C.food)return;
  if(MW.carry){toast("손이 모자라요! 들고 있는 것부터 처리해요");Snd.errBeep();return}
  GAME.busy=true;const f=C.food;
  if(C.heatHit){f.remove(C.heatHit);C.heatHit=null}
  HANDS.hold("R",f,[12,6],"grab");await sleep(150);
  carryObj(f);C.heatTaken=true;C.food=null;MW.carry={obj:f,C,hot:false};
  sayC(C,"네~ 기다릴게요!");Snd.bag();
  HANDS.hold("R",f,[10,8],"grab");GAME.busy=false;
  if(!state.talked.micro2)Talk.say("음식 들었다! 테이블 옆 전자레인지를 누르자","happy","micro2");
}
async function serveFood(){
  const it=MW.carry;if(!it||!it.hot)return;const C=it.C,f=it.obj;
  if(!C.seat||C.state!=="eating"){camera.remove(f);MW.carry=null;HANDS.R.follow=null;HANDS.rest("R");toast("손님이 이미 가 버렸어요...");return}
  GAME.busy=true;uncarry(f);HANDS.hold("R",f,[12,6],"grab");
  await tween(f,seatFood(C.seat),420,{lift:.12});f.rotation.y=C.seat.ry+Math.PI;
  C.food=f;C.hot=true;C.heatReq=false;C.heatTaken=false;C.heatPat=0;   // 기다리기 끝 → 이제 먹는다 (게이지도 사라진다)
  MW.carry=null;HANDS.R.follow=null;HANDS.rest("R");GAME.busy=false;
  sayC(C,pick(["감사합니다! 따끈따끈~","와 뜨끈하다! 최고예요","역시 데워 먹어야 제맛이지~"]),"love");
  let tip=randInt(3,8)*100*moneyScale();if(state.role==="owner")tip=earnUp(tip);GAME.night.tips+=tip;GAME.night.heat=(GAME.night.heat||0)+1;MISSION.add("heat");state.rating=clamp(state.rating+.05*satMult(),1,5);
  const s=toScreen(f.position);floatText(`팁 +${won(tip)}`,s.x,s.y-50,"#ffcc2e",24);Snd.coin();Snd.happy();
  C.eatT=Math.max(C.eatT,9000);
}
// 전자레인지 누르기: 넣고 돌리기 / 꺼내기 / (빈 채로 돌리기 개그)
async function useMicro(){
  const mp=machinePos("micro"),ms=toScreen(mp);
  if(MW.state==="running"){toast("데우는 중! 띵 할 때까지 기다려요");return}
  if(MW.state==="done"&&MW.inside){
    if(MW.carry){toast("손이 모자라요! 들고 있는 것부터 처리해요");Snd.errBeep();return}
    GAME.busy=true;const f=MW.inside.obj;f.visible=true;f.position.copy(mp);
    HANDS.hold("R",f,[12,6],"grab");await sleep(160);
    carryObj(f);MW.carry={obj:f,C:MW.inside.C,hot:true};MW.inside=null;MW.state="idle";
    floatText("앗 뜨거! 모락모락~",ms.x,ms.y-40,"#fff",22);Snd.happy();
    HANDS.hold("R",f,[10,8],"grab");GAME.busy=false;
    if(!state.talked.micro3)Talk.say("뜨끈하다! 이제 손님 자리를 눌러서 갖다 주자","wink","micro3");
    return;
  }
  if(MW.carry&&MW.carry.hot){toast("이미 데웠어요! 손님한테 갖다 줘요");return}
  if(MW.carry){
    GAME.busy=true;const it=MW.carry,f=it.obj;uncarry(f);
    HANDS.hold("R",f,[16,6],"grab");
    await tween(f,mp,380,{lift:.1});f.visible=false;
    MW.inside={obj:f,C:it.C};MW.carry=null;MW.state="running";MW.orphan=false;
    HANDS.R.follow=null;HANDS.go("R",ms.x,ms.y,"point",.3);await sleep(220);
    Snd.hum(true);W3.microLight.emissiveIntensity=1.3;floatText("위이이잉~",ms.x,ms.y-40,"#fff",20);
    HANDS.rest("R");GAME.busy=false;
    sleep(3200).then(()=>{if(MW.state!=="running")return;Snd.hum(false);W3.microLight.emissiveIntensity=0;Snd.ding();
      const s=toScreen(machinePos("micro"));floatText("띵!",s.x,s.y-40,"#ffcc2e",30);
      if(MW.orphan||!MW.inside){MW.state="idle";MW.inside=null;return}
      MW.state="done";if(!state.talked.micro4)Talk.say("띵! 다 데워졌다. 전자레인지를 눌러서 꺼내자","happy","micro4")});
    return;
  }
  GAME.busy=true;HANDS.go("R",ms.x,ms.y,"point",.25);await sleep(300);
  Snd.hum(true);W3.microLight.emissiveIntensity=1.2;await sleep(900);Snd.hum(false);W3.microLight.emissiveIntensity=0;Snd.ding();
  HANDS.rest("R");GAME.busy=false;
  Talk.say(pick(["(빈 전자레인지를 돌렸다... 왜 그랬지?)","(전자레인지 안에 아무것도 없다. 내 손을 데울 뻔했다)"]),"sweat");
}
// 누를 거리 (pickAt 에 더해진다)
function microHits(cands){
  CUST.forEach(C=>{if(C.heatHit&&C.heatReq&&!C.heatTaken)cands.push(C.heatHit)});
  if(MW.carry&&MW.carry.hot&&MW.carry.C.seat){
    if(!MW.serveHit){MW.serveHit=new T.Mesh(box(.9,1.3,.9),HIT_MAT);MW.serveHit.userData.act="heatServe";scene.add(MW.serveHit)}
    const s=MW.carry.C.seat,p=seatFood(s);MW.serveHit.position.set((s.x+p.x)/2,.65,(s.z+p.z)/2);MW.serveHit.updateMatrixWorld();cands.push(MW.serveHit);
  }
}
function microLabel(H){
  if(H.act==="heatTake"){const C=H.target.userData.cust;H.label="음식 집기 (데우기)";if(PLAYER.dist(C.obj.position)>REACH+.4){H.ok=false;H.why="너무 멀어요! 테이블 가까이 가서 눌러요";H.short="더 가까이"}return true}
  if(H.act==="heatServe"){H.label="갖다 주기";if(PLAYER.dist(MW.serveHit.position)>REACH+.3){H.ok=false;H.why="너무 멀어요! 손님 자리 가까이 가요";H.short="더 가까이"}return true}
  if(H.act==="m:micro"){H.label=MW.state==="done"?"꺼내기":MW.carry&&!MW.carry.hot?"넣고 돌리기":MW.state==="running"?"데우는 중...":"전자레인지"}
  return false;
}
function microAct(H){
  if(H.act==="heatTake"){const C=H.target.userData.cust;queueAct(()=>takeFood(C));return true}
  if(H.act==="heatServe"){queueAct(serveFood);return true}
  return false;
}
// 표시: 데워 달라는 손님, 다 된 전자레인지, 갖다 줄 자리
function drawHeatMarks(ctx,t){
  const tag=(p,str,col)=>{if(p.behind)return;doodleMood(ctx,p.x,p.y,"!",t);outlinedText(ctx,str,p.x,p.y-34,15,col,INK,4)};
  CUST.forEach(C=>{if(!C.heatReq||C.heatTaken)return;const p=toScreen(C.obj.position.clone().setY(1.55));const d=PLAYER.dist(C.obj.position);
    tag(p,d<=REACH+.4?"음식 눌러서 집기":"데워 주세요!","#ff9f6a")});
  if(MW.state==="done")tag(toScreen(machinePos("micro").setY(COUNTER_Y+.55)),"띵! 꺼내기","#ffcc2e");
  if(MW.carry&&!MW.carry.hot)tag(toScreen(machinePos("micro").setY(COUNTER_Y+.55)),"여기에 넣기","#7cc8ff");
  if(MW.carry&&MW.carry.hot&&MW.carry.C.seat){const s=MW.carry.C.seat;tag(toScreen(V3(s.x,1.55,s.z)),"여기 갖다 주기","#8ff7b5")}
}


/* ================= 졸팡 (내 폰 쇼핑 앱) =================
   상품마다 재고가 있다. 재고가 0 이면 손님이 못 사고 실망한다 (평점 -).
   폰(📱, J 키)으로 '졸팡'에 들어가 상품을 담아 주문하면 졸라배송 기사님이 문 앞에 박스를 두고 간다.
   박스를 눌러 뜯어야 재고가 채워진다. 알바 때는 점장님 법인카드(공짜), 사장님이 되면 내 돈 (도매가 = 판매가의 3분의 1쯤) */
const STOCK_MAX=99;
const JP_EMOJI={kimbap:"🍙",cup:"🍜",can:"🥤",bottle:"💧",chips:"🍟",carton:"🥛",bar:"🍫",gum:"🍬",dosirak:"🍱",icecream:"🍦",coffee:"☕"};
const JP={cart:{},meshes:{},couriers:[],warned:{},arrow:false,seq:0};
const BOX_SPOTS=[[1.12,-6.82,0],[1.58,-6.82,0],[1.12,-6.82,1],[1.58,-6.82,1],[1.35,-6.4,0],[1.35,-6.4,1]];
const stocked=k=>SHELF_ITEMS.includes(k)||PREMIUM.includes(k);
const stockKeys=()=>SHELF_ITEMS.filter(k=>!PRODUCTS[k].unlock||hasUp(PRODUCTS[k].unlock)).concat(PREMIUM.filter(k=>PRODUCTS[k].tier<=(state.tier||0)));
const stockOf=k=>(state.stock&&state.stock[k])||0;
// 도매가: 판매가의 35% (돈 단위에 맞춰 반올림)
function costOf(k){const u=10*moneyScale();return Math.max(u,Math.round(priceOf(k)*.35/u)*u)}
function addStock(k,n){state.stock=state.stock||{};state.stock[k]=clamp(stockOf(k)+n,0,STOCK_MAX)}
// 손님이 하나 집어 간다. 없으면 false
function takeStock(k){
  if(!stocked(k))return true;
  if(stockOf(k)<=0)return false;
  state.stock[k]--;
  if(state.stock[k]===0&&!JP.warned[k]&&GAME.running){JP.warned[k]=1;
    setTimeout(()=>{toast(`${nameOf(k)} 품절! 📱 졸팡에서 주문하자`);if(!state.talked.jp_tut)jolpangTutorial();else Talk.say("앗, 품절 나왔다! 위 📱 졸팡에서 주문해야 해","sweat","jp_out1")},900)}
  return true;
}
const soldOutCount=()=>stockKeys().filter(k=>stockOf(k)<=0).length;
// 재고가 모자라면(15개보다 적으면) 15개까지 채우는 만큼
const needOf=k=>Math.max(0,(isMarket()?40:15)-stockOf(k)-(JP.cart[k]||0)-pendingOf(k));
const pendingOf=k=>(state.boxes||[]).reduce((s,b)=>s+(b.items[k]||0),0);
const cartCount=()=>Object.values(JP.cart).reduce((a,b)=>a+b,0);
const cartTotal=()=>Object.entries(JP.cart).reduce((s,[k,n])=>s+costOf(k)*n,0);
const creditLimit=()=>runCost()*3;   // 사장님은 운영비 사흘치만큼 외상 가능

/* ---------- 앱 화면 ---------- */
function openJolpang(back){
  if(!$("drawer").hidden){toast("거스름돈부터 건네요!");Snd.errBeep();return}
  if(PHONE.building)return;
  Snd.wake();Snd.tone(1320,.06,"sine",.05);Snd.tone(1760,.08,"sine",.04,.07);
  const first=!state.talked.jp_open;state.talked.jp_open=1;JP.arrow=false;
  const alba=state.role!=="owner";
  const rows=stockKeys().map(k=>{const s=stockOf(k),p=pendingOf(k);
    return `<div class="jp-row" data-k="${k}"><span class="jp-ic">${JP_EMOJI[PRODUCTS[k].kind]||"📦"}</span>
      <div class="jp-nm"><b>${esc(nameOf(k))}</b><small class="${s===0?"out":s<5?"low":""}">재고 ${s}개${s===0?" · 품절!":""}${p?` · 배송 중 ${p}`:""} · 개당 ${won(costOf(k))}</small></div>
      <div class="jp-q"><button type="button" data-n="-5" aria-label="5개 빼기">−</button><b>${JP.cart[k]||0}</b><button type="button" data-n="5">+5</button><button type="button" data-n="10">+10</button></div></div>`}).join("");
  openModal(`<div class="jp">
    <div class="jp-top"><span>${GAME.clockText()}</span><span>📶 🔋78%</span></div>
    <div class="jp-head"><b class="jp-logo"><i>졸</i><i>팡</i></b><span class="jp-rocket">🚀 졸라배송 · 주문하면 금방 문 앞 도착</span></div>
    <div class="jp-banner">${first?"<b>처음이지?</b> '부족한 거 담기' → '주문하기' 끝! ":""}${alba?"결제는 점장님 법인카드 (공짜!)":`도매가 = 판매가의 1/3쯤 · 통장 ${won(state.money)}`}</div>
    <div class="jp-tools"><button id="jpAuto" class="btn sm ${first?"pulse":""}" type="button">부족한 거 담기</button><button id="jpClear" class="btn alt sm" type="button">비우기</button></div>
    <div class="jp-list" id="jpList">${rows}</div>
    <div class="jp-cart"><div class="jp-sum"><small>장바구니</small><b id="jpSum"></b><small id="jpWhy"></small></div>
      <div class="acts"><button id="jpClose" class="btn alt sm" type="button">닫기</button><button id="jpBuy" class="btn sm" type="button">주문하기</button></div></div>
  </div>`);
  const refresh=()=>{
    $("dialog").querySelectorAll(".jp-row").forEach(r=>{r.querySelector(".jp-q b").textContent=JP.cart[r.dataset.k]||0});
    const n=cartCount(),t=cartTotal(),ok=n>0&&(alba||state.money-t>=-creditLimit());
    $("jpSum").textContent=`${n}개 · ${alba?"₩0 (법인카드)":won(t)}`;
    $("jpWhy").textContent=!n?"":alba?"":state.money-t>=0?"":ok?"외상으로 사요 (내일 갚기)":"돈이 모자라요!";
    $("jpBuy").disabled=!ok;$("jpBuy").classList.toggle("pulse",ok);
  };
  $("dialog").querySelectorAll(".jp-q button").forEach(b=>b.onclick=()=>{const k=b.closest(".jp-row").dataset.k,n=+b.dataset.n;
    JP.cart[k]=clamp((JP.cart[k]||0)+n,0,Math.max(0,STOCK_MAX-stockOf(k)-pendingOf(k)));if(!JP.cart[k])delete JP.cart[k];Snd.click();refresh()});
  $("jpAuto").onclick=()=>{stockKeys().forEach(k=>{const n=needOf(k);if(n>0)JP.cart[k]=(JP.cart[k]||0)+Math.ceil(n/5)*5});Snd.coin();refresh()};
  $("jpClear").onclick=()=>{JP.cart={};Snd.click();refresh()};
  $("jpClose").onclick=()=>{Snd.click();closeModal();if(back)back()};
  $("jpBuy").onclick=()=>placeOrder(back);
  refresh();
}
function placeOrder(back){
  const n=cartCount(),total=cartTotal(),alba=state.role!=="owner";if(!n)return;
  if(!alba&&state.money-total<-creditLimit()){toast("돈이 모자라요!");Snd.errBeep();return}
  if(!alba){state.money-=total;if(GAME.night)GAME.night.orders=(GAME.night.orders||0)+total}
  const b={id:++JP.seq+"-"+Date.now(),items:{...JP.cart},arrived:false};JP.cart={};
  (state.boxes=state.boxes||[]).push(b);save();updateHud();
  Snd.coin();Snd.tone(988,.08,"triangle",.05,.1);closeModal();
  toast(`주문 완료! 졸라배송 출발~ (${n}개)`);
  if(GAME.running){sleep(6500+Math.random()*3500).then(()=>sendCourier(b))}
  else{b.arrived=true;save()}                                       // 밤이 아니면 다음 밤 시작할 때 문 앞에 있다
  if(!state.talked.jp_ord1)setTimeout(()=>Talk.say("주문 완료! 곧 기사님이 온대. 문 앞에 박스를 두고 가면 눌러서 뜯자","wink","jp_ord1"),700);
  if(back)back();
}

/* ---------- 졸라배송 기사님 (낙서) ---------- */
function sendCourier(b){
  if(!GAME.running||b.arrived)return;
  const g=makeDoodlePerson({shirt:"#1f5fd1",hat:"cap",hatColor:"#e2483d",item:"box"});g.position.set(.25,0,-9.6);scene.add(g);
  const spot=boxSpot(openBoxes().length);
  const mk=isMarket(),path=mk?[V3(.1,0,-7.9),V3(0,0,ROW_F),V3(0,0,2.6),V3(spot[0],0,spot[1]-.45)]:[V3(.1,0,-7.9),V3(spot[0]-.45,0,spot[1]+.1)];
  JP.couriers.push({obj:g,b,path,back:mk?[V3(0,0,2.6),V3(0,0,ROW_F),V3(.1,0,-7.9),V3(.6,0,-9.8)]:[V3(.1,0,-7.9),V3(.6,0,-9.8)],dropped:false,phase:0});
}
function stepCouriers(dt){
  for(let i=JP.couriers.length-1;i>=0;i--){const c=JP.couriers[i],o=c.obj,p=c.path[0];
    if(!p){scene.remove(o);JP.couriers.splice(i,1);continue}
    const dx=p.x-o.position.x,dz=p.z-o.position.z,d=Math.hypot(dx,dz),sp=2.6*dt/1000;
    if(d<.05){c.path.shift();
      if(!c.path.length&&!c.dropped){c.dropped=true;o.userData.dp.look={...o.userData.dp.look,item:null};dropBox(c.b);
        const s=toScreen(o.position.clone().setY(1.9));if(!s.behind)floatText("졸팡이요~! 문 앞에 두고 가요!",s.x,s.y,"#fff",20);
        c.path=c.back}}
    else{o.position.x+=dx/d*Math.min(d,sp);o.position.z+=dz/d*Math.min(d,sp);o.rotation.y=Math.atan2(dx,dz)}
    c.phase+=dt*.024;setPose(o,d<.05?"stand":"run",c.phase,"happy");
  }
}
function flushCouriers(){JP.couriers.forEach(c=>{scene.remove(c.obj);if(!c.dropped)c.b.arrived=true});JP.couriers=[];(state.boxes||[]).forEach(b=>b.arrived=true)}

/* ---------- 문 앞 박스 ---------- */
const openBoxes=()=>(state.boxes||[]).filter(b=>b.arrived);
const boxSpot=i=>(isMarket()?WH_SPOTS:BOX_SPOTS)[i%BOX_SPOTS.length];
function boxMesh(){
  const side=tex("jpbox",256,192,(x,w,h)=>{x.fillStyle="#b8864f";x.fillRect(0,0,w,h);x.fillStyle="rgba(90,55,20,.25)";for(let i=0;i<60;i++)x.fillRect(Math.random()*w,Math.random()*h,3,1);
    x.fillStyle="#fff";x.fillRect(38,50,180,92);x.strokeStyle="#16141d";x.lineWidth=5;x.strokeRect(38,50,180,92);
    tx(x,"졸",98,88,58,"#e2483d");tx(x,"팡",158,88,58,"#1f5fd1");tx(x,"졸라배송",128,128,22,"#16141d",{font:FJ})});
  const top=tex("jpboxtop",128,128,(x,w,h)=>{x.fillStyle="#b8864f";x.fillRect(0,0,w,h);x.fillStyle="rgba(220,200,140,.85)";x.fillRect(0,52,w,24);x.fillStyle="#1f5fd1";x.font=`bold 16px ${FJ}`;x.textAlign="center";x.fillText("졸팡 졸팡 졸팡",64,69)});
  const sm=new T.MeshStandardMaterial({map:side,roughness:.85}),tm=new T.MeshStandardMaterial({map:top,roughness:.85}),bm=mStd(0x9a6d3c,.9);
  const m=new T.Mesh(box(.42,.34,.36),[sm,sm,tm,bm,sm,sm]);m.castShadow=true;m.receiveShadow=true;
  return m;
}
function dropBox(b){
  b.arrived=true;save();syncBoxes();Snd.thud();
  const m=JP.meshes[b.id];if(m){const y=m.position.y;m.position.y=y+.6;tween(m,m.position.clone().setY(y),260)}
  if(autoShelf())Talk.say("졸팡 박스가 창고에 왔다! 자동 진열 기계가 1초에 30개씩 알아서 진열한대","wink");
  else if(isMarket())Talk.say(state.talked.jp_box2?"창고에 졸팡 박스 도착!":"졸팡 박스는 이제 창고로 온대! 가게 뒤쪽 창고에서 박스를 눌러 뜯자","wink",state.talked.jp_box2?null:"jp_box2");
  else if(!state.talked.jp_box1)Talk.say("졸팡 박스 도착! 입구 쪽 박스를 눌러서 뜯자. 그래야 재고가 채워져","wink","jp_box1");
}
function syncBoxes(){
  const list=openBoxes(),ids={};
  list.forEach((b,i)=>{ids[b.id]=1;let m=JP.meshes[b.id];
    if(!m){m=boxMesh();const h=new T.Mesh(box(.5,.44,.44),HIT_MAT);h.userData.act="jpBox";h.userData.box=b;m.add(h);m.userData.hit=h;scene.add(m);JP.meshes[b.id]=m}
    const [x,z,up]=boxSpot(i);m.position.set(x,.17+up*.345,z);m.rotation.y=(i%2?.12:-.08)});
  Object.keys(JP.meshes).forEach(id=>{if(!ids[id]){scene.remove(JP.meshes[id]);delete JP.meshes[id]}});
}
async function openBox(b){
  const m=JP.meshes[b.id];if(!m||!(state.boxes||[]).includes(b))return;
  GAME.busy=true;const p=toScreen(m.position.clone().setY(m.position.y+.2));
  HANDS.go("R",p.x+30,p.y,"grab",.3);HANDS.go("L",p.x-40,p.y+10,"grab",.3);await sleep(260);
  Snd.noiseHit(2500,.25,.12,"highpass");floatText("쫘아악~",p.x,p.y-40,"#fff",22);
  for(let i=0;i<3;i++){m.rotation.z=(i%2?.08:-.08);await sleep(90)}m.rotation.z=0;
  // 상품이 튀어나와 진열대로 날아간다
  const keys=Object.keys(b.items);
  for(let i=0;i<Math.min(6,keys.length);i++){const it=makeProduct(keys[i]);it.position.copy(m.position).setY(m.position.y+.2);scene.add(it);
    const to=V3((Math.random()-.5)*3,1.1+Math.random()*.4,-3-Math.random()*3);tween(it,to,520+i*60,{lift:.5,scale:.4}).then(()=>scene.remove(it));Snd.tone(900+i*80,.05,"triangle",.04,i*.05)}
  let n=0;keys.forEach(k=>{addStock(k,b.items[k]);n+=b.items[k];JP.warned[k]=0});
  state.boxes=state.boxes.filter(x=>x!==b);syncBoxes();save();updateHud();
  floatText(`재고 +${n}개!`,p.x,p.y-70,"#8ff7b5",26);Snd.happy();MISSION.add("boxes");
  HANDS.rest("R");HANDS.rest("L");GAME.busy=false;
  if(!state.talked.jp_unpack1)Talk.say("재고 채움 완료! 이제 손님이 다시 살 수 있어. 폰 버튼 빨간 숫자는 품절 개수야","happy","jp_unpack1");
}
function boxHits(cands){Object.values(JP.meshes).forEach(m=>cands.push(m.userData.hit))}
function boxLabel(H){
  if(H.act!=="jpBox")return false;const b=H.target.userData.box,n=Object.values(b.items).reduce((a,c)=>a+c,0);
  H.label=`박스 뜯기 (재고 +${n})`;const m=JP.meshes[b.id];
  if(m&&PLAYER.dist(m.position)>REACH){H.ok=false;H.why="너무 멀어요! 박스 가까이 가서 눌러요";H.short="더 가까이"}
  return true;
}
function boxAct(H){if(H.act!=="jpBox")return false;const b=H.target.userData.box;queueAct(()=>openBox(b));return true}
function drawBoxMarks(ctx,t){
  const list=openBoxes();if(!list.length)return;const m=JP.meshes[list[0].id];if(!m)return;
  const p=toScreen(m.position.clone().setY(m.position.y+.45));if(p.behind)return;
  doodleMood(ctx,p.x,p.y,"!",t);const d=PLAYER.dist(m.position);
  outlinedText(ctx,d<=REACH?"눌러서 박스 뜯기":`졸팡 박스 ${list.length}개`,p.x,p.y-34,15,"#8fd3ff",INK,4);
}

/* ---------- 밤마다 ---------- */
function jolpangNight(){
  JP.warned={};flushCouriers();syncBoxes();
  // 사장님이 돈도 재고도 다 떨어졌으면: 섬에 간 전 점장님이 구호 물자를 보낸다 (막힘 방지)
  const basics=SHELF_ITEMS.filter(k=>!PRODUCTS[k].unlock);
  if(state.role==="owner"&&basics.reduce((s,k)=>s+stockOf(k),0)<8&&!openBoxes().length&&state.money<costOf("kimbap")*20){
    const items={};basics.forEach(k=>items[k]=6);(state.boxes=state.boxes||[]).push({id:"aid-"+Date.now(),items,arrived:true});syncBoxes();save();
    setTimeout(()=>Talk.say("(문 앞에 박스가 있다) '섬에서 유리병 택배로 보냄. 굶지 말고 10자 모아요 -전 점장' ...점장님!! 코코넛도 들어 있어","shock"),1800);
  }
  // 사장님이 되면 (사장 첫날은 "사장 첫날!" 한마디를 다 보고 나서) 섬에 간 전 점장님의 구조 요청 문자 → 졸팡 안내
  const later=()=>{if(state.night>=2&&!state.talked.jp_tut)jolpangTutorial();else if(state.talked.jp_tut&&!state.talked.jp_open)JP.arrow=true};
  if(state.role==="owner"&&!state.rescue)setTimeout(()=>{if(GAME.running&&!Talk.story)rescueStory(later)},state.night===2?7200:2600);
  else if(state.night>=2&&!state.talked.jp_tut)setTimeout(()=>{if(GAME.running&&!Talk.story)jolpangTutorial()},2600);
  else if(state.talked.jp_tut&&!state.talked.jp_open)JP.arrow=true;
}

    {text:"그러면 졸라배송 기사님이 문 앞에 박스를 두고 가. 박스를 눌러서 뜯어야 재고가 채워져!",mood:"wink"},
    {text:"재고가 0개면 손님이 못 사고 실망해. 📱 버튼에 빨간 숫자가 뜨면 품절이 있다는 뜻이야",mood:"sweat"}

/* ================= 미션 (M 키 · 🎯 버튼) =================
   메인 미션: 섬에 갇힌 전 점장님 구하기. ₩10자짜리 배를 타고 들어가야 한다.

const RESCUE_COST=1e25;                 // 10자 = 1 뒤에 0이 25개
const BOSS_LOOK={shirt:"#2f9d4a",apron:"#2c6fd6",hair3:true,specs:true};
const SUB_POOL=[
  {k:"served",  t:n=>`손님 ${n}명 계산하기`,             g:[8,15,25,40],r:6000},
  {k:"heat",    t:n=>`전자레인지로 ${n}번 데워 드리기`,    g:[1,3,5,8],  r:9000},
  {k:"coffee",  t:n=>`커피 ${n}잔 초록 선에 딱 맞추기`,     g:[2,3,5,8],  r:9000, need:"coffee"},
  {k:"icecream",t:n=>`아이스크림 ${n}개 꺼내 주기`,        g:[2,4,6,10], r:8000, need:"freezer"},
  {k:"restock", t:n=>`진열대 빈 칸 ${n}번 채우기`,         g:[3,5,8,12], r:7000},
  {k:"clean",   t:n=>`쏟은 음료 ${n}번 닦기`,              g:[2,3,5,8],  r:7000},
  {k:"trash",   t:n=>`테이블 쓰레기 ${n}번 치우기`,        g:[2,3,5,8],  r:7000},
  {k:"tips",    t:n=>`팁 ${n}번 받기`,                    g:[3,5,8,12], r:8000},
  {k:"boxes",   t:n=>`졸팡 박스 ${n}개 뜯기`,              g:[1,2,3,5],  r:6000},
  {k:"calm",    t:n=>n>1?`화난 손님 없는 밤 ${n}번`:"화난 손님 없이 하룻밤 보내기", g:[1,2,3],r:15000},
  {k:"snight",  t:n=>n>1?`S등급 밤 ${n}번`:"S등급으로 하룻밤 끝내기",             g:[1,2],  r:20000},
  {k:"ups",     t:()=>"사장님 메뉴에서 설비 하나 사기",     g:[1],        r:8000,  ok:()=>UPGRADES.some(u=>!hasUp(u.id))},
  {k:"grill",   t:n=>`핫바 ${n}개 황금빛으로 굽기`,       g:[2,3,5,8],  r:9000, need:"grill"},
  {k:"icepick", t:n=>`아이스크림 맛 ${n}번 맞히기`,        g:[2,3,5,8],  r:9000, need:"freezer"},
  {k:"fly",     t:n=>`파리 ${n}마리 잡기`,                 g:[1,2,3],    r:10000},
  {k:"flyer",   t:n=>`전단지 ${n}장 붙이기`,                g:[3,6,10],   r:8000, ok:()=>isMarket()},
  {k:"hm",      t:n=>`노숙자 아저씨 바구니 ${n}번 받기`,     g:[1,2,3],    r:8000, need:"homeless"},
  {k:"remodel", t:()=>"☎ 리모델링 한 번 하기",             g:[1],        r:25000, ok:()=>(state.tier||0)<MAX_TIER}
];
const MISSION={
  get open(){return !!$("dialog").querySelector(".missions")},
  st(){return state.mstat||(state.mstat={})},
  get(k){return this.st()[k]||0},
  add(k,n=1){const m=this.st();m[k]=(m[k]||0)+n;this.check()},
  data(){return state.mis||(state.mis={subs:[],lv:{},done:0})},
  // 새 서브 미션 하나 (지금 있는 것과 안 겹치게)
  pickSub(){
    const D=this.data(),have=D.subs.map(s=>s.k);
    const list=SUB_POOL.filter(p=>!have.includes(p.k)&&(!p.need||hasUp(p.need))&&(!p.ok||p.ok()));
    if(!list.length)return null;
    const p=pick(list),lv=Math.min(D.lv[p.k]||0,p.g.length-1);
    return {k:p.k,goal:p.g[lv],start:this.get(p.k)};
  },
  fill(){const D=this.data();while(D.subs.length<3){const s=this.pickSub();if(!s)break;D.subs.push(s)}},
  prog(s){return clamp(this.get(s.k)-s.start,0,s.goal)},
  reward(s){const p=SUB_POOL.find(x=>x.k===s.k);return Math.round(p.r*EARN*(1+.5*Math.min(3,this.data().lv[s.k]||0)))*tierNow().pm},
  text(s){return SUB_POOL.find(x=>x.k===s.k).t(s.goal)},
  // 다 채운 미션은 보상을 주고 바꾼다
  check(){
    if(state.rescue!==1&&state.rescue!==2)return;
    const D=this.data();let got=false;
    D.subs.slice().forEach(s=>{
      if(this.prog(s)<s.goal)return;
      const r=this.reward(s);state.money+=r;D.done++;D.lv[s.k]=(D.lv[s.k]||0)+1;
      D.subs=D.subs.filter(x=>x!==s);got=true;
      toast(`🎯 서브 미션 완료! ${this.text(s)} · 보상 +${won(r)}`);Snd.fanfare();
    });
    if(got){this.fill();save();updateHud();if(this.open)showMissions()}   // 열려 있으면 새로 그린다 (돌아갈 곳은 그대로)
    // 10자가 모이면 한 번 알려 준다
    if(state.rescue===1&&state.money>=RESCUE_COST&&!state.talked.rich10){state.talked.rich10=1;save();
      setTimeout(()=>Talk.say("₩10자 모였다!!! M 키(🎯 미션)에서 '배 타러 가기'를 누르자. 점장님 기다려요!","shock"),600)}
  },
  // 메인 미션 시작: 섬에서 온 문자
  begin(){
    if(state.rescue)return;
    state.rescue=1;this.fill();save();
  }
};

/* ---------- 미션 창 ---------- */
function showMissions(back){
  if(back!==undefined)MISSION.back=back||null;
  const D=MISSION.data();MISSION.fill();
  const main=(()=>{
    if(!state.rescue)return `<div class="ms-main"><div class="lv">메인 미션</div><h3>알바 첫날 버티기</h3><p>06:00까지 계산대를 지키자. 손님 머리 위 막대가 다 줄기 전에!</p></div>`;
    if(state.rescue===2)return `<div class="ms-main done"><div class="lv">메인 미션 완료 ✓</div><h3>전 점장님 구출 성공!</h3><p>점장님은 지금 우리 가게 알바다. 가게는 계속 키울 수 있어요.</p></div>`;
    const m=Math.max(0,state.money),digits=m>=1?Math.floor(Math.log10(m))+1:0,pct=clamp(Math.floor(digits/26*100),0,100),can=m>=RESCUE_COST;
    const nx=nextTier();
    return `<div class="ms-main"><div class="lv">메인 미션</div><h3>섬에 갇힌 전 점장님 구하기</h3>
      <p class="ms-sms">"나 섬에 도착했는데 돌아올 수가 없어... 네가 10자 원짜리 배를 타고 들어와야만 날 구할 수 있어. 제발 날 도와줘!"</p>
      <div class="ms-goal"><span>⛵ 배값</span><b>₩10자</b></div>
      <div class="ph-bar"><i style="width:${can?100:pct}%"></i></div>
      <small>통장 ${won(state.money)} · 자릿수 ${digits} / 26</small>
      ${can?`<button id="msBoat" class="btn pulse" type="button">⛵ 배 타러 가기 (₩10자)</button>`:`<p class="ms-tip">${nx?`다음 단계: ☎ Lv.${state.tier+1} ${esc(nx.name)} 리모델링 (${shortWon(nx.cost)}) → 음식값이 올라서 더 빨리 모여요`:"리모델링 끝! 이제 모으기만 하면 돼요"}</p>`}</div>`;
  })();
  const subs=state.rescue?D.subs.map(s=>{const p=MISSION.prog(s);
    return `<li><div class="ms-row"><span>${esc(MISSION.text(s))}</span><b>${p}/${s.goal}</b></div><div class="ph-bar"><i style="width:${Math.floor(p/s.goal*100)}%"></i></div><small>보상 ${won(MISSION.reward(s))}</small></li>`}).join("")
    :`<li class="ms-lock">사장님이 되면 서브 미션이 열려요</li>`;
  openModal(`<div class="panel missions"><div class="ms-head"><h2>🎯 미션</h2><button id="msClose" class="btn sm alt" type="button">닫기 (M)</button></div>${main}
    <h4>서브 미션 <small>(깬 미션 ${D.done}개)</small></h4><ul class="ms-subs">${subs}</ul></div>`);
  $("msClose").onclick=()=>{Snd.click();closeMissions()};
  if($("msBoat"))$("msBoat").onclick=()=>{
    if(GAME.running&&GAME.cur){toast("손님 계산부터 끝내고 가요!");Snd.errBeep();return}
    if(state.money<RESCUE_COST)return;
    Snd.click();MISSION.back=null;closeMissions();state.money-=RESCUE_COST;state.rescue=2;save();updateHud();startEnding();
  };
}
function closeMissions(){closeModal();const b=MISSION.back;MISSION.back=null;if(b)b()}
function toggleMissions(){
  if(MISSION.open){Snd.click();closeMissions();return}
  if(Scr.name!=="game"||!$("modal").hidden||!$("drawer").hidden||PHONE.building)return;
  Snd.click();showMissions(null);
}

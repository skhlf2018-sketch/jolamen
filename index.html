<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>졸라맨 식당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* 졸라맨 식당: 분식집 민트 타일 + 잉크 선 한 가지 룩으로 고정된 게임 화면 */
:root{
  color-scheme:light;
  --ink:#1f1d2b;
  --ink-soft:#56536a;
  --paper:#fffdf7;
  --tile:#dff3ec;
  --tile-line:#c6e6da;
  --mint:#2f9d85;
  --mint-deep:#1f7a66;
  --ketchup:#e2483d;
  --mustard:#f4b63f;
  --mustard-deep:#b9821a;
  --good:#1d7a45;
  --bad:#c0342b;
  --shadow:3px 3px 0 var(--ink);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Nanum Gothic Coding","D2Coding",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background-color:var(--tile);
  background-image:
    linear-gradient(var(--tile-line) 2px,transparent 2px),
    linear-gradient(90deg,var(--tile-line) 2px,transparent 2px);
  background-size:44px 44px;
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.app{max-width:980px;margin-inline:auto;padding-inline:16px;padding-block:14px 48px}

/* ---------- 오프닝 ---------- */
.opening{display:flex;flex-direction:column;gap:14px;padding-block:8px}
.opening-title{font-family:var(--display);font-size:clamp(30px,7vw,54px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.5px}
.opening-title span{color:var(--ketchup)}
.stage{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.stage canvas{display:block;width:100%;height:auto;max-width:100%}
#openCanvas{aspect-ratio:720/440}
.caption{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.caption-text{font-family:var(--display);font-size:clamp(17px,3.6vw,22px);min-height:1.6em;flex:1 1 260px}
.scene-no{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.06em}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.dots i.on{background:var(--ink)}
.opening-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- 버튼 ---------- */
.btn{border:2.5px solid var(--ink);border-radius:12px;padding:10px 18px;min-height:48px;font-family:var(--display);font-size:18px;background:var(--mint);color:#fff;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.warn{background:var(--ketchup)}
.btn.gold{background:var(--mustard);color:var(--ink)}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px}
.btn.big{font-size:22px;min-height:58px;padding-inline:26px}

/* ---------- 게임 헤더 & HUD ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,5vw,32px);margin:0;line-height:1}
.brand h1 span{color:var(--ketchup)}
.day-chip{font-family:var(--mono);font-weight:700;background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 12px;font-size:14px}
.top-actions{display:flex;gap:8px}
.hud{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.label{font-size:12.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
.big-money{font-family:var(--display);font-size:clamp(26px,5vw,36px);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.value{font-family:var(--display);font-size:22px;line-height:1.2}
.stars{font-size:22px;letter-spacing:1px;line-height:1.2}
.stars .on{color:var(--mustard)}
.stars .half{background:linear-gradient(90deg,var(--mustard) 50%,#d9d3c4 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars .off{color:#d9d3c4}
.sub{font-size:13px;color:var(--ink-soft)}
.meter{height:10px;border:2px solid var(--ink);border-radius:99px;background:#eee8da;overflow:hidden;margin-top:6px}
.meter>i{display:block;height:100%;background:var(--mint);transition:width .4s}
.delta{font-family:var(--mono);font-size:13px;font-weight:700;margin-left:6px}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}

/* ---------- 가게 장면 ---------- */
#shopCanvas{aspect-ratio:2/1}
.stage-overlay{position:absolute;inset:auto 10px 10px auto;display:flex;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:700;background:var(--paper)}
.chip.bad{background:#ffe1dc}
.chip.boost{background:#ffeec8}
.chip.calm{background:#e7f6ef}
.chip b{font-family:var(--mono)}

/* ---------- 조작 & 결과 ---------- */
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.controls{display:flex;flex-direction:column;gap:14px}
.slider-row{display:flex;flex-direction:column;gap:4px}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider-head .value{font-size:24px;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--ink-soft)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:12px;border:2px solid var(--ink);border-radius:99px;background:linear-gradient(90deg,var(--mustard) var(--fill,50%),#eee8da var(--fill,50%))}
input[type=range]::-moz-range-track{height:8px;border:2px solid var(--ink);border-radius:99px;background:#eee8da}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--mustard)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
input[type=range]:disabled{opacity:.45}
.forecast{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:2px dashed #cfc8b8;padding-top:12px}
.forecast .value{font-size:32px;font-variant-numeric:tabular-nums}
.mods{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mod{font-family:var(--mono);font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:#eee8da}
.mod.plus{background:#d9f1e4;color:var(--good)}
.mod.minus{background:#ffe1dc;color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 150px}

.receipt{font-family:var(--mono);font-size:14px;background:#fffef9;border:2.5px solid var(--ink);border-radius:6px;padding:16px 16px 20px;box-shadow:var(--shadow);position:relative;
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 96%,#000) 0 0/18px 100%;mask:radial-gradient(circle 7px at 50% 100%,transparent 96%,#000) 0 0/18px 100%}
.receipt h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 4px;text-align:center}
.receipt .r-sub{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-bottom:8px}
.receipt .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-variant-numeric:tabular-nums}
.receipt .row span:last-child{text-align:right;white-space:nowrap}
.receipt hr{border:0;border-top:2px dashed #b9b2a2;margin:8px 0}
.receipt .total{font-weight:700;font-size:17px}
.receipt .vip{color:var(--mustard-deep);font-weight:700}
.receipt .note{font-family:var(--body);font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.5}
.receipt .empty{font-family:var(--body);color:var(--ink-soft);text-align:center;padding:26px 6px}
.pos{color:var(--good)}.neg{color:var(--bad)}

/* ---------- 기록 & 도감 ---------- */
.lower{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-top:12px;align-items:start}
.section-title{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 8px}
.records{max-height:260px;overflow:auto;font-family:var(--mono);font-size:13.5px}
.record{display:grid;grid-template-columns:64px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px dashed #d8d1c1;align-items:center;font-variant-numeric:tabular-nums}
.record:last-child{border-bottom:0}
.record .tag{font-family:var(--body);font-size:11.5px;font-weight:700;border-radius:5px;padding:0 5px;background:#ffeec8;color:var(--mustard-deep);margin-left:4px}
.dex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dex-card{border:2px solid var(--ink);border-radius:12px;padding:8px;text-align:center;background:#fbf6ea}
.dex-card canvas{width:100%;max-width:120px;aspect-ratio:1;display:block;margin-inline:auto}
.dex-card b{font-family:var(--display);font-weight:400;font-size:16px;display:block}
.dex-card small{display:block;font-size:12px;color:var(--ink-soft);line-height:1.4;overflow-wrap:anywhere;word-break:keep-all}
.dex-card.locked canvas{filter:brightness(0) opacity(.25)}
.dex-card .met{font-family:var(--mono);font-size:11.5px;font-weight:700;margin-top:4px}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:rgba(31,29,43,.55);animation:fade .18s ease-out}
.sheet{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:18px;animation:pop .22s cubic-bezier(.2,1.4,.5,1)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 6px;line-height:1.2;text-wrap:balance}
.sheet p{margin:0 0 10px}
.sheet .kicker{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--ketchup)}
.methods{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.method{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:2.5px solid var(--ink);border-radius:12px;background:#fbf6ea;padding:10px 12px;box-shadow:2px 2px 0 var(--ink)}
.method:hover:not(:disabled){background:#fff3d6}
.method:disabled{opacity:.4;cursor:not-allowed}
.method b{font-family:var(--display);font-weight:400;font-size:18px}
.method .cost{font-family:var(--mono);font-weight:700;align-self:center;grid-row:span 2}
.method .odds{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);word-break:keep-all}
.odds-bar{flex:none;width:clamp(56px,16vw,90px);height:8px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#eee8da}
.odds-bar i{display:block;height:100%;background:var(--mint)}
.method.ignore{background:#ffe9e5}
.vip-art{display:block;width:180px;max-width:60%;aspect-ratio:1;margin:0 auto 6px}
.gift-amount{font-family:var(--display);font-size:40px;text-align:center;color:var(--mustard-deep);margin:4px 0 8px;animation:pop .4s cubic-bezier(.2,1.6,.5,1)}
.sheet .actions{margin-top:12px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px;margin-right:8px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 16px;font-weight:700;max-width:calc(100% - 32px);text-align:center;animation:pop .2s}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}

@media (max-width:760px){
  .hud{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .hud .cash{grid-column:1/-1}
  .hud .panel{padding:10px}
  .hud .value{font-size:18px}
  .hud .stars{font-size:16px;letter-spacing:0}
  .board,.lower{grid-template-columns:1fr}
}
@media (max-width:420px){
  .dex{gap:6px}
  .dex-card small{display:none}
  .btn.big{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">

<!-- ========== 오프닝 ========== -->
<section id="opening" class="opening" aria-label="오프닝">
  <h1 class="opening-title">졸라맨 <span>식당</span></h1>
  <div class="stage"><canvas id="openCanvas" width="720" height="440" aria-label="졸라맨이 돈을 모아 가게를 차리는 오프닝 장면"></canvas></div>
  <div class="caption">
    <div id="sceneText" class="caption-text" aria-live="polite">졸라맨이 길을 따라 앞으로 걷는다...</div>
    <div class="scene-no"><span id="sceneNo">오프닝 1 / 6</span></div>
  </div>
  <div class="dots" id="sceneDots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="opening-actions">
    <button id="openNext" class="btn ghost" type="button">다음 장면</button>
    <button id="openSkip" class="btn ghost" type="button">오프닝 건너뛰기</button>
    <button id="openContinue" class="btn gold" type="button" hidden>이어하기</button>
    <button id="openStart" class="btn big" type="button" hidden>가게 문 열기</button>
  </div>
</section>

<!-- ========== 게임 ========== -->
<section id="game" aria-label="식당 운영" hidden>
  <header class="topbar">
    <div class="brand">
      <h1>졸라맨 <span>식당</span></h1>
      <span id="dayChip" class="day-chip">1일차</span>
    </div>
    <div class="top-actions">
      <button id="soundBtn" class="btn ghost small" type="button" aria-pressed="true">소리 켜짐</button>
      <button id="restartBtn" class="btn ghost small" type="button">처음부터</button>
    </div>
  </header>

  <div class="hud">
    <div class="panel cash">
      <div class="label">보유 자금</div>
      <div class="big-money"><span id="cash">₩1,000,000</span><span id="cashDelta" class="delta"></span></div>
    </div>
    <div class="panel">
      <div class="label">오늘의 메뉴</div>
      <div id="menuName" class="value">김치찌개</div>
      <div id="menuNext" class="sub">내일: 불고기</div>
    </div>
    <div class="panel">
      <div class="label">평점</div>
      <div id="stars" class="stars" aria-hidden="true"></div>
      <div id="ratingText" class="sub">4.5 / 5.0</div>
    </div>
    <div class="panel">
      <div class="label">평판</div>
      <div id="repText" class="value">70 / 100</div>
      <div class="meter"><i id="repBar" style="width:70%"></i></div>
    </div>
  </div>

  <div class="stage"><canvas id="shopCanvas" width="720" height="360" aria-label="졸라맨 식당 가게 안 모습"></canvas>
    <div class="stage-overlay"><button id="fastBtn" class="btn gold small" type="button" hidden>빨리 감기</button></div>
  </div>

  <div id="chips" class="chips" aria-live="polite"></div>

  <div class="board">
    <div class="panel controls">
      <div class="slider-row">
        <div class="slider-head"><label for="price" class="label">음식 가격</label><span id="priceValue" class="value">₩8,000</span></div>
        <input id="price" type="range" min="1000" max="30000" step="500" value="8000">
        <div id="priceHint" class="hint">적당한 가격이에요. 평점이 조금 오릅니다.</div>
      </div>
      <div class="slider-row">
        <div class="slider-head"><label for="ad" class="label">광고비</label><span id="adValue" class="value">₩0</span></div>
        <input id="ad" type="range" min="0" max="1000000" step="10000" value="0">
        <div class="hint">₩100,000마다 손님이 약 18명 늘어요. 광고비는 그대로 비용입니다.</div>
      </div>
      <div class="forecast">
        <div>
          <div class="label">예상 손님</div>
          <div id="mods" class="mods"></div>
        </div>
        <div id="customers" class="value">0명</div>
      </div>
      <div class="actions">
        <button id="openBtn" class="btn big" type="button">영업 시작</button>
        <button id="nextBtn" class="btn big ghost" type="button" disabled>다음 날</button>
      </div>
    </div>

    <div id="receipt" class="receipt" aria-live="polite">
      <div class="empty">가격과 광고비를 정하고<br>영업을 시작하세요.</div>
    </div>
  </div>

  <div class="lower">
    <div class="panel">
      <h2 class="section-title">영업 기록</h2>
      <div id="records" class="records"><div class="sub">아직 기록이 없습니다.</div></div>
    </div>
    <div class="panel">
      <h2 class="section-title">VIP 손님 도감</h2>
      <p class="sub" style="margin:0 0 8px">매일 5% 확률로 셋 중 한 명이 찾아옵니다.</p>
      <div id="dex" class="dex"></div>
    </div>
  </div>
</section>
</div>

<!-- ========== 모달 ========== -->
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div id="sheet" class="sheet"></div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
"use strict";

/* ================= 기본 데이터 ================= */
const FOODS=["김치찌개","불고기","돈까스","제육볶음","비빔밥","떡볶이","라면","치킨","카레","오므라이스"];
const COMPLAINTS=[
  {type:"가구 추가",desc:"\"의자가 모자라서 서서 먹었어요!\" 손님들이 가구를 더 놓아 달라고 해요."},
  {type:"마당 오염",desc:"가게 앞 마당에 쓰레기가 쌓여서 지나가는 사람들이 불평해요."},
  {type:"화장실 냄새",desc:"화장실에서 냄새가 난다는 민원이 들어왔어요."},
  {type:"주방 문제",desc:"주방 환풍기가 고장 나서 연기가 홀까지 들어와요."},
  {type:"음식 문제",desc:"\"음식이 너무 짜요!\" 맛에 대한 민원이 들어왔어요."}
];
const VIPS={
  rich:{name:"부자",title:"부자 손님이 찾아왔다!",effect:"음식값의 3배를 혼자 결제하고 평점을 1점 올려 줘요."},
  influencer:{name:"인플루언서",title:"인플루언서가 찾아왔다!",effect:"SNS에 가게를 올려서 다음 날 손님이 50% 늘어나요."},

function forecast(price,ad){
  const mods=[];
  let demand=45+state.rep*0.55;
  // 싸면 손님이 늘지만 객단가가 낮아진다.
  if(price<5000) demand*=1.35;
  else if(price<=9000) demand*=1.05;
  else if(price<=13000) demand*=0.75;
  else demand*=Math.max(.25,1-(price-13000)/18000);
  // 광고는 손님을 늘리지만 광고비 자체가 비용이다.
  const adBoost=(ad/1000000)*180;
  demand+=adBoost;
  if(adBoost>=1) mods.push({t:`광고 +${Math.round(adBoost)}명`,c:"plus"});
  // 평점이 1점 낮아질 때마다 손님 절반.
  const rf=Math.pow(0.5,Math.max(0,5-state.rating));
  demand*=rf;
  if(rf<0.999) mods.push({t:`평점 ×${rf.toFixed(2)}`,c:"minus"});
  // 미해결 민원이 있으면 손님 1/3.
  if(state.unresolved>0){demand/=3;mods.push({t:"민원 ÷3",c:"minus"})}
  // 어제 인플루언서가 다녀갔으면 손님 50% 증가.
  if(state.influencerToday){demand*=1.5;mods.push({t:"인플루언서 ×1.5",c:"plus"})}
  return {customers:Math.max(0,Math.round(demand)),mods};
}

function foodRate(price){
  return price<4500?.68:price<7000?.53:price<=11000?.43:price<=16000?.38:.34;

function ratingAfterPrice(rating,price){
  if(price<=3500) return Math.min(5,round1(rating+.30));
  if(price<=5000) return Math.min(5,round1(rating+.15));
  if(price<=9000) return Math.min(5,round1(rating+.03));
  if(price<=13000) return Math.max(1,round1(rating-.25));
  return Math.max(1,round1(rating-.45));
}

function priceHint(price){
  if(price<=3500) return "아주 싸요! 평점이 크게 오르지만 재료비 비율이 높아요.";

const Sound={
  on:true, ctx:null,
  wake(){
    if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}
    if(this.ctx.state==="suspended") this.ctx.resume().catch(()=>{});
  },
  tone(freq,dur,type="sine",vol=.1,delay=0){
    if(!this.on||!this.ctx) return;
    const t=this.ctx.currentTime+delay;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+dur+.05);
  },
  click(){this.tone(520,.06,"triangle",.06)},
  coin(){this.tone(988,.07,"square",.035);this.tone(1319,.16,"square",.035,.06)},
  door(){this.tone(1175,.25,"sine",.06);this.tone(880,.35,"sine",.05,.12)},

/* ================= 캔버스 공통 ================= */
const INK="#1f1d2b", PAPER="#fffdf7", MINT="#2f9d85", KETCHUP="#e2483d", MUSTARD="#f4b63f";
const FONT_D='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const FONT_M='"Nanum Gothic Coding",ui-monospace,monospace';
const TAU=Math.PI*2;
const seeded=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function makeCanvas(cv,W,H){
  const ctx=cv.getContext("2d");
  return {ctx,W,H,fit(){
    const w0=cv.getBoundingClientRect().width||W;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const w=Math.max(1,Math.round(w0*dpr)), h=Math.max(1,Math.round(w*H/W));
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
    ctx.setTransform(w/W,0,0,h/H,0,0);
  }};
}
function rr(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function circle(ctx,x,y,r,fill,stroke,lw){
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.stroke()}
}
function text(ctx,str,x,y,size,color,align="center",font=FONT_D){
  ctx.font=`${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline="middle";
  ctx.fillStyle=color;ctx.fillText(str,x,y);
}
function outlinedText(ctx,str,x,y,size,fill,stroke=INK,lw=6){
  ctx.font=`${size}px ${FONT_D}`;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.lineJoin="round";ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeText(str,x,y);
  ctx.fillStyle=fill;ctx.fillText(str,x,y);
}
function bubble(ctx,str,x,y,tx,ty,size=22){
  ctx.font=`${size}px ${FONT_D}`;
  const w=ctx.measureText(str).width+28, h=size+22;
  const bx=clamp(x-w/2,6,720-w-6), by=y-h/2;
  ctx.fillStyle=PAPER;ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.lineJoin="round";
  rr(ctx,bx,by,w,h,14);ctx.fill();ctx.stroke();
  // 말꼬리
  const mx=clamp(tx,bx+18,bx+w-18);
  ctx.beginPath();ctx.moveTo(mx-9,by+h-1.5);ctx.lineTo(tx,ty);ctx.lineTo(mx+9,by+h-1.5);
  ctx.fill();ctx.stroke();
  ctx.fillRect(mx-7.5,by+h-4,15,4);
  text(ctx,str,bx+w/2,by+h/2+1,size,INK);
}

/* ================= 졸라맨 ================= */
function getPose(o){
  const t=o.t||0, p=o.pose||"stand";
  let lean=0, legs, arms, head=0;
  const standLegs=[[.12,.08],[-.12,-.08]];
  switch(p){
    case "walk": case "run":{
      const amp=p==="run"?.75:.5, s=Math.sin(t), c=Math.cos(t), s2=-s, c2=-c;
      legs=[[amp*s,amp*s-.55*Math.max(0,c)],[amp*s2,amp*s2-.55*Math.max(0,c2)]];
      arms=[[-amp*.9*s,-amp*.9*s+.4],[-amp*.9*s2,-amp*.9*s2+.4]];
      lean=p==="run"?.2:.05;break;}
    case "bend": lean=1.25;legs=[[.8,-.3],[.7,-.35]];arms=[[.5,.3],[.35,.2]];break;
    case "sit": legs=[[1.55,0],[1.45,.05]];arms=[[.75,1.45],[.6,1.35]];lean=-.04;break;
    case "eat": legs=[[1.55,0],[1.45,.05]];arms=[[.45,2.45+.4*Math.sin(t*7)],[.65,1.4]];lean=.08+.04*Math.sin(t*7);break;
    case "cheer":{const w=.25*Math.sin(t*9);legs=[[.2,.1],[-.2,-.1]];arms=[[2.45+w,2.85+w],[-2.45-w,-2.85-w]];break;}
    case "wave": legs=standLegs;arms=[[2.35,2.7+.45*Math.sin(t*8)],[-.25,-.15]];break;
    case "photo": legs=[[.15,.1],[-.12,-.08]];arms=[[1.25,2.3],[1.05,2.45]];lean=-.06;break;
    case "cook":{const k=Math.sin(t*6);legs=standLegs;arms=[[.95+.15*k,1.65+.3*k],[.8,1.55]];lean=.08;break;}
    case "sad": legs=[[.06,.04],[-.06,-.04]];arms=[[.06,.03],[-.06,-.03]];lean=.22;head=.35;break;
    case "look": legs=standLegs;arms=[[1.7,2.75],[-.2,-.1]];break;
    case "hold": legs=standLegs;arms=[[2.6,3.0],[-.25,-.15]];break;
    case "give": legs=standLegs;arms=[[1.35,1.55],[1.2,1.5]];lean=.12;break;
    default:{const b=.04*Math.sin(t*2);legs=standLegs;arms=[[.22+b,.12+b],[-.22-b,-.12-b]]}
  }
  return {lean,legs,arms,head};
}
function limb(x,y,a1,L1,a2,L2,dir){
  const k=[x+dir*Math.sin(a1)*L1,y+Math.cos(a1)*L1];
  return [k,[k[0]+dir*Math.sin(a2)*L2,k[1]+Math.cos(a2)*L2]];
}
function stroke(ctx,pts,color,w){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke();
}

/* o: {x,y(발 위치),s,dir,pose,t,sitY,lift,hat,hatColor,face,look,glasses,beard,suit,bowtie,sack,item,flash,ink} */
function drawStick(ctx,o){
  const s=o.s||1, dir=o.dir||1, P=getPose(o), ink=o.ink||INK;
  const TH=24,SH=24,TORSO=40,R=13,UA=20,FA=19,LW=5;
  const legs=P.legs.map(l=>limb(0,0,l[0],TH,l[1],SH,dir));
  let hipY=o.sitY!=null?(o.sitY-o.y)/s:-Math.max(legs[0][1][1],legs[1][1][1]);
  hipY-=(o.lift||0)/s;
  ctx.save();
  ctx.translate(o.x,o.y);ctx.scale(s,s);ctx.translate(0,hipY);
  ctx.lineCap="round";ctx.lineJoin="round";
  const neck=[dir*Math.sin(P.lean)*TORSO,-Math.cos(P.lean)*TORSO];
  const sh=[neck[0]*.86,neck[1]*.86];
  const ha=P.lean+P.head;
  const hc=[neck[0]+dir*Math.sin(ha)*(R+3),neck[1]-Math.cos(ha)*(R+3)];
  const arms=P.arms.map(a=>limb(sh[0],sh[1],a[0],UA,a[1],FA,dir));

  // 산타 자루 (등 뒤)
  if(o.sack){
    ctx.save();ctx.translate(sh[0]-dir*18,sh[1]+4);ctx.rotate(-dir*.25);
    ctx.fillStyle="#b07a45";ctx.strokeStyle=ink;ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(0,0,17,21,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-6,-20);ctx.lineTo(0,-27);ctx.lineTo(6,-20);ctx.stroke();
    ctx.restore();
  }
  // 뒷다리, 뒷팔
  stroke(ctx,[[0,0],legs[1][0],legs[1][1]],ink,LW);
  stroke(ctx,[sh,arms[1][0],arms[1][1]],ink,LW);
  if(o.item==="bag")drawMoneyBag(ctx,arms[1][1][0],arms[1][1][1]+8,.8);
  // 몸통
  if(o.suit){
    stroke(ctx,[[0,2],neck],o.suit,17);
    const b=[neck[0]*.3,neck[1]*.3];
    ctx.save();ctx.translate(b[0],b[1]);ctx.rotate(dir*P.lean);
    ctx.fillStyle=ink;ctx.fillRect(-9,-3,18,6);ctx.fillStyle=MUSTARD;ctx.fillRect(-3,-3,6,6);ctx.restore();
  }
  stroke(ctx,[[0,0],neck],ink,LW);
  // 앞다리
  stroke(ctx,[[0,0],legs[0][0],legs[0][1]],ink,LW);
  // 머리
  circle(ctx,hc[0],hc[1],R,o.headFill||PAPER,ink,4.5);
  // 얼굴
  if(o.face!=="none"){
    const ex=hc[0]+dir*4, ey=hc[1]-2;
    if(o.glasses){
      ctx.fillStyle=ink;rr(ctx,ex-5,ey-4,15,7,3);ctx.fill();
      ctx.fillStyle="#fff";ctx.fillRect(ex+dir*6-1,ey-3,2,2);
    }else{
      circle(ctx,ex,ey,1.9,ink);circle(ctx,ex+dir*7,ey,1.9,ink);
      if(o.monocle){circle(ctx,ex+dir*7,ey,4.5,null,MUSTARD,2)}
    }
    ctx.beginPath();ctx.strokeStyle=ink;ctx.lineWidth=2.2;
    const mx=hc[0]+dir*6, my=hc[1]+5;
    if(o.face==="sad"){ctx.arc(mx,my+4,4,1.15*Math.PI,1.85*Math.PI)}
    else if(o.face==="wow"){ctx.arc(mx,my+1,2.6,0,TAU)}
    else{ctx.arc(mx,my-1,4,.15*Math.PI,.85*Math.PI)}
    ctx.stroke();
  }
  if(o.beard){
    ctx.fillStyle="#fff";ctx.strokeStyle=ink;ctx.lineWidth=2.5;ctx.beginPath();
    ctx.moveTo(hc[0]-R+1,hc[1]+1);
    ctx.quadraticCurveTo(hc[0]-R+2,hc[1]+R+14,hc[0]+dir*4,hc[1]+R+16);
    ctx.quadraticCurveTo(hc[0]+R+2,hc[1]+R+12,hc[0]+R-1,hc[1]+1);
    ctx.quadraticCurveTo(hc[0],hc[1]+8,hc[0]-R+1,hc[1]+1);
    ctx.fill();ctx.stroke();
  }
  drawHat(ctx,o,hc,R,dir,ink);
  if(o.bowtie){
    ctx.fillStyle=MUSTARD;ctx.strokeStyle=ink;ctx.lineWidth=2;
    const bx=neck[0],by=neck[1]+5;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-8,by-5);ctx.lineTo(bx-8,by+5);ctx.closePath();
    ctx.moveTo(bx,by);ctx.lineTo(bx+8,by-5);ctx.lineTo(bx+8,by+5);ctx.closePath();ctx.fill();ctx.stroke();
  }
  // 앞팔 + 손에 든 물건
  stroke(ctx,[sh,arms[0][0],arms[0][1]],ink,LW);
  const hx=arms[0][1][0], hy=arms[0][1][1];
  if(o.item==="phone"){
    ctx.save();ctx.translate(hx,hy);ctx.rotate(-dir*.2);
    ctx.fillStyle=ink;rr(ctx,-6,-13,12,20,3);ctx.fill();ctx.fillStyle="#8fd3ff";ctx.fillRect(-4,-10,8,13);
    ctx.restore();
    if(o.flash){
      ctx.save();ctx.globalAlpha=o.flash;ctx.fillStyle="#fff7b0";
      for(let i=0;i<8;i++){const a=i/8*TAU;ctx.beginPath();ctx.moveTo(hx,hy-6);
        ctx.lineTo(hx+Math.cos(a)*34,hy-6+Math.sin(a)*34);ctx.lineTo(hx+Math.cos(a+.2)*18,hy-6+Math.sin(a+.2)*18);ctx.fill()}
      circle(ctx,hx,hy-6,11,"#fff");ctx.restore();
    }
  }else if(o.item==="bill"){
    drawBill(ctx,hx,hy-10,o.billValue||1000,-.2*dir,.55);
  }else if(o.item==="gift"){
    drawGift(ctx,hx,hy-2,.5,0,false);
  }else if(o.item==="ladle"){
    stroke(ctx,[[hx,hy],[hx+dir*10,hy+16]],"#8a8a8a",3);
    circle(ctx,hx+dir*12,hy+19,5,"#b8b8b8",ink,2);
  }else if(o.item==="card"){
    ctx.save();ctx.translate(hx,hy-4);ctx.rotate(dir*.3);ctx.fillStyle=MUSTARD;ctx.strokeStyle=ink;ctx.lineWidth=2;
    rr(ctx,-10,-6,20,13,2);ctx.fill();ctx.stroke();ctx.fillStyle=ink;ctx.fillRect(-7,-2,6,4);ctx.restore();
  }
  ctx.restore();
}

function drawHat(ctx,o,hc,R,dir,ink){
  const [x,y]=hc, top=y-R;
  ctx.lineWidth=2.5;ctx.strokeStyle=ink;
  switch(o.hat){
    case "chef":
      ctx.fillStyle="#fff";rr(ctx,x-11,top-12,22,13,2);ctx.fill();ctx.stroke();
      [[-8,-17,8],[0,-22,9],[8,-17,8]].forEach(([dx,dy,r])=>circle(ctx,x+dx,top+dy,r,"#fff",ink,2.5));
      ctx.fillStyle="#fff";ctx.fillRect(x-9.5,top-14,19,9);break;
    case "top":
      ctx.fillStyle=ink;ctx.fillRect(x-10,top-22,20,22);ctx.fillStyle=KETCHUP;ctx.fillRect(x-10,top-7,20,5);
      ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(x-17,top+1);ctx.lineTo(x+17,top+1);ctx.stroke();break;
    case "santa":
      ctx.fillStyle=KETCHUP;ctx.beginPath();ctx.moveTo(x-14,top+4);
      ctx.quadraticCurveTo(x-2,top-26,x-dir*20,top-14);ctx.lineTo(x+14,top+4);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle="#fff";rr(ctx,x-15,top-1,30,8,4);ctx.fill();ctx.stroke();
      circle(ctx,x-dir*20,top-14,5,"#fff",ink,2);break;
    case "beret":
      ctx.fillStyle=o.hatColor||"#f07aa8";ctx.beginPath();ctx.ellipse(x-dir*2,top+2,16,7,-dir*.15,Math.PI,TAU);ctx.closePath();ctx.fill();ctx.stroke();
      circle(ctx,x-dir*2,top-6,2.5,o.hatColor||"#f07aa8",ink,2);break;
    case "cap":
      ctx.fillStyle=o.hatColor||MINT;ctx.beginPath();ctx.arc(x,top+6,R-1,Math.PI,TAU);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+dir*4,top+5);ctx.lineTo(x+dir*21,top+7);ctx.stroke();break;
    case "bow":
      ctx.fillStyle=o.hatColor||KETCHUP;const bx=x-dir*8,by=top+3;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-9,by-7);ctx.lineTo(bx-9,by+5);ctx.closePath();
      ctx.moveTo(bx,by);ctx.lineTo(bx+9,by-7);ctx.lineTo(bx+9,by+5);ctx.closePath();ctx.fill();ctx.stroke();break;
    case "pony":
      ctx.strokeStyle=o.hatColor||"#6b4a2b";ctx.lineWidth=5;ctx.beginPath();
      ctx.moveTo(x-dir*10,y-8);ctx.quadraticCurveTo(x-dir*24,y-4,x-dir*20,y+12);ctx.stroke();break;
  }
}

/* ================= 소품 ================= */
const BILL_COLOR={1000:"#8fb3e0",5000:"#f0a36b",10000:"#94c98a",50000:"#f2cf5b"};
function drawBill(ctx,x,y,val,rot=0,sc=1){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  ctx.fillStyle=BILL_COLOR[val]||"#94c98a";ctx.strokeStyle=INK;ctx.lineWidth=2.5;
  rr(ctx,-36,-18,72,36,4);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(-16,0,9,11,0,0,TAU);ctx.fillStyle="rgba(255,255,255,.55)";ctx.fill();
  text(ctx,val.toLocaleString("ko-KR"),12,1,13,INK,"center",FONT_M);
  ctx.restore();
}
function drawMoneyBag(ctx,x,y,sc=1){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle=MUSTARD;ctx.strokeStyle=INK;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-6,-12);ctx.quadraticCurveTo(-20,6,-12,14);ctx.lineTo(12,14);
  ctx.quadraticCurveTo(20,6,6,-12);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-8,-12);ctx.lineTo(8,-12);ctx.stroke();
  text(ctx,"₩",0,3,14,INK);ctx.restore();
}
function drawGift(ctx,x,y,sc,t,open){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.strokeStyle=INK;ctx.lineWidth=3;
  ctx.fillStyle=KETCHUP;rr(ctx,-26,-22,52,44,4);ctx.fill();ctx.stroke();
  ctx.fillStyle=MUSTARD;ctx.fillRect(-5,-22,10,44);ctx.strokeRect(-5,-22,10,44);
  const lid=open?-30-10*Math.sin(t*.01):0;
  ctx.save();ctx.translate(0,lid);if(open)ctx.rotate(-.35);
  ctx.fillStyle=KETCHUP;rr(ctx,-30,-32,60,12,3);ctx.fill();ctx.stroke();
  ctx.fillStyle=MUSTARD;ctx.fillRect(-5,-32,10,12);ctx.strokeRect(-5,-32,10,12);
  ctx.beginPath();ctx.ellipse(-10,-38,10,6,-.4,0,TAU);ctx.ellipse(10,-38,10,6,.4,0,TAU);ctx.fill();ctx.stroke();
  ctx.restore();ctx.restore();
}
function sparkle(ctx,x,y,r,color=MUSTARD){
  ctx.fillStyle=color;ctx.beginPath();
  for(let i=0;i<8;i++){const a=i/8*TAU,rad=i%2?r*.35:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}
  ctx.closePath();ctx.fill();
}

function drawPortrait(cv,key,t=0){
  const c=cv.getContext("2d"), W=cv.width, H=cv.height;
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);
  const k=W/160;c.setTransform(k,0,0,k,0,0);
  const bg={rich:"#fff0c2",influencer:"#ffe0ec",santa:"#e3f4ec"}[key];
  circle(c,80,80,74,bg);
  if(key==="rich"){sparkle(c,30,40,9);sparkle(c,132,56,7)}

function drawStreet(ctx,off){
  const g=ctx.createLinearGradient(0,0,0,340);g.addColorStop(0,"#b9e3f2");g.addColorStop(1,"#eef8f3");
  ctx.fillStyle=g;ctx.fillRect(0,0,720,440);
  circle(ctx,620,78,32,"#f8d77a");
  // 구름
  for(let i=0;i<3;i++){
    const x=((i*290-off*.08)%900+900)%900-120, y=60+i*28;
    ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(x,y,40,14,0,0,TAU);ctx.ellipse(x+28,y-8,26,14,0,0,TAU);ctx.fill();
  }
  // 먼 건물
  for(let i=0;i<12;i++){
    const w=50+seeded(i)*40, h=70+seeded(i+20)*110;
    const x=((i*80-off*.3)%960+960)%960-120;
    ctx.fillStyle=i%2?"#b4d9cc":"#a3cbbd";ctx.fillRect(x,330-h,w,h);
    ctx.fillStyle="rgba(255,255,255,.45)";
    for(let wy=330-h+12;wy<318;wy+=22)for(let wx=x+8;wx<x+w-10;wx+=16)ctx.fillRect(wx,wy,7,10);
  }
  // 가로수
  for(let i=0;i<4;i++){
    const x=((i*240-off)%960+960)%960-120;
    ctx.fillStyle="#8a6a4a";ctx.fillRect(x-4,275,8,60);
    circle(ctx,x,262,26,"#6fbf8f",INK,3);
  }
  // 인도와 차도
  ctx.fillStyle="#eadfca";ctx.fillRect(0,330,720,34);
  ctx.strokeStyle="#cbbd9f";ctx.lineWidth=2;
  for(let x=-(off%60);x<720;x+=60){ctx.beginPath();ctx.moveTo(x,330);ctx.lineTo(x,364);ctx.stroke()}
  ctx.fillStyle=INK;ctx.fillRect(0,328,720,3);ctx.fillRect(0,363,720,3);
  ctx.fillStyle="#5f5c6e";ctx.fillRect(0,366,720,74);
  ctx.fillStyle="#f2e9d6";
  for(let x=-(off*1.0%90);x<720;x+=90)ctx.fillRect(x,400,46,6);
}

const Opening={scene:1,t:0,off:0,done:false,
  go(n){this.scene=n;this.t=0;
    $("sceneNo").textContent=`오프닝 ${n} / 6`;
    $("sceneText").textContent=SCENES[n-1];
    [...$("sceneDots").children].forEach((d,i)=>d.classList.toggle("on",i<n));
    const last=n===6;
    $("openNext").hidden=last;$("openSkip").hidden=last;
    $("openStart").hidden=!last;
  }
};

function drawOpening(ctx,dt){
  const O=Opening, n=O.scene, t=O.t;
  const G=352, FX=280, S=1.55;
  let walking=n===1||n===3&&t<1800||n===2&&t<1400;
  const speed=n===3?.1:.17;
  if(walking)O.off+=dt*speed;
  drawStreet(ctx,O.off);
  const wt=O.off*.045;

  if(n===1){
    drawStick(ctx,{x:FX,y:G,s:S,dir:1,pose:"walk",t:wt});
  }
  else if(n===2){
    const bx=t<1400?lerp(610,372,t/1400):372;
    if(t<2600) drawBill(ctx,bx,G-6,1000,.12,.7);
    if(t<1400) drawStick(ctx,{x:FX,y:G,s:S,dir:1,pose:"walk",t:wt});
    else if(t<2600) drawStick(ctx,{x:FX,y:G,s:S,dir:1,pose:"bend",face:"wow"});
    else{
      drawStick(ctx,{x:FX,y:G,s:S,dir:1,pose:"hold",item:"bill",billValue:1000,t:t*.001});
      const k=Math.min(1,(t-2600)/400);
      outlinedText(ctx,"+₩1,000",FX+130,G-200-k*20,34,MUSTARD);
    }
  }
  else if(n===3){
    if(t<1800) drawStick(ctx,{x:FX,y:G,s:S,dir:1,pose:"walk",t:wt});
    else{
      const flip=Math.floor((t-1800)/650)%2?-1:1;
      drawStick(ctx,{x:FX,y:G,s:S,dir:flip,pose:"look",face:"wow"});
      outlinedText(ctx,"?",FX+flip*55,G-210,44,PAPER);
      outlinedText(ctx,"?",FX+flip*85,G-185,30,PAPER);
    }
  }
  else if(n===4){
    const vals=[1000,5000,10000,50000];
    const got=vals.filter((v,i)=>t>350+i*850+500).length;
    drawStick(ctx,{x:190,y:G,s:S,dir:1,pose:t%850<380&&t>850?"cheer":"stand",t:t*.001,face:"happy"});
    vals.forEach((v,i)=>{
      const st=350+i*850;if(t<st)return;
      const k=ease(Math.min(1,(t-st)/500));
      const sx=345+i*98, sy=190;
      drawBill(ctx,lerp(760,sx,k),lerp(120,sy,k),v,(1-k)*1.4,1.05);
      if(k>=1&&i<3)text(ctx,"→",sx+49,sy,22,INK);
    });
    const total=vals.slice(0,got).reduce((a,b)=>a+b,0);
    ctx.fillStyle=PAPER;ctx.strokeStyle=INK;ctx.lineWidth=3;rr(ctx,340,248,290,48,12);ctx.fill();ctx.stroke();
    text(ctx,"모은 돈",362,272,18,"#56536a","left");
    text(ctx,won(total),612,273,26,INK,"right");
  }
  else if(n===5){
    const k=Math.min(1,t/2000), count=Math.floor(8+k*70);
    for(let i=0;i<count;i++){
      const row=Math.floor(Math.sqrt(i)), w=260-row*22;
      const x=480+(seeded(i)-.5)*w, y=G-8-row*17-seeded(i+3)*6;
      drawBill(ctx,x,y,[1000,5000,10000,50000][i%4],(seeded(i+7)-.5)*.8,.8);
    }
    const lift=Math.abs(Math.sin(t*.008))*34;
    drawStick(ctx,{x:190,y:G,s:S,dir:1,pose:"cheer",t:t*.001,lift,face:"wow"});
    const amt=Math.round(lerp(66000,START_CASH,ease(k))/1000)*1000;
    outlinedText(ctx,won(amt),360,80,56,MUSTARD,INK,8);
    if(k>=1)for(let i=0;i<6;i++)sparkle(ctx,360+Math.cos(i+t*.003)*(190+i*6),80+Math.sin(i*2+t*.003)*44,8+4*Math.sin(t*.01+i));
  }
  else{
    // 가게 건물
    const X=390,Y=112,W=290,H=G-Y;
    ctx.fillStyle="#f6efe0";ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.fillRect(X,Y,W,H);ctx.strokeRect(X,Y,W,H);
    const opened=t>1600;
    ctx.fillStyle=opened?"#bfe8ff":"#c9c3b5";ctx.fillRect(X+22,Y+110,130,90);ctx.strokeRect(X+22,Y+110,130,90);
    ctx.beginPath();ctx.moveTo(X+87,Y+110);ctx.lineTo(X+87,Y+200);ctx.stroke();
    ctx.fillStyle="#9b6b43";ctx.fillRect(X+185,Y+120,74,H-120);ctx.strokeRect(X+185,Y+120,74,H-120);
    circle(ctx,X+245,Y+185,4,MUSTARD,INK,2);
    // 차양
    for(let i=0;i<9;i++){ctx.fillStyle=i%2?"#fff":(opened?MINT:"#9a9aa6");
      ctx.beginPath();ctx.moveTo(X-10+i*34.4,Y+62);ctx.lineTo(X+24.4+i*34.4,Y+62);ctx.lineTo(X+24.4+i*34.4,Y+88);
      ctx.arc(X+7.2+i*34.4,Y+88,17.2,0,Math.PI);ctx.closePath();ctx.fill();ctx.stroke()}
    // 간판
    ctx.fillStyle=opened?KETCHUP:"#fff";rr(ctx,X+20,Y+8,W-40,46,8);ctx.fill();ctx.stroke();
    if(opened){
      text(ctx,"졸라맨 식당",X+W/2,Y+32,30,"#fff");
      for(let i=0;i<9;i++)circle(ctx,X+34+i*28.5,Y+8,4,Math.floor(t/250+i)%2?"#fff7b0":MUSTARD,INK,1.5);
    }else{
      text(ctx,"임대 문의",X+W/2,Y+32,28,INK);
      ctx.fillStyle="#fff";ctx.fillRect(X+26,Y+130,90,30);ctx.strokeRect(X+26,Y+130,90,30);
      text(ctx,"빈 가게",X+71,Y+146,16,INK);
    }
    drawStick(ctx,{x:230,y:G,s:S,dir:1,pose:opened?"cheer":"look",t:t*.001,face:opened?"happy":"wow"});
    if(t>250) bubble(ctx,"가게를 차려야겠다!",230,86,246,122,24);
    if(!opened&&t>250){
      // 전구 = 아이디어
      circle(ctx,158,160,15,"#fff3a0",INK,3);ctx.fillStyle="#b8b2a3";ctx.fillRect(151,174,14,9);ctx.strokeRect(151,174,14,9);
      for(let i=0;i<5;i++){const a=-Math.PI*.9+i*.45;stroke(ctx,[[158+Math.cos(a)*22,160+Math.sin(a)*22],[158+Math.cos(a)*30,160+Math.sin(a)*30]],INK,3)}
    }
  }
}

function steam(ctx,x,y,t,a=1){
  ctx.save();ctx.globalAlpha=.55*a;ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.lineCap="round";
  for(let i=0;i<3;i++){
    const ph=(t*.0012+i*.33)%1, yy=y-ph*26;
    ctx.globalAlpha=.6*a*(1-ph);ctx.beginPath();
    ctx.moveTo(x-8+i*8,yy);ctx.quadraticCurveTo(x-12+i*8,yy-6,x-8+i*8,yy-12);ctx.stroke();
  }
  ctx.restore();
}

  ctx.strokeStyle="#7a5332";ctx.lineWidth=4;ctx.lineCap="round";

  stroke(ctx,[[s.x-14,309],[s.x+14,309]],"#7a5332",5);

function drawStink(ctx,t){
  const n=Math.min(3,state.unresolved);
  const xs=[112,560,330];
  for(let i=0;i<n;i++){
    ctx.save();ctx.strokeStyle="#7fa04a";ctx.lineWidth=3;ctx.lineCap="round";
    for(let k=0;k<3;k++){
      const ph=(t*.0006+k*.33)%1, x=xs[i]+k*10-10, y=330-ph*70;
      ctx.globalAlpha=.8*(1-ph);ctx.beginPath();ctx.moveTo(x,y);
      ctx.bezierCurveTo(x-8,y-8,x+8,y-14,x,y-22);ctx.stroke();
    }
    ctx.restore();
    // 쓰레기 봉투
    ctx.fillStyle="#3b3a44";ctx.beginPath();ctx.ellipse(xs[i],342,11,9,0,0,TAU);ctx.fill();
    ctx.fillStyle="#3b3a44";ctx.beginPath();ctx.moveTo(xs[i]-4,334);ctx.lineTo(xs[i],328);ctx.lineTo(xs[i]+4,334);ctx.fill();
  }
}

function startBizAnim(opts){
  SEATS.forEach(s=>s.taken=false);
  Object.assign(Biz,{on:true,t:0,total:opts.total,price:opts.price,
    V:opts.total>0?Math.min(opts.total,12):0,spawned:0,finished:0,shown:0,
    sprites:[],pops:[],lastSpawn:-9999,vip:opts.vip,vipSprite:null,vipState:opts.vip?"wait":null,
    banner:null,endT:null,onDone:opts.onDone,speed:reduceMotion?5:1});
  Shop.sign="영업 중";Shop.chefMood="cook";Shop.complainer=false;
  $("fastBtn").hidden=false;
}

function spawnSprite(seat,vip){
  if(seat)seat.taken=true;
  const look=vip?VIP_LOOK[vip]:pick(CUSTOMER_LOOKS);
  const target=vip==="influencer"?360:vip==="santa"?548:seat.x;
  const c={x:DOOR_X-20,seat,target,state:"in",t:0,look,vip,walkT:Math.random()*6};
  Biz.sprites.push(c);
  return c;
}

function pop(x,y,str,color=MUSTARD,size=22){Biz.pops.push({x,y,str,color,size,t:0})}

function updateBiz(dt){
  const B=Biz;if(!B.on)return;
  dt=Math.min(dt,60)*B.speed;B.t+=dt;
  if(B.spawned<B.V&&B.t-B.lastSpawn>420){
    const free=SEATS.filter(s=>!s.taken);
    if(free.length){spawnSprite(pick(free),null);B.spawned++;B.lastSpawn=B.t}
  }
  if(B.vipState==="wait"&&B.t>1300&&B.spawned>=Math.ceil(B.V/2)){
    let seat=null;
    if(B.vip==="rich"){const free=SEATS.filter(s=>!s.taken);seat=free.length?free[free.length>1?1:0]:null}
    if(B.vip!=="rich"||seat){
      B.vipSprite=spawnSprite(seat,B.vip);B.vipState="in";
      B.banner={str:`VIP 방문! ${VIPS[B.vip].name}`,t:0};
      Sound.fanfare();
    }
  }
  for(const c of B.sprites){
    c.t+=dt;const sp=.3*dt;
    if(c.state==="in"){
      c.x=Math.min(c.target,c.x+sp);c.walkT+=dt*.016;
      if(c.x>=c.target){c.state=c.seat?"eat":"act";c.t=0;if(c.vip==="santa")Sound.bells()}
    }else if(c.state==="eat"){
      if(c.t>(c.vip?2000:1500)){c.state="out";c.t=0;c.seat.taken=false;onEaten(c)}
    }else if(c.state==="act"){
      if(c.vip==="santa"&&c.t>700)Shop.gift=true;
      if(c.vip==="influencer"&&Math.floor(c.t/380)!==Math.floor((c.t-dt)/380))Sound.tone(1800,.05,"square",.03);
      if(c.t>2000){c.state="out";c.t=0;onActed(c)}
    }else if(c.state==="out"){
      c.x-=sp;c.walkT+=dt*.016;
      if(c.x<=DOOR_X-24){c.gone=true;if(c.vip)B.vipState="done"}
    }
  }
  B.sprites=B.sprites.filter(c=>!c.gone);
  B.pops.forEach(p=>p.t+=dt);B.pops=B.pops.filter(p=>p.t<1300);
  if(B.banner){B.banner.t+=dt;if(B.banner.t>2600)B.banner=null}
  const vipDone=!B.vip||B.vipState==="done";
  if(B.spawned>=B.V&&B.sprites.length===0&&vipDone){
    if(B.endT==null)B.endT=B.t;
    if(B.t-B.endT>(B.V===0?1800:500))endBizAnim();
  }
}

function onEaten(c){
  const B=Biz, sx=c.seat.x+c.seat.dir*18;
  if(c.vip==="rich"){
    pop(sx,236,"+"+won(B.price*3),MUSTARD,26);
    pop(sx,206,"평점 +1",PAPER,20);
    Sound.success();return;
  }
  B.finished++;
  const now=Math.round(B.total*B.finished/B.V), got=now-B.shown;B.shown=now;
  pop(sx,240,"+"+won(got*B.price),PAPER,20);
  Sound.coin();
}
function onActed(c){
  if(c.vip==="influencer"){pop(c.x,190,"#졸라맨식당 #맛집",PAPER,20);Sound.success()}
  if(c.vip==="santa"){pop(c.x,190,"메리 크리스마스!",PAPER,20)}
}

function endBizAnim(){
  if(!Biz.on)return;
  Biz.on=false;Biz.sprites=[];SEATS.forEach(s=>s.taken=false);
  $("fastBtn").hidden=true;
  Shop.sign="영업 종료";

}

function drawSpriteStick(ctx,c,t){
  const base={...c.look,s:.9,t:c.walkT,y:FLOOR,flash:0};
  if(c.state==="in"||c.state==="out"){
    drawStick(ctx,{...base,x:c.x,dir:c.state==="in"?1:-1,pose:"walk"});

    drawStick(ctx,{...base,x:c.seat.x,dir:c.seat.dir,pose:c.t<300?"sit":"eat",sitY:SEAT_Y,t:c.t*.001,
      item:c.vip==="rich"?"card":null});

    const f=(c.t%380)/380;

function drawShop(ctx,t){
  drawRoom(ctx);
  drawBoard(ctx);
  drawDoor(ctx);
  drawKitchen(ctx,t);

  // 떠오르는 금액
  B.pops.forEach(p=>{

    outlinedText(ctx,p.str,p.x,p.y-k*46,p.size,p.color,INK,5);ctx.restore();
  });
  // 진행 표시

  }
  if(B.banner){
    const k=Math.min(1,B.banner.t/250), out=Math.max(0,(B.banner.t-2200)/400);
    ctx.save();ctx.globalAlpha=1-out;ctx.translate(360,40+(1-k)*-40);
    ctx.fillStyle=MUSTARD;ctx.strokeStyle=INK;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-170,-24);ctx.lineTo(170,-24);ctx.lineTo(186,0);ctx.lineTo(170,24);ctx.lineTo(-170,24);ctx.lineTo(-186,0);ctx.closePath();ctx.fill();ctx.stroke();
    text(ctx,B.banner.str,0,2,26,INK);
    ctx.restore();
  }
}

const METHODS={old:{name:"구닥다리 방법",chance:.3},normal:{name:"일반 방법",chance:.5},best:{name:"최고급 방법",chance:1}};

function showComplaint(c,mode){
  const m=k=>{const cost=c[k+"Cost"],M=METHODS[k];
    return `<button class="method" type="button" data-m="${k}" ${state.cash<cost?"disabled":""}>
      <b>${M.name}</b><span class="cost">${won(cost)}</span>
      <span class="odds"><span class="odds-bar"><i style="width:${M.chance*100}%"></i></span>성공 확률 ${M.chance*100}%</span></button>`};
  const last=mode==="new"
    ?`<button class="method ignore" type="button" data-m="ignore"><b>이번에는 무시하기</b><span class="cost">₩0</span><span class="odds">미해결로 남아 손님 ⅓, 매출 -10%가 계속돼요.</span></button>`
    :`<button class="method" type="button" data-m="cancel"><b>다음에 하기</b><span class="cost"></span><span class="odds">민원은 그대로 남아 있어요.</span></button>`;
  openModal(`<div class="kicker">${mode==="new"?"민원 발생":`미해결 민원 · ${state.unresolved}개 남음`}</div>
    <h2 id="modalTitle">${esc(c.type)}</h2><p>${esc(c.desc)}</p>
    <div class="methods">${m("old")}${m("normal")}${m("best")}${last}</div>`);
  $("sheet").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{Sound.click();tryResolve(c,b.dataset.m,mode)});
}

function tryResolve(c,method,mode){
  if(method==="cancel"){closeModal();return}
  if(method==="ignore"){
    state.unresolved++;state.pending.push(c);
    today.complaintNote=`${c.type} 민원을 무시했어요. 미해결로 남아요.`;
    Sound.fail();closeModal();Shop.complainer=false;runDay();return;
  }
  const cost=c[method+"Cost"], M=METHODS[method];
  if(state.cash<cost)return;
  state.cash-=cost;
  if(mode==="new")today.complaintCost+=cost;
  render();
  openModal(`<div class="kicker">민원 처리</div><h2 id="modalTitle"><span class="spin"></span>${M.name}으로 해결 중...</h2><p>${won(cost)}을 지불했어요.</p>`);
  setTimeout(()=>{
    const ok=Math.random()<M.chance;
    if(mode==="new"){
      if(!ok){state.unresolved++;state.pending.push(c)}
      today.complaintNote=ok?`${c.type} 민원을 ${M.name}으로 해결했어요.`:`${c.type} 민원 해결에 실패했어요. 미해결로 남아요.`;
    }else{
      if(ok){state.pending.shift();state.unresolved=Math.max(0,state.unresolved-1)}
      save();
    }
    ok?Sound.success():Sound.fail();
    openModal(`<div class="kicker">${ok?"해결 성공":"해결 실패"}</div>
      <h2 id="modalTitle" class="${ok?"pos":"neg"}">${ok?"민원 해결 성공!":"민원 해결 실패..."}</h2>
      <p>${ok?`${esc(c.type)} 문제가 깔끔하게 해결됐어요.`:`${won(cost)}을 썼지만 해결되지 않았어요. 미해결 민원 ${state.unresolved}개가 계속 영향을 줘요.`}</p>
      <div class="actions"><button id="goOn" class="btn" type="button">${mode==="new"?"영업 계속하기":"확인"}</button></div>`);
    $("goOn").onclick=()=>{closeModal();if(mode==="new"){Shop.complainer=false;runDay()}else render()};
    render();
  },reduceMotion?200:900);
}

      $("giftOut").innerHTML=`<div class="gift-amount">${won(L.gift)}</div><p style="text-align:center">선물 상자에서 ${won(L.gift)}이 나왔어요!</p>`;
      $("giftBtn").hidden=true;$("vipOk").hidden=false;$("vipOk").focus();
      Sound.coin();setTimeout(()=>Sound.success(),120);
    };
  }
  $("vipOk").onclick=()=>{closeModal();after&&after()};
}

function showBankrupt(){
  const best=state.records.reduce((b,r)=>r.net>(b?b.net:-Infinity)?r:b,null);
  const met=VIP_KEYS.reduce((s,k)=>s+(state.vipMet[k]||0),0);
  openModal(`<div class="kicker">영업 종료</div><h2 id="modalTitle">파산했습니다</h2>
    <p>졸라맨 식당은 <b>${state.day}일</b> 동안 문을 열었어요.</p>
    <div class="receipt" style="margin-block:10px">
      <div class="row"><span>버틴 날</span><span>${state.day}일</span></div>
      <div class="row"><span>최고의 날</span><span>${best?`${best.day}일차 ${signed(best.net)}`:"-"}</span></div>
      <div class="row"><span>만난 VIP</span><span>${met}명</span></div>
      <div class="row"><span>마지막 평점</span><span>${state.rating.toFixed(1)}</span></div>
    </div>
    <div class="actions"><button id="againBtn" class="btn" type="button">처음부터 다시</button></div>`);
  $("againBtn").onclick=()=>{closeModal();newGame(true)};
}

function confirmRestart(){
  openModal(`<div class="kicker">처음부터</div><h2 id="modalTitle">처음부터 다시 할까요?</h2>
    <p>지금까지의 자금, 평점, 기록이 모두 사라져요.</p>
    <div class="actions"><button id="noBtn" class="btn ghost" type="button">계속하기</button><button id="yesBtn" class="btn warn" type="button">다시 시작</button></div>`);
  $("noBtn").onclick=closeModal;
  $("yesBtn").onclick=()=>{closeModal();newGame(true)};
}

/* ================= 하루 흐름 ================= */
function startBusiness(){
  if(state.opened||state.bankrupt||Biz.on)return;
  Sound.wake();Sound.door();
  ensurePending();
  state.opened=true;state.resultReady=false;cashDelta=null;
  today={price:+$("price").value,ad:+$("ad").value,
    vip:Math.random()<vipChance()?pick(VIP_KEYS):null,
    complaintCost:0,complaintNote:null};
  if(Math.random()<COMPLAINT_CHANCE){
    Shop.complainer=true;render();
    setTimeout(()=>showComplaint(makeComplaint(),"new"),reduceMotion?0:500);
  }else runDay();
  render();
}

function runDay(){
  const {customers}=forecast(today.price,today.ad);
  today.customers=customers;
  startBizAnim({total:customers,price:today.price,vip:today.vip,onDone:finishBusiness});
  render();
}

function finishBusiness(){
  const {price,ad,customers,vip}=today;
  const gross=customers*price;
  const rate=foodRate(price);
  const foodCost=Math.round(gross*rate);
  const cp=state.unresolved>0?.90:1;
  const rp=Math.max(0,1-(Math.floor((5-state.rating)/0.5+1e-9)*0.05));
  const sales=Math.round(gross*cp*rp);
  const complaintLoss=Math.round(gross-gross*cp);
  const ratingLoss=gross-complaintLoss-sales;
  const vipSales=vip==="rich"?price*3:0;
  const gift=vip==="santa"?50000+Math.floor(Math.random()*51)*1000:0;
  const profit=sales+vipSales-foodCost-ad-FIXED_COST;
  const net=profit+gift-today.complaintCost;
  state.cash+=profit+gift;

  const ratingBefore=state.rating, repBefore=state.rep;
  state.rating=ratingAfterPrice(state.rating,price);
  const ratingBeforeVip=state.rating;
  if(vip==="rich")state.rating=Math.min(5,round1(state.rating+1));
  if(state.rating>=4.5)state.rep=Math.min(100,state.rep+3);
  if(state.rating<3)state.rep=Math.max(0,state.rep-7);
  if(vip==="influencer")state.influencerNext=true;
  if(vip)state.vipMet[vip]=(state.vipMet[vip]||0)+1;

  state.last={day:state.day,food:foodOf(state.day),customers,price,gross,complaintLoss,ratingLoss,
    ratingPct:Math.round((1-rp)*100),vip,vipSales,gift,foodRate:rate,foodCost,ad,fixed:FIXED_COST,
    profit,net,complaintCost:today.complaintCost,complaintNote:today.complaintNote,
    ratingBefore,ratingBeforeVip,rating:state.rating,repBefore,rep:state.rep,boost:state.influencerToday};
  state.records.unshift({day:state.day,food:foodOf(state.day),net,vip});
  state.resultReady=true;cashDelta=net;
  if(state.cash<=0){state.cash=0;state.bankrupt=true;state.resultReady=false}
  Shop.chefMood=state.bankrupt?"sad":customers>0?"cheer":"sad";
  setTimeout(()=>{if(!Biz.on&&Shop.chefMood==="cheer")Shop.chefMood="idle"},2200);
  today=null;
  save();render();
  const after=()=>{if(state.bankrupt){clearSave();showBankrupt()}};
  if(vip)showVip(state.last,after);else after();
  if(!vip&&!state.bankrupt)(net>=0?Sound.success:Sound.fail).call(Sound);
}

function nextDay(){
  if(!state.resultReady||state.bankrupt)return;
  Sound.wake();Sound.click();
  state.day++;state.opened=false;state.resultReady=false;
  state.influencerToday=state.influencerNext;state.influencerNext=false;
  cashDelta=null;Shop.gift=false;Shop.sign="준비 중";Shop.chefMood="idle";
  save();render();
  toast(`${state.day}일차 시작! 오늘의 메뉴는 ${foodOf(state.day)}입니다.`+(state.influencerToday?" 인플루언서 효과로 손님이 몰려와요!":""));
}

/* ================= 시작 / 이어하기 ================= */
function enterGame(){
  Sound.wake();
  $("opening").hidden=true;$("game").hidden=false;
  dexBuilt=false;render();window.scrollTo(0,0);
}
function restore(d){
  state=Object.assign(freshState(),d.state);
  state.vipMet=Object.assign({rich:0,influencer:0,santa:0},state.vipMet);
  if(state.opened&&!state.resultReady)state.opened=false;
  ensurePending();
  if(d.price)$("price").value=d.price;
  if(d.ad!=null)$("ad").value=d.ad;
  Shop.sign=state.resultReady?"영업 종료":"준비 중";Shop.chefMood="idle";Shop.gift=false;Shop.complainer=false;
  cashDelta=null;
}
function newGame(replay){
  clearSave();state=freshState();ensurePending();today=null;cashDelta=null;
  Biz.on=false;Biz.sprites=[];Biz.pops=[];
  Object.assign(Shop,{sign:"준비 중",complainer:false,gift:false,chefMood:"idle"});
  $("price").value=8000;$("ad").value=0;
  if(replay){
    $("game").hidden=true;$("opening").hidden=false;
    $("openContinue").hidden=true;$("openStart").textContent="가게 문 열기";
    Opening.off=0;Opening.go(1);window.scrollTo(0,0);
  }
}

/* ================= 이벤트 ================= */
$("price").addEventListener("input",render);
$("ad").addEventListener("input",render);
$("openBtn").onclick=startBusiness;
$("nextBtn").onclick=nextDay;
$("fastBtn").onclick=()=>{Biz.speed=5;$("fastBtn").hidden=true};
$("restartBtn").onclick=()=>{Sound.wake();confirmRestart()};
$("soundBtn").onclick=()=>{
  Sound.on=!Sound.on;Sound.wake();
  $("soundBtn").textContent=Sound.on?"소리 켜짐":"소리 꺼짐";
  $("soundBtn").setAttribute("aria-pressed",String(Sound.on));
  Sound.click();
};
$("openNext").onclick=()=>{Sound.wake();Opening.go(Math.min(6,Opening.scene+1))};
$("openSkip").onclick=()=>{Sound.wake();Opening.go(6);Opening.t=1700};
$("openStart").onclick=()=>{
  if(!$("openContinue").hidden){newGame(false)} // 저장이 있어도 새로 시작
  Sound.wake();Sound.door();enterGame();
};
$("openContinue").onclick=()=>{
  const d=loadSave();if(d)restore(d);
  Sound.wake();Sound.door();enterGame();
};
$("openCanvas").addEventListener("click",()=>{if(Opening.scene<6){Sound.wake();Opening.go(Opening.scene+1)}});

/* ================= 메인 루프 ================= */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(100,now-lastT);lastT=now;
  if(!$("opening").hidden){
    Opening.t+=dt;
    if(Opening.scene<6&&Opening.t>=SCENE_MS)Opening.go(Opening.scene+1);
    oc.fit();drawOpening(oc.ctx,dt);
  }else{
    Shop.t+=dt;
    const wasOn=Biz.on;
    updateBiz(dt);
    sc.fit();drawShop(sc.ctx,Shop.t);
    if(wasOn&&Biz.on&&Math.floor(Shop.t/400)!==Math.floor((Shop.t-dt)/400))renderReceipt();
  }
  document.querySelectorAll("canvas[data-art]").forEach(cv=>{
    const a=cv.dataset.art;
    if(VIPS[a])drawPortrait(cv,a,now);
    else{
      const c=cv.getContext("2d"),k=cv.width/160;
      c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.setTransform(k,0,0,k,0,0);
      circle(c,80,80,74,"#e3f4ec");
      const open=a==="gift-open";
      drawGift(c,80,104+(open?0:Math.sin(now*.012)*2),1.35,now,open);
      if(open)for(let i=0;i<6;i++)sparkle(c,80+Math.cos(i+now*.002)*56,58+Math.sin(i*2+now*.002)*30,7);
    }
  });
  requestAnimationFrame(frame);
}

/* ================= 부팅 ================= */
function start(data){
  const saved=data&&data.state?data:loadSave();
  if(saved){
    restore(saved);
    if(data&&data.state&&data.inGame){enterGame()}
    else{
      Opening.go(6);Opening.t=1700;
      $("openContinue").hidden=false;$("openStart").textContent="새로 시작";
    }
  }else Opening.go(1);
  render();
  requestAnimationFrame(frame);
}
try{window.claude?.hot?.snapshot?.(()=>({v:2,state:JSON.parse(JSON.stringify(state)),price:+$("price").value,ad:+$("ad").value,inGame:$("opening").hidden}))}catch(e){}
const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.ready==="function")hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
